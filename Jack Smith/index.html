<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Jack Smith GameをRuffle WebAssemblyで実行">
    <meta name="keywords" content="Jack Smith, Ruffle, WebAssembly, Canvas, SWF">
    <meta name="author" content="Gemini programming隊">
    <meta property="og:title" content="Jack Smith SWF Wasm Demo">
    <meta property="og:url" content="https://kakaomames.github.io/rei/">
    <meta property="og:image" content="https://kakaomames.github.io/rei/logo.png">
    <title>Jack Smith Game - Wasm Canvas</title>
    
    <style>
        body { 
            width: 1080px;  
            height: 810px;  
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            background-color: #1a1a1a; 
            color: #ccc;
        }
        #RufflePlayer {
            width: 0; /* 適切なサイズを設定 */
            height: 0; /* 適切なサイズを設定 width: 1080px; height: 810px; /* 適切なサイズを設定 */    
        }
        /* RuffleがCanvasを挿入するコンテナ */
        #thegame {
            width: 1080px ; /* 適切なサイズを設定 */
            height: 810px; /* 適切なサイズを設定 width: 1080px; height: 810px; /* 適切なサイズを設定 */
            border: 1px solid gold; /* 目立つように枠線を付けました */
            background-color: black;
        }
    </style>
    
    <script>
        function stayCalm() {
            event.preventDefault() ;
        }
    </script>
</head>
<body>
    
    <div id="thegame"></div>
    
    <script>
        window.RufflePlayer = window.RufflePlayer || {};
        window.RufflePlayer.config = {
            "width": "1080px", 
            "lheight": "810bx",
            "splashScreen": false,
            "allowFullscreen": true,
            "scale": "exactfit",
            "forceScale": true,
            "openUrlMode": "deny", // 外部サイトへの遷移を許可しない
            "allowNetworking": "none" // ネットワークアクセスを許可しない
        };

        window.addEventListener("load", (event) => {
            const ruffle = window.RufflePlayer.newest();
            console.log(`ruffle:${ruffle}`);
            
            const player = ruffle.createPlayer();
            console.log(`player:${player}`);
            
            const container = document.getElementById("thegame");
            console.log(`container:${container}`);
            
            // 最初にDOM要素にプレイヤーを追加
            container.appendChild(player);
            
            // SWFファイルをロード (Canvasがこの時点でplayerの子要素として生成されます)
            player.load("jacksmith.swf"); 
            console.log("SWFファイル 'jacksmith.swf' をWasmでロードしました！");
            
            // 💡 隊員へのヒント: player.load() の後、player要素内を検証すると <canvas> が見つかるはずです！
        });
    </script>
    
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
</body>
</html>
