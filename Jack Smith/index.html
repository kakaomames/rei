<h2>About Jack Smith Game</h2>
<p>Jack Smith is a blacksmith simulation game. Take customer orders, select the correct weapon type, then pour the metal. Each fighter will then grade you on your forging skills along with how aligned the sword handle or arrows are. Swords will be graded on hammering activity while bows are graded on how even the stretch is. After all weapons have been made the fighters then go on and attack beasts. Most of the fighting activity is automatic, but the quality of your weaponry determines how long your fighters will fight and if they will beat all the enemies. Each time enemies get hit they may drop loot which you can pick up for inventory by scrolling your mouse over it. After a few days you obtain a cannon which you can fire periodically at enemies to help your troops. As you progress through the game you unlock new weapons and face more powerful enemies. After a couple days you unlock a shop where you can buy additional supplies including sword grips, arrows, shields, poles, guards, caps, and ore. This game was originally built as an Adobe Flash application. We published it on our site using a Ruffles technology plugin to render it in HTML canvas mode in modern web browsers. All modern web browsers like Microsoft Edge, Apple Safari, Google Chrome, Mozilla Firefox and Opera should support it. This game works on just about any type of computing device including Microsoft Windows desktop computers, Apple OSX Mac computers, iOS powered tablets and phones like the iPad and iPhone,  laptops like the Google Chromebook, and the many types of mobile phones from manufacturers like Samsung which are powered by Google Android. As this game is rather detailed it is best played on a desktop device with an attached keyboard and a connected mouse.</p>
