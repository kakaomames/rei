<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="PH-Translator Web Edition - Gemini programming隊 遠隔司令部">
    <meta property="og:title" content="PH-Translator Web">
    <meta property="og:image" content="https://kakaomames.github.io/rei/logo.png">
    <title>PH-Translator Web | 遠隔起動モード</title>
    
    <link rel="icon" href="https://kakaomames.github.io/rei/logo.png">
    <script src="https://cjrtnc.leaningtech.com/3.0/loader.js"></script>

    <style>
        body { margin: 0; background: #0d1117; color: #58a6ff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        #status-bar { margin-bottom: 15px; font-weight: bold; text-shadow: 0 0 10px rgba(88, 166, 255, 0.5); }
        #container { border: 1px solid #30363d; border-radius: 6px; background: #000; width: 854px; height: 480px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

    <div id="status-bar">🛰️ 遠隔ブランチより物資(JAR)を転送中...</div>
    <div id="container"></div>

    <script>
    (async function() {
        const status = document.getElementById("status-bar");
        
        try {
            status.innerText = "🔌 CheerpJ エンジンを接続中...";
            await cheerpjInit();
            
            const container = document.getElementById("container");
            await cheerpjCreateDisplay(854, 480, container);
            
            // 【重要】 masterブランチにあるjarを直接指定するぞ！
            // URLが正しいか、あとでブラウザでこのURLを叩いてダウンロードが始まるか確認しておくと完璧だ！
            const jarURL = "https://kakaomames.github.io/rei/PH-Translator.jar";
            
            // masterブランチのassetsも参照できるようにパスを組むぞ
            // GitHub Pagesなら同じドメイン内なのでこれでいけるはずだ！
            const classpath = jarURL;
            const mainClass = "Main"; 

            console.log("Loading JAR from: " + jarURL);
            status.innerText = "🚀 29MBのJARを読み込み中... (少し時間がかかるぞ)";
            
            const exitCode = await cheerpjRunMain(mainClass, classpath);
            
            status.innerText = "✅ 任務完了。終了コード: " + exitCode;
        } catch (e) {
            status.innerText = "❌ 転送エラー！F12でログを確認せよ。";
            console.error(e);
        }
    })();
    </script>
</body>
</html>
