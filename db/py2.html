<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Python Code Optimizer - Gemini programming隊 Special Unit">
    <meta name="author" content="カカオマメ">
    <meta property="og:title" content="Python File Commander Pro">
    <meta property="og:image" content="https://kakaomames.github.io/rei/logo.png">
    <title>Python File Commander Pro - Gemini programming隊</title>
    <style>
        :root { --main-bg: #1e1e2e; --accent: #fab387; --text: #cdd6f4; --danger: #f38ba8; }
        body { background-color: var(--main-bg); color: var(--text); font-family: 'Consolas', monospace; margin: 0; padding: 20px; }
        .base-camp { max-width: 950px; margin: 0 auto; background: #313244; padding: 25px; border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,0.5); }
        h1 { color: var(--accent); border-left: 5px solid var(--accent); padding-left: 15px; font-size: 22pt; margin-top: 0; }
        
        .file-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .control-panel { background: #45475a; padding: 15px; border-radius: 8px; border: 1px solid #585b70; }
        
        textarea { width: 100%; height: 350px; background: #181825; color: #a6e3a1; border: 1px solid #585b70; border-radius: 5px; padding: 10px; box-sizing: border-box; resize: vertical; margin-top: 10px; font-size: 13px; line-height: 1.4; }
        
        button { cursor: pointer; border: none; border-radius: 5px; padding: 10px 15px; font-weight: bold; transition: 0.2s; }
        .btn-action { background: var(--accent); color: #11111b; width: 100%; height: 55px; font-size: 1.3em; margin-top: 10px; }
        .btn-action:hover { background: #f5c2e7; transform: scale(1.01); }
        .btn-sub { background: #585b70; color: white; margin: 5px 0; flex: 1; }
        .btn-sub:hover { background: #6e738d; }
        
        input[type="text"] { background: #181825; color: white; border: 1px solid #585b70; padding: 8px; border-radius: 4px; width: calc(100% - 20px); margin-top: 5px; }
        
        #missionLog { background: #11111b; color: #89b4fa; height: 150px; overflow-y: auto; padding: 12px; font-size: 12px; border-radius: 5px; border: 1px solid #45475a; margin-top: 20px; }
        .log-entry { border-bottom: 1px solid #313244; padding: 4px 0; display: flex; }
        .log-time { color: #6c7086; margin-right: 10px; min-width: 70px; }
        .log-type { font-weight: bold; margin-right: 10px; }
        .type-success { color: #a6e3a1; }
        .type-action { color: #f9e2af; }
        .type-error { color: var(--danger); }
    </style>
</head>
<body>

<div class="base-camp">
    <img src="https://kakaomames.github.io/rei/logo.png" alt="Logo" style="width: 70px; float: right;">
    <h1>Python Commander Pro 🐍✨</h1>

    <div class="file-controls">
        <div class="control-panel">
            <label>📂 ファイル読み込み (.py / .py.txt)</label>
            <input type="file" id="fileInput" accept=".py,.txt" style="display: block; margin-top:10px;">
        </div>
        <div class="control-panel">
            <label>💾 出力ファイル名</label>
            <input type="text" id="fileNameInput" value="optimized_script.py">
        </div>
    </div>

    <textarea id="mainEditor" spellcheck="false" placeholder="コードをここにロード、または直接入力..."></textarea>

    <button class="btn-action" onclick="runOptimization()">
        ミッション開始：コメント抹消 ＆ 重複Import削除 🚀
    </button>

    <div style="display: flex; gap: 10px; margin-top: 15px;">
        <button class="btn-sub" onclick="copyToClipboard()">📋 クリップボードにコピー</button>
        <button class="btn-sub" onclick="downloadFile()">📥 処理済みファイルをDL</button>
    </div>

    <div id="missionLog">
        <div class="log-entry">
            <span class="log-time">--:--:--</span>
            <span class="log-type">[SYSTEM]</span>
            <span>Gemini programming隊、スタンバイ完了。</span>
        </div>
    </div>
</div>

<script>
    const editor = document.getElementById('mainEditor');
    const fileInput = document.getElementById('fileInput');
    const logBox = document.getElementById('missionLog');
    const fileNameInput = document.getElementById('fileNameInput');

    function missionLog(type, msg) {
        const entry = document.createElement('div');
        entry.className = 'log-entry';
        const now = new Date().toLocaleTimeString();
        
        let typeClass = `type-${type.toLowerCase()}`;
        entry.innerHTML = `
            <span class="log-time">${now}</span>
            <span class="log-type ${typeClass}">[${type}]</span>
            <span>${msg}</span>
        `;
        logBox.appendChild(entry);
        logBox.scrollTop = logBox.scrollHeight;
    }

    fileInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        missionLog("FILE", `読込開始: ${file.name}`);
        fileNameInput.value = "optimized_" + file.name.replace(".txt", "");
        const reader = new FileReader();
        reader.onload = (ev) => {
            editor.value = ev.target.result;
            missionLog("SUCCESS", "ファイルの展開に成功。");
        };
        reader.readAsText(file);
    });

    function runOptimization() {
        let code = editor.value;
        if (!code.trim()) {
            missionLog("ERROR", "入力エリアが空です。");
            return;
        }

        missionLog("ACTION", "地質調査：最適化シーケンスを開始。");

        // 1. コメント抹消プロトコル
        const beforeLen = code.length;
        // マルチライン
        code = code.replace(/('''[\s\S]*?'''|"""[\s\S]*?""")/g, "");
        // 隊員アイデア：#から改行までを無に
        code = code.replace(/#[^\n]*/g, "");
        missionLog("DATA", "コメントを「無」に変換完了。");

        // 2. 重複Import削除プロトコル
        const lines = code.split('\n');
        const seenImports = new Set();
        const optimizedLines = [];
        let importRemovedCount = 0;

        for (let line of lines) {
            const trimmedLine = line.trim();
            // import または from で始まる行を検知
            if (trimmedLine.startsWith('import ') || trimmedLine.startsWith('from ')) {
                if (seenImports.has(trimmedLine)) {
                    // 重複発見！
                    importRemovedCount++;
                    missionLog("CLEAN", `重複排除: ${trimmedLine}`);
                    continue; // 戻り値リストに追加せずスキップ（＝消去）
                }
                seenImports.add(trimmedLine);
            }
            optimizedLines.push(line);
        }

        // 3. 空行の整理
        let finalCode = optimizedLines.join('\n').replace(/\n\s*\n\n/g, '\n\n');

        editor.value = finalCode.trim();
        const afterLen = finalCode.length;
        
        missionLog("SUCCESS", `ミッション完了！ 重複Import: ${importRemovedCount}件削除 / 圧縮: ${beforeLen} → ${afterLen} bytes`);
    }

    function copyToClipboard() {
        editor.select();
        document.execCommand('copy');
        missionLog("INFO", "クリップボードへ転送完了。");
    }

    function downloadFile() {
        const blob = new Blob([editor.value], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = fileNameInput.value;
        a.click();
        URL.revokeObjectURL(url);
        missionLog("SAVE", `ファイル「${fileNameInput.value}」をダウンロードしました。`);
    }
</script>

</body>
</html>
