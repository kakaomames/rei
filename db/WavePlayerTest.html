<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="スライダーでHz・秒数・音量を調整してkakaomame-wave-playerのWP()を鳴らすテストページ">
  <meta name="keywords" content="kakaomame-wave-player, Web Audio API, スライダー, 周波数, 音量, WP">
  <meta name="author" content="カカオマメ">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#0f172a">
  <meta property="og:title" content="kakaomame-wave-player スライダー操作テスト">
  <meta property="og:description" content="周波数・再生秒数・音量をスライダーで選んでWP()で音を鳴らそう！">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://kakaomames.github.io/">
  <meta property="og:image" content="https://kakaomame.github.io/rei/logo.png">
  <meta property="og:site_name" content="Gemini programming隊">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="kakaomame-wave-player スライダー操作テスト">
  <meta name="twitter:description" content="周波数・再生秒数・音量をスライダーで選んでWP()で音を鳴らそう！">
  <meta name="twitter:image" content="https://kakaomame.github.io/rei/logo.png">
  <link rel="icon" href="https://kakaomame.github.io/rei/logo.png">
  <title>kakaomame-wave-player スライダーテスト</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 24px;
      line-height: 1.6;
    }
    .container {
      max-width: 780px;
      margin: 0 auto;
    }
    h1 {
      margin-top: 0;
      font-size: 1.6rem;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 18px;
    }
    .status-badge {
      display: inline-block;
      background: #0f172a;
      border: 1px solid #475569;
      border-radius: 999px;
      padding: 4px 12px;
      font-size: 0.85rem;
      margin-bottom: 14px;
    }
    .slider-row {
      margin-bottom: 16px;
    }
    .slider-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      font-weight: 700;
    }
    .slider-val {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: #38bdf8;
      background: #0f172a;
      padding: 2px 10px;
      border-radius: 6px;
      border: 1px solid #334155;
    }
    input[type="range"] {
      width: 100%;
      accent-color: #38bdf8;
      cursor: pointer;
    }
    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }
    button {
      background: #38bdf8;
      color: #0f172a;
      font-weight: 700;
      font-size: 0.95rem;
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      cursor: pointer;
    }
    button:hover {
      background: #7dd3fc;
    }
    button.secondary {
      background: #334155;
      color: #f8fafc;
    }
    button.secondary:hover {
      background: #475569;
    }
    #logArea {
      background: #020617;
      color: #a7f3d0;
      border: 1px solid #1e293b;
      border-radius: 10px;
      padding: 14px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.85rem;
      white-space: pre-wrap;
      max-height: 340px;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎛️ kakaomame-wave-player スライダー操作テスト</h1>
    <p>スライダーで <strong>周波数（Hz）</strong>・<strong>秒数（s）</strong>・<strong>音量</strong> を決めて、ボタンを押して鳴らしてみよう！🔊✨</p>

    <div class="card">
      <div id="wpStatus" class="status-badge">WP 状態: 読み込み確認中...</div>

      <div class="slider-row">
        <div class="slider-header">
          <label for="freqSlider">🎵 周波数 (Hz)</label>
          <span id="freqValue" class="slider-val">440 Hz</span>
        </div>
        <input id="freqSlider" type="range" min="20" max="2000" step="1" value="440">
      </div>

      <div class="slider-row">
        <div class="slider-header">
          <label for="durationSlider">⏱️ 再生秒数 (秒)</label>
          <span id="durationValue" class="slider-val">0.30 s</span>
        </div>
        <input id="durationSlider" type="range" min="0.05" max="2.00" step="0.05" value="0.30">
      </div>

      <div class="slider-row">
        <div class="slider-header">
          <label for="volumeSlider">🔊 音量 (0.00 〜 1.00)</label>
          <span id="volumeValue" class="slider-val">0.20</span>
        </div>
        <input id="volumeSlider" type="range" min="0.00" max="1.00" step="0.01" value="0.20">
      </div>

      <div class="btn-group">
        <button id="btnPlay" type="button">▶️ この設定で再生 (WP)</button>
        <button id="btnReset" class="secondary" type="button">🔄 初期値に戻す</button>
        <button id="btnClear" class="secondary" type="button">🧹 ログクリア</button>
      </div>
    </div>

    <div class="card">
      <h2 style="margin-top: 0; font-size: 1.1rem;">📋 実行ログ</h2>
      <div id="logArea"></div>
    </div>
  </div>

  <!-- jsDelivr CDN から 1.0.2 の main.js を読み込み -->
  <script type="module" src="https://cdn.jsdelivr.net/npm/kakaomame-wave-player@1.0.3/main.js"></script>

  <script type="module">
    const logArea = document.getElementById("logArea");
    const wpStatus = document.getElementById("wpStatus");

    const freqSlider = document.getElementById("freqSlider");
    const durationSlider = document.getElementById("durationSlider");
    const volumeSlider = document.getElementById("volumeSlider");

    const freqValue = document.getElementById("freqValue");
    const durationValue = document.getElementById("durationValue");
    const volumeValue = document.getElementById("volumeValue");

    function writeLog(tag, message) {
      const time = new Date().toLocaleTimeString("ja-JP");
      const line = `[${time}] [${tag}] ${message}`;
      console.log(line);
      logArea.textContent += line + "\n";
      logArea.scrollTop = logArea.scrollHeight;
    }

    function updateDisplays() {
      const freq = Number(freqSlider.value);
      const duration = Number(durationSlider.value);
      const volume = Number(volumeSlider.value);

      freqValue.textContent = `${freq} Hz`;
      durationValue.textContent = `${duration.toFixed(2)} s`;
      volumeValue.textContent = volume.toFixed(2);

      return { freq, duration, volume };
    }

    function refreshWpStatus() {
      const fn = typeof window.WP === "function" ? window.WP : (typeof WP === "function" ? WP : null);
      if (fn) {
        wpStatus.textContent = "WP 状態: 読み込みOK ✅ (function)";
        writeLog("INIT", "WP 関数の検出に成功！");
        return fn;
      } else {
        wpStatus.textContent = "WP 状態: 未検出 ⚠️";
        writeLog("WARN", "WP がまだ見つからないよ！");
        return null;
      }
    }

    freqSlider.addEventListener("input", () => {
      const { freq } = updateDisplays();
      writeLog("SLIDER", `周波数変更 -> freq=${freq}Hz`);
    });

    durationSlider.addEventListener("input", () => {
      const { duration } = updateDisplays();
      writeLog("SLIDER", `秒数変更 -> duration=${duration.toFixed(2)}s`);
    });

    volumeSlider.addEventListener("input", () => {
      const { volume } = updateDisplays();
      writeLog("SLIDER", `音量変更 -> volume=${volume.toFixed(2)}`);
    });

    document.getElementById("btnPlay").addEventListener("click", async () => {
      const fn = refreshWpStatus();
      if (!fn) return;

      const { freq, duration, volume } = updateDisplays();
      writeLog("ACTION", `WP(${freq}, ${duration}, ${volume}) 呼び出し開始`);
      try {
        const res = await fn(freq, duration, volume);
        writeLog("DONE", `再生処理完了 -> freq=${freq}Hz, duration=${duration}s, volume=${volume}, result=${String(res)}`);
      } catch (err) {
        writeLog("ERROR", `再生中にエラー発生 -> ${err}`);
      }
    });

    document.getElementById("btnReset").addEventListener("click", () => {
      freqSlider.value = "440";
      durationSlider.value = "0.30";
      volumeSlider.value = "0.20";
      const { freq, duration, volume } = updateDisplays();
      writeLog("RESET", `初期値にリセット -> freq=${freq}Hz, duration=${duration}s, volume=${volume}`);
    });

    document.getElementById("btnClear").addEventListener("click", () => {
      logArea.textContent = "";
      writeLog("LOG", "ログをクリアしました");
    });

    updateDisplays();
    setTimeout(refreshWpStatus, 100);
    setTimeout(refreshWpStatus, 500);
    writeLog("BOOT", "スライダーテストページの初期化完了");
  </script>
</body>
</html>
