<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Audio Merger - Windows Edition">
    <meta name="robots" content="index,follow">
    <meta name="theme-color" content="#2ecc71">
    <title>Audio Lab Pro | Gemini programming隊 🎧</title>
    <style>
        body { font-family: 'Segoe UI', 'Meiryo', sans-serif; background: #f0f0f0; color: #333; text-align: center; padding: 20px; }
        .panel { 
            border: 1px solid #ccc; 
            padding: 25px; 
            background: #ffffff; 
            border-radius: 8px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            display: inline-block; 
            width: 90%; 
            max-width: 650px; 
            text-align: left;
        }
        
        h1 { font-size: 1.2em; color: #1e3a8a; margin-top: 0; }
        .logo { width: 40px; vertical-align: middle; margin-right: 10px; }

        /* --- Windows風プログレスバーの魔法 --- */
        .progress-container {
            width: 100%;
            height: 22px;
            background-color: #e6e6e6;
            border: 1px solid #bcbcbc;
            position: relative;
            overflow: hidden;
            margin: 15px 0;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(to bottom, #b7e8b7 0%, #2ecc71 50%, #27ae60 100%);
            position: relative;
            transition: width 0.3s ease;
        }

        /* あの「光の反射」が右へ流れるアニメーション */
        .progress-bar-fill::after {
            content: "";
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background-image: linear-gradient(
                90deg, 
                rgba(255,255,255,0) 0%, 
                rgba(255,255,255,0.4) 50%, 
                rgba(255,255,255,0) 100%
            );
            background-size: 200px 100%;
            background-repeat: no-repeat;
            animation: moveLight 2s infinite linear;
        }

        @keyframes moveLight {
            from { background-position: -200px 0; }
            to { background-position: 100% 0; }
        }

        .stats-grid { display: grid; grid-template-columns: 100px 1fr; gap: 5px; font-size: 0.85em; color: #555; }
        .label { font-weight: bold; }

        canvas#waveformCanvas { background: #fafafa; width: 100%; height: 100px; border: 1px solid #ddd; margin-top: 20px; }
        .btn { 
            background: #e1e1e1; color: #333; padding: 8px 20px; border: 1px solid #adadad; 
            cursor: pointer; border-radius: 3px; font-size: 0.9em; float: right;
        }
        .btn:hover { background: #e5f1fb; border-color: #0078d7; }
        .btn:disabled { color: #999; border-color: #d9d9d9; }
        .clear { clear: both; }
    </style>
</head>
<body>

    <div class="panel">
        <h1><img src="https://kakaomames.github.io/rei/logo.png" class="logo">音声統合の進行状況</h1>
        
        <p id="currentStatus" style="font-size: 0.9em; margin-bottom: 5px;">準備完了</p>
        
        <div class="progress-container">
            <div id="progressBar" class="progress-bar-fill"></div>
        </div>

        <div class="stats-grid">
            <div class="label">名前:</div><div id="fileNameText">-</div>
            <div class="label">残り時間:</div><div id="etaText">-</div>
            <div class="label">残り項目:</div><div id="itemCount">-</div>
            <div class="label">速度:</div><div id="speedText">-</div>
        </div>

        <input type="file" id="audioFiles" multiple accept="audio/*" style="margin-top: 20px; font-size: 0.8em;">
        
        <div class="clear"></div>
        <hr style="border: 0.5px solid #eee; margin: 20px 0;">
        
        <canvas id="waveformCanvas"></canvas>
        <audio id="previewAudio" controls style="width: 100%; margin-top: 10px;"></audio>
        
        <button id="startBtn" class="btn" onclick="processAudio()" style="margin-top: 15px;">統合開始</button>
        <div class="clear"></div>
    </div>

    <script>
        // 隊員！進捗更新の関数ですよ！
        const updateUI = (data) => {
            const bar = document.getElementById('progressBar');
            bar.style.width = `${data.percent * 100}%`;
            
            document.getElementById('currentStatus').innerText = data.status;
            document.getElementById('fileNameText').innerText = data.fileName;
            document.getElementById('etaText').innerText = data.eta;
            document.getElementById('itemCount').innerText = data.itemCount;
            document.getElementById('speedText').innerText = data.speed;
        };

        async function processAudio() {
            const input = document.getElementById('audioFiles');
            if (input.files.length === 0) return;
            
            const btn = document.getElementById('startBtn');
            btn.disabled = true;

            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            let buffers = [];
            let totalLength = 0;
            const files = Array.from(input.files);
            const startTime = Date.now();

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                const elapsed = (Date.now() - startTime) / 1000;
                const speed = (i / elapsed).toFixed(2);
                const remaining = files.length - i;
                const eta = i > 0 ? Math.round(remaining / (i / elapsed)) + " 秒" : "計算中...";

                updateUI({
                    percent: i / files.length,
                    status: `${files.length}個の項目をコピー中...`,
                    fileName: file.name,
                    eta: eta,
                    itemCount: remaining + " 個",
                    speed: speed + " 個/秒"
                });

                try {
                    const arrayBuffer = await file.arrayBuffer();
                    const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
                    buffers.push(audioBuffer);
                    totalLength += audioBuffer.length;
                } catch (e) { console.error(e); }
            }

            updateUI({ percent: 1, status: "完了しました", fileName: "-", eta: "0 秒", itemCount: "0 個", speed: "-" });

            // バッファ統合処理
            const finalBuffer = audioCtx.createBuffer(buffers[0].numberOfChannels, totalLength, buffers[0].sampleRate);
            for (let ch = 0; ch < finalBuffer.numberOfChannels; ch++) {
                let offset = 0;
                for (const b of buffers) {
                    finalBuffer.getChannelData(ch).set(b.getChannelData(ch), offset);
                    offset += b.length;
                }
            }

            drawWaveform(finalBuffer);
            const wavBlob = bufferToWav(finalBuffer);
            const url = URL.createObjectURL(wavBlob);
            document.getElementById('previewAudio').src = url;

            // ダウンロード属性 & blank属性で自動DL
            const a = document.createElement('a');
            a.href = url;
            a.download = "minecraft_merged_audio.wav";
            a.target = "_blank";
            a.click();

            btn.disabled = false;
        }

        function drawWaveform(audioBuffer) {
            const canvas = document.getElementById('waveformCanvas');
            const ctx = canvas.getContext('2d');
            const data = audioBuffer.getChannelData(0);
            const step = Math.ceil(data.length / canvas.width);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.beginPath();
            ctx.strokeStyle = '#2ecc71';
            ctx.moveTo(0, 50);
            for(let i=0; i<canvas.width; i++) {
                let max = 0;
                for(let j=0; j<step; j++) {
                    const datum = Math.abs(data[(i * step) + j]);
                    if (datum > max) max = datum;
                }
                ctx.lineTo(i, 50 - (max * 50));
                ctx.lineTo(i, 50 + (max * 50));
            }
            ctx.stroke();
        }

        // WAVエンコーダー
        function bufferToWav(abuffer) {
            let n = abuffer.numberOfChannels, len = abuffer.length * n * 2 + 44, buffer = new ArrayBuffer(len), view = new DataView(buffer), pos = 0;
            const u32 = (d) => { view.setUint32(pos, d, true); pos += 4; }, u16 = (d) => { view.setUint16(pos, d, true); pos += 2; };
            u32(0x46464952); u32(len - 8); u32(0x45564157); u32(0x20746d66); u32(16); u16(1); u16(n);
            u32(abuffer.sampleRate); u32(abuffer.sampleRate * 2 * n); u16(n * 2); u16(16); u32(0x61746164); u32(len - pos - 4);
            for(let o = 0; o < abuffer.length; o++) {
                for(let i = 0; i < n; i++) {
                    let s = Math.max(-1, Math.min(1, abuffer.getChannelData(i)[o]));
                    view.setInt16(pos, (s < 0 ? s * 0x8000 : s * 0x7FFF), true); pos += 2;
                }
            }
            return new Blob([buffer], {type: "audio/wav"});
        }
    </script>
</body>
</html>
