    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        #container { position: absolute; width: 100%; height: 100%; }
        #upload {
            position: absolute;
            top: 50px;
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            height: 100px;
            border: 2px dashed #007bff;
            background-color: rgba(240, 248, 255, 0.8);
            color: #007bff;
            text-align: center;
            line-height: 100px;
            cursor: pointer;
            z-index: 10;
            border-radius: 10px;
            font-weight: bold;
            transition: all 0.2s;
        }
        #upload.dragover {
            border-color: #28a745;
            background-color: rgba(214, 255, 222, 0.9);
            color: #28a745;
        }
        #message {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            text-align: center;
            z-index: 20;
            display: none;
        }
    </style>
</head>
<body>
    <div id="container"></div>
    <div id="upload">ここにOBJファイルをドラッグ＆ドロップ</div>
    <div id="message"></div>
    <a href="./3Dオブジェクト変換">3Dオブジェクトの変換
    </a>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/loaders/OBJLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/controls/OrbitControls.js"></script> 
    
    <script>
        // ----------------------------------------------------
        // Service Workerの登録処理
        // ----------------------------------------------------
        if ('serviceWorker' in navigator) {
            // Service Workerファイル（SW.js）のパスは君の指定通り '/rei/SW.js'
            const swPath = '/rei/SWs.js'; 
            
            navigator.serviceWorker.register(swPath)
                .then(registration => {
                    console.log('Service Worker 登録成功。オフライン対応完了:', registration.scope);
                    document.getElementById('message').textContent = 'オフライン対応が有効になりました！';
                    setTimeout(() => { document.getElementById('message').style.display = 'none'; }, 3000);
                })
                .catch(error => {
                    console.error('Service Worker 登録失敗:', error);
                    document.getElementById('message').textContent = 'エラー: オフライン対応の登録に失敗しました。';
                    document.getElementById('message').style.display = 'block';
                });
        } else {
             console.warn('Service Worker はこのブラウザでサポートされていません。');
        }
    </script>

    <script>
        // =========================================================
        // Three.js 環境設定
        // =========================================================
        const container = document.getElementById('container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);
        scene.background = new THREE.Color(0xf0f0f0);
        
        // ライト設定
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.7);
        directionalLight.position.set(5, 10, 7.5);
        scene.add(directionalLight);
        
        // OrbitControlsの初期化 (カメラ操作を有効化)
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        camera.position.set(0, 1.5, 5); // 初期カメラ位置調整
        controls.update(); 

        let currentModel = null;
        const messageDiv = document.getElementById('message');
        const uploadDiv = document.getElementById('upload');

        // =========================================================
        // モデルの描画関数
        // =========================================================
        function displayModel(object) {
            if (currentModel) {
                scene.remove(currentModel);
            }

            // サイズ調整と中心配置
            const box = new THREE.Box3().setFromObject(object);
            const center = box.getCenter(new THREE.Vector3());
            object.position.sub(center);

            const size = box.getSize(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z);
            const scale = 3 / maxDim; 
            object.scale.set(scale, scale, scale);

            scene.add(object);
            currentModel = object;

            messageDiv.style.display = 'none';
            uploadDiv.textContent = 'ドラッグ＆ドロップで新しいOBJをアップロード';
        }

        // =========================================================
        // ドラッグ＆ドロップ処理
        // =========================================================
        
        // デフォルト動作のキャンセル (ファイルを開くのを防ぐ)
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            document.body.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        // ドラッグオーバー時の視覚的フィードバック
        ['dragenter', 'dragover'].forEach(eventName => {
            uploadDiv.addEventListener(eventName, () => uploadDiv.classList.add('dragover'), false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            uploadDiv.addEventListener(eventName, () => uploadDiv.classList.remove('dragover'), false);
        });

        // ドロップ時のファイル処理
        uploadDiv.addEventListener('drop', handleDrop, false);

        function handleDrop(e) {
            const dt = e.dataTransfer;
            const files = dt.files;

            if (files.length === 0) return;
            
            const objFile = Array.from(files).find(file => file.name.toLowerCase().endsWith('.obj'));
            
            if (!objFile) {
                messageDiv.textContent = 'エラー: OBJファイルが見つかりません。';
                messageDiv.style.display = 'block';
                return;
            }

            messageDiv.textContent = `ファイルをロード中: ${objFile.name}`;
            messageDiv.style.display = 'block';
            uploadDiv.textContent = 'ロード中...';

            const reader = new FileReader();
            
            reader.onload = (event) => {
                const loader = new THREE.OBJLoader();
                const objData = event.target.result;

                try {
                    const object = loader.parse(objData);
                    displayModel(object);
                } catch (error) {
                    console.error('OBJファイルの解析に失敗しました:', error);
                    messageDiv.textContent = 'エラー: OBJファイルの形式が正しくありません。';
                }
            };
            
            reader.readAsText(objFile);
        }
        
        // =========================================================
        // アニメーションループ
        // =========================================================
        function animate() {
            requestAnimationFrame(animate);
            controls.update(); // カメラ操作の更新
            renderer.render(scene, camera);
        }
        animate();

        // ウィンドウサイズ変更時の対応
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

    </script>
</body>
</html>
