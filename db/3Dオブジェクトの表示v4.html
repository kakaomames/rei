<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>SPA Three.js OBJ Drag & Drop - Gemini Programming隊</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        /* 描画エリア */
        #container { position: absolute; width: 100%; height: 100%; }
        /* ドラッグ＆ドロップエリア */
        #upload {
            position: absolute;
            top: 50px;
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            height: 100px;
            border: 2px dashed #007bff;
            background-color: rgba(240, 248, 255, 0.8);
            color: #007bff;
            text-align: center;
            line-height: 100px;
            cursor: pointer;
            z-index: 10;
            border-radius: 10px;
            font-weight: bold;
            transition: all 0.2s;
        }
        /* ドラッグオーバー時のスタイル */
        #upload.dragover {
            border-color: #28a745;
            background-color: rgba(214, 255, 222, 0.9);
            color: #28a745;
        }
        /* ロードメッセージ */
        #message {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            text-align: center;
            z-index: 20;
            display: none;
        }
    </style>
</head>
<body>
    <div id="container"></div>
    <div id="upload">ここにOBJファイルをドラッグ＆ドロップ</div>
    <div id="message"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/loaders/OBJLoader.js"></script>

    <script>
        // ----------------------------------------------------
        // Service Workerの登録処理
        // ----------------------------------------------------
        if ('serviceWorker' in navigator) {
            // Service Workerファイル自体は別途必要だが、ここでは登録処理のみ記述
            // GitHub Pagesでホストする場合、SW.jsはルートに配置するのが一般的
            // ここではSWファイルパスを'sw.js'と仮定する
            navigator.serviceWorker.register('/sw.js')
                .then(registration => {
                    console.log('Service Worker 登録成功:', registration.scope);
                })
                .catch(error => {
                    console.error('Service Worker 登録失敗:', error);
                });
        }
        // SPAとして機能させるための基本的なルーター処理もここに追加可能だが、
        // 今回はOBJローディングに焦点を当てて省略する。
    </script>

    <script>
        // =========================================================
        // Three.js 環境設定
        // =========================================================
        const container = document.getElementById('container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);
        scene.background = new THREE.Color(0xf0f0f0);
        camera.position.z = 5;

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.7);
        directionalLight.position.set(5, 10, 7.5);
        scene.add(directionalLight);

        let currentModel = null; // 現在のモデルを保持する変数
        const messageDiv = document.getElementById('message');
        const uploadDiv = document.getElementById('upload');

        // =========================================================
        // モデルの描画関数
        // =========================================================
        function displayModel(object) {
            // 既存のモデルを削除
            if (currentModel) {
                scene.remove(currentModel);
            }

            // オブジェクトのサイズを調整し、中心に配置
            const box = new THREE.Box3().setFromObject(object);
            const center = box.getCenter(new THREE.Vector3());
            object.position.sub(center);

            const size = box.getSize(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z);
            const scale = 3 / maxDim; // 最大サイズを3ユニットに収める
            object.scale.set(scale, scale, scale);

            scene.add(object);
            currentModel = object;

            messageDiv.style.display = 'none';
            uploadDiv.textContent = 'ドラッグ＆ドロップで新しいOBJをアップロード';
        }

        // =========================================================
        // ドラッグ＆ドロップ処理
        // =========================================================
        
        // デフォルト動作のキャンセル (ファイルを開くのを防ぐ)
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            document.body.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        // ドラッグオーバー時の視覚的フィードバック
        ['dragenter', 'dragover'].forEach(eventName => {
            uploadDiv.addEventListener(eventName, () => uploadDiv.classList.add('dragover'), false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            uploadDiv.addEventListener(eventName, () => uploadDiv.classList.remove('dragover'), false);
        });

        // ドロップ時のファイル処理
        uploadDiv.addEventListener('drop', handleDrop, false);

        function handleDrop(e) {
            const dt = e.dataTransfer;
            const files = dt.files;

            // ファイルが1つ以上あるか確認
            if (files.length === 0) return;
            
            const objFile = Array.from(files).find(file => file.name.toLowerCase().endsWith('.obj'));
            
            // OBJファイルが見つからない場合は処理を中止
            if (!objFile) {
                messageDiv.textContent = 'エラー: OBJファイルが見つかりません。';
                messageDiv.style.display = 'block';
                return;
            }

            messageDiv.textContent = `ファイルをロード中: ${objFile.name}`;
            messageDiv.style.display = 'block';
            uploadDiv.textContent = 'ロード中...';

            const reader = new FileReader();
            
            // ファイルの読み込み完了後
            reader.onload = (event) => {
                const loader = new THREE.OBJLoader();
                const objData = event.target.result;

                try {
                    // テキストとして読み込んだOBJデータを解析
                    const object = loader.parse(objData);
                    // 解析結果を描画
                    displayModel(object);
                } catch (error) {
                    console.error('OBJファイルの解析に失敗しました:', error);
                    messageDiv.textContent = 'エラー: OBJファイルの形式が正しくありません。';
                }
            };
            
            // ファイルをテキストとして読み込む
            reader.readAsText(objFile);
        }
        
        // =========================================================
        // アニメーションループ
        // =========================================================
        function animate() {
            requestAnimationFrame(animate);
            if (currentModel) {
                currentModel.rotation.y += 0.005; // モデルを自動で回転させる
            }
            renderer.render(scene, camera);
        }
        animate();

        // ウィンドウサイズ変更時の対応
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

    </script>
</body>
</html>
