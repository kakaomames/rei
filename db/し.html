<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Gemini programming隊 特殊文字回収任務">
    <title>Gemiprocraft - Unicode Collector</title>
    <link rel="icon" href="https://kakaomames.github.io/rei/logo.png">
    <style>
        body { background: #1a1a1a; color: #00ff00; font-family: 'Courier New', monospace; margin: 0; overflow-x: hidden; }
        h1 { text-align: center; color: #ffcc00; padding: 20px; border-bottom: 2px solid #333; margin: 0; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; padding: 20px; }
        
        /* 記号カードのスタイル */
        .item { 
            border: 1px solid #444; padding: 15px; text-align: center; background: #222; 
            cursor: pointer; transition: all 0.2s; position: relative; overflow: hidden;
        }
        .item:hover { background: #333; border-color: #00ff00; transform: scale(1.05); }
        .item:active { transform: scale(0.95); background: #004400; }
        
        .char { font-size: 32px; display: block; margin-bottom: 5px; color: white; }
        .code { font-size: 10px; color: #888; display: block; }

        /* コピー通知ログ */
        #log-container {
            position: fixed; bottom: 20px; right: 20px; width: 300px;
            display: flex; flex-direction: column; gap: 5px; pointer-events: none;
        }
        .log-entry {
            background: rgba(0, 0, 0, 0.8); border-left: 5px solid #00ff00;
            color: #fff; padding: 10px; font-size: 12px; animation: slideIn 0.3s ease-out;
        }
        @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
    </style>
</head>
<body>
    <h1>💎 Unicode Treasure Map 💎</h1>
    <div id="explorer" class="grid"></div>
    <div id="log-container"></div>

    <script>
    // 隊員指定のログ関数
    function missionLog(type, message, data = null) {
        const container = document.getElementById('log-container');
        const entry = document.createElement('div');
        entry.className = 'log-entry';
        entry.textContent = `[${type}] ${message}${data ? ' => ' + data : ''}`;
        container.appendChild(entry);
        
        // 3秒後に消去
        setTimeout(() => entry.remove(), 3000);
        console.log(`[${type}] ${message}`, data || "");
    }

    async function MCmain() {
        const explorer = document.getElementById('explorer');
        missionLog("SYSTEM", "🚀 探索エンジン起動！");

        // 0x2000 (一般句読点や装飾記号) から 0x2BFF (矢印や数学記号) あたりが面白いぞ
        const start = 0x2000;
        const end = 0x2BFF; 

        for (let i = start; i <= end; i++) {
            const hex = i.toString(16).toUpperCase().padStart(4, '0');
            const char = String.fromCharCode(i);

            const div = document.createElement('div');
            div.className = 'item';
            div.innerHTML = `
                <span class="char">${char}</span>
                <span class="code">U+${hex}</span>
            `;

            // クリックでコピーするイベント
            div.addEventListener('click', () => {
                navigator.clipboard.writeText(char).then(() => {
                    missionLog("ACTION", "お宝回収成功！", `${char} (U+${hex})`);
                });
            });
            
            explorer.appendChild(div);
        }
        missionLog("SYSTEM", "全エリアのスキャン完了！");
    }

    MCmain();
    </script>
</body>
</html>
