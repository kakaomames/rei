<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini programming隊 - 工作工場v2</title>
    <style>
        body { background: #001f3f; color: #7FDBFF; font-family: 'Courier New', monospace; padding: 20px; text-align: center; }
        .factory { border: 3px double #7FDBFF; padding: 20px; display: inline-block; text-align: left; background: #000; }
        .input-group { margin: 15px 0; border-bottom: 1px solid #333; padding-bottom: 10px; }
        button { width: 100%; padding: 15px; background: #39CCCC; color: #001f3f; border: none; font-weight: bold; cursor: pointer; }
        button:hover { background: #7FDBFF; }
        #status { color: #FFDC00; margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <h1>🛠️ データ工作工場 v2 (Meta-Packer)</h1>
    
    <div class="factory">
        <div class="input-group">
            <label>1. ベース動画 (a.mp4 / a.webm):</label><br>
            <input type="file" id="baseVideo" accept="video/*">
        </div>

        <div class="input-group">
            <label>2. 隠したいファイル (SVG, PNG, MP3, etc...):</label><br>
            <input type="file" id="secretFile">
        </div>

        <button onclick="buildV2()">🚀 工作開始（メタデータ付与）</button>
    </div>

    <div id="status">待機中...</div>

    <script>
        async function buildV2() {
            const status = document.getElementById('status');
            const videoFile = document.getElementById('baseVideo').files[0];
            const secretFile = document.getElementById('secretFile').files[0];

            if (!videoFile || !secretFile) {
                alert("隊員！動画と隠しファイルの両方が必要だ！");
                return;
            }

            status.innerText = "🛰️ 工作シーケンス開始...";

            // 1. 各ファイルをArrayBufferとして取得
            const videoBuf = await videoFile.arrayBuffer();
            const secretBuf = await secretFile.arrayBuffer();

            // 2. メタデータの作成 (名前、種類、サイズ)
            const meta = {
                name: secretFile.name,
                type: secretFile.type,
                size: secretFile.size
            };
            const metaString = JSON.stringify(meta);
            
            // 決定した値を報告する掟
            console.log(`metaData:${metaString}`);

            // 3. バイナリの組み立て
            const encoder = new TextEncoder();
            const marker = encoder.encode("SECRET_V2");      // 合言葉
            const metaBin = encoder.encode(metaString);      // メタデータ(JSON)
            const separator = encoder.encode("::DATA::");    // 境界線
            const dataBin = new Uint8Array(secretBuf);       // 実データ

            // 4. 全てを連結 (Blob)
            // 構造: [動画] + [マーカー] + [メタJSON] + [境界線] + [実データ]
            const packageBlob = new Blob([
                new Uint8Array(videoBuf), 
                marker, 
                metaBin, 
                separator, 
                dataBin
            ], { type: videoFile.type });

            // 5. ダウンロード
            const url = URL.createObjectURL(packageBlob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `v2_${videoFile.name}`;
            a.click();

            status.innerText = `✅ 完了！輸送機「v2_${videoFile.name}」が発進したぞ！`;
            console.log(`finalSize:${packageBlob.size}`);
        }
    </script>
</body>
</html>
