<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>画像カラーピッカー（URL・ファイル両対応）</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background-color 0.2s;
        }
        /* 入力エリア全体のスタイル */
        .input-container {
            width: 100%;
            max-width: 500px;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #dee2e6;
        }
        .url-box {
            display: flex;
            gap: 10px;
        }
        .url-box input[type="text"] {
            flex: 1;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .url-box button {
            padding: 8px 15px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .url-box button:hover {
            background-color: #0056b3;
        }
        /* 画像表示エリア */
        .image-container {
            position: relative;
            display: inline-block;
            max-width: 100%;
            border: 2px solid #ccc;
            cursor: crosshair;
            touch-action: none;
        }
        canvas {
            display: block;
            max-width: 100%;
            height: auto;
            user-select: none;
        }
        /* ログ・結果表示 */
        .log-box {
            margin-top: 15px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid #ccc;
            border-radius: 5px;
            width: 300px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .color-preview {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 1px solid #000;
            vertical-align: middle;
            margin-left: 10px;
        }
        .error-message {
            color: red;
            margin-bottom: 10px;
            font-size: 0.9em;
            display: none;
        }
    </style>
</head>
<body>

    <h2>画像カラーピッカー（URL・ファイル両対応）</h2>
    
    <!-- 入力エリア（URLとファイルのハイブリッド） -->
    <div class="input-container">
        <!-- ① 外部リンク（URL）入力欄 -->
        <div class="url-box">
            <input type="text" id="urlInput" placeholder="画像のURLを入力（例: https://...）" value="https://picsum.photos">
            <button id="loadBtn">URL読込</button>
        </div>
        
        <!-- ② ローカルファイル選択ボタン -->
        <div>
            <label style="font-size: 0.9em; color: #555; display: block; margin-bottom: 5px;">またはローカルファイルを選択：</label>
            <input type="file" id="fileInput" accept="image/*">
        </div>
    </div>

    <!-- エラー表示用 -->
    <div id="errorMsg" class="error-message"></div>

    <div class="image-container" id="imgContainer">
        <canvas id="myCanvas"></canvas>
    </div>

    <div class="log-box">
        <span style="font-weight: bold; font-size: 1.2em;">
            カラーコード: <span id="colorCode">#------</span>
        </span>
        <div id="colorPreview" class="color-preview"></div>
    </div>

    <script>
        const urlInput = document.getElementById('urlInput');
        const loadBtn = document.getElementById('loadBtn');
        const fileInput = document.getElementById('fileInput'); // 復活
        const errorMsg = document.getElementById('errorMsg');
        const canvas = document.getElementById('myCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const colorCodeEl = document.getElementById('colorCode');
        const colorPreviewEl = document.getElementById('colorPreview');

        let isTracking = false;
        let img = new Image();

        // 共通：画像をCanvasに描画する関数
        img.onload = () => {
            errorMsg.style.display = 'none'; // エラーを消去
            canvas.width = img.width;
            canvas.height = img.height;
            ctx.drawImage(img, 0, 0);
        };

        img.onerror = () => {
            errorMsg.textContent = "画像の読み込みに失敗しました。URLが正しいか、またはCORS制限がないか確認してください。";
            errorMsg.style.display = 'block';
        };

        // 1. URL（外部リンク）から読み込む処理
        function loadUrlImage(src) {
            img.crossOrigin = "Anonymous"; // CORS制限対策
            img.src = src;
        }

        loadBtn.addEventListener('click', () => {
            if (urlInput.value.trim() !== "") loadUrlImage(urlInput.value.trim());
        });

        urlInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && urlInput.value.trim() !== "") loadUrlImage(urlInput.value.trim());
        });

        // 2. ローカルファイルから読み込む処理（復活・連動）
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    img.crossOrigin = ""; // ローカルファイルはCORS対策不要なのでクリア
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        // 初期画像の読み込み
        loadUrlImage(urlInput.value);

        // 3. 座標・色取得のロジック
        function pickColor(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;

            const x = Math.floor((e.clientX - rect.left) * scaleX);
            const y = Math.floor((e.clientY - rect.top) * scaleY);

            if (x < 0 || x >= canvas.width || y < 0 || y >= canvas.height) return;

            try {
                const pixel = ctx.getImageData(x, y, 1, 1).data;
                const r = pixel[0];
                const g = pixel[1];
                const b = pixel[2];

                const hexColor = "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);

                colorCodeEl.textContent = hexColor;
                colorPreviewEl.style.backgroundColor = hexColor;
                document.body.style.backgroundColor = hexColor + "22";
            } catch (err) {
                console.error(err);
                errorMsg.textContent = "セキュリティエラー: この画像のピクセルデータを取得できませんでした（CORS制限）。";
                errorMsg.style.display = 'block';
            }
        }

        // ポインターイベント
        canvas.addEventListener('pointerdown', (e) => {
            isTracking = true;
            pickColor(e);
            canvas.setPointerCapture(e.pointerId);
        });

        canvas.addEventListener('pointermove', (e) => {
            if (!isTracking) return;
            pickColor(e);
        });

        canvas.addEventListener('pointerup', (e) => {
            isTracking = false;
            canvas.releasePointerCapture(e.pointerId);
        });

        canvas.addEventListener('pointercancel', () => {
            isTracking = false;
        });
    </script>
</body>
</html>
