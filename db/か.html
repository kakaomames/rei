<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Audio Converter Pro - Gemini programming隊">
    <title>Audio Converter | Gemini programming隊 🛰️</title>
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #2c3e50; color: white; text-align: center; padding: 20px; }
        .panel { border: 2px solid #e67e22; padding: 25px; background: #34495e; border-radius: 12px; display: inline-block; width: 90%; max-width: 600px; }
        .progress-container { width: 100%; height: 22px; background: #555; border: 1px solid #777; margin: 15px 0; overflow: hidden; }
        .progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #f39c12, #e67e22); transition: width 0.3s; }
        select, button { padding: 10px; margin: 10px; border-radius: 5px; border: none; font-weight: bold; }
        button { background: #e67e22; color: white; cursor: pointer; }
        button:disabled { background: #7f8c8d; }
        #log { font-size: 12px; color: #bdc3c7; text-align: left; background: #1a1a1a; padding: 10px; height: 100px; overflow-y: auto; }
    </style>
</head>
<body>
    <img src="https://kakaomames.github.io/rei/logo.png" style="width: 60px;">
    <h1>🛰️ Audio Format Converter</h1>
    <p>隊員、変換先のフォーマットを指定してくれ！</p>

    <div class="panel">
        <input type="file" id="inputWav" accept="audio/wav">
        <br><br>
        <label>変換先:</label>
        <select id="formatSelect">
            <option value="mp3">MP3 (.mp3)</option>
            <option value="ogg">Ogg Vorbis (.ogg)</option>
            <option value="m4a">M4A (AAC)</option>
        </select>
        
        <div class="progress-container">
            <div id="progressBar" class="progress-bar"></div>
        </div>
        
        <button id="convertBtn" onclick="convertAudio()">変換ミッション開始 🚀</button>
        
        <div id="log"></div>
    </div>

    <script>
        const { createFFmpeg, fetchFile } = FFmpeg;
        const ffmpeg = createFFmpeg({ log: true });

        const logger = (msg) => {
            const div = document.getElementById('log');
            div.innerHTML += `> ${msg}<br>`;
            div.scrollTop = div.scrollHeight;
        };

        async function convertAudio() {
            const fileInput = document.getElementById('inputWav');
            const format = document.getElementById('formatSelect').value;
            if (fileInput.files.length === 0) return alert("ファイルを選んで！");

            const btn = document.getElementById('convertBtn');
            const bar = document.getElementById('progressBar');
            btn.disabled = true;
            
            const file = fileInput.files[0];
            const name = file.name.split('.')[0];

            if (!ffmpeg.isLoaded()) {
                logger("FFmpegエンジンを起動中... (初回は時間がかかります)");
                await ffmpeg.load();
            }

            logger(`変換準備中: ${file.name} -> ${format}`);
            ffmpeg.FS('writeFile', 'input.wav', await fetchFile(file));

            // 進捗取得
            ffmpeg.setProgress(({ ratio }) => {
                bar.style.width = `${ratio * 100}%`;
                logger(`進捗: ${Math.round(ratio * 100)}%`);
            });

            // 変換実行
            await ffmpeg.run('-i', 'input.wav', `output.${format}`);

            // ファイル取り出し
            const data = ffmpeg.FS('readFile', `output.${format}`);
            const blob = new Blob([data.buffer], { type: `audio/${format}` });
            const url = URL.createObjectURL(blob);

            // DLリンク作成
            const a = document.createElement('a');
            a.href = url;
            a.download = `${name}.${format}`;
            a.target = "_blank";
            a.click();

            logger("🏁 変換完了！ダウンロードしたぞ！");
            btn.disabled = false;
        }
    </script>
</body>
</html>
