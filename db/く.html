<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini programming隊 - デコーダーv2</title>
    <style>
        body { background: #010a01; color: #33ff33; font-family: 'Courier New', monospace; display: flex; flex-direction: column; align-items: center; padding: 30px; }
        h2 { text-shadow: 0 0 10px #33ff33; border-bottom: 2px solid #33ff33; }
        .box { background: rgba(0, 40, 0, 0.8); border: 1px solid #33ff33; padding: 20px; margin: 15px; width: 90%; max-width: 700px; border-radius: 5px; position: relative; }
        video { width: 100%; max-width: 250px; display: block; margin: 0 auto 20px; filter: drop-shadow(0 0 10px gold); }
        #log { height: 120px; overflow-y: auto; background: #000; padding: 10px; border: 1px inset #33ff33; font-size: 12px; margin-bottom: 10px; }
        .result-area { border-top: 2px dashed #33ff33; padding-top: 15px; text-align: center; }
        .preview-content { max-width: 100%; border: 2px solid gold; margin-top: 10px; }
    </style>
</head>
<body>
    <h2>🛰️ インテリジェンス・デコーダー v2</h2>

    <div class="box">
        <input type="file" id="targetFile"  style="margin-bottom:15px;">
        <video id="previewVideo" controls loop></video>
        <button onclick="decodeV2()" style="width:100%; padding:15px; background:#111; color:#33ff33; border:1px solid #33ff33; cursor:pointer; font-weight:bold;">シークエンス解析開始</button>
    </div>

    <div class="box">
        <pre id="log">ステータス: 待機中...</pre>
        <div id="resultArea" class="result-area">
            </div>
    </div>

    <script>
        const log = (msg) => document.getElementById('log').innerText += msg + "\n";

        // ファイル選択時にビデオをプレビュー
        document.getElementById('targetFile').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) document.getElementById('previewVideo').src = URL.createObjectURL(file);
        });

        async function decodeV2() {
            const file = document.getElementById('targetFile').files[0];
            if (!file) return alert("隊員！解析対象の動画を選んでくれ！");

            const logEl = document.getElementById('log');
            const resultArea = document.getElementById('resultArea');
            logEl.innerText = "🚀 解析シークエンス開始...\n";
            resultArea.innerHTML = "";

            const buffer = await file.arrayBuffer();
            const uint8 = new Uint8Array(buffer);

            const enc = new TextEncoder();
            const dec = new TextDecoder();

            const marker = "SECRET_V2";
            const separator = "::DATA::";

            // 1. 合言葉を探す
            const markerIdx = findSequence(uint8, enc.encode(marker));
            if (markerIdx === -1) {
                log("❌ 警告：SECRET_V2 マーカー未検出。");
                return;
            }

            // 2. 境界線を探す
            const sepIdx = findSequence(uint8, enc.encode(separator), markerIdx);
            if (sepIdx === -1) {
                log("❌ 警告：データ境界線 ::DATA:: が見つかりません。");
                return;
            }

            // 3. メタデータを抽出
            const metaPart = uint8.slice(markerIdx + marker.length, sepIdx);
            const meta = JSON.parse(dec.decode(metaPart));
            log(`✅ メタデータ受信: ${meta.name} (${meta.type})`);
            
            // 決定した値を報告！
            console.log(`targetName:${meta.name}`);

            // 4. 実データを抽出
            const dataPart = uint8.slice(sepIdx + separator.length);
            log(`📦 実データ救出完了: ${dataPart.length} bytes`);

            // 5. 自動展開
            deployData(dataPart, meta);
        }

        // バイナリ内検索関数
        function findSequence(data, seq, start = 0) {
            for (let i = start; i < data.length - seq.length; i++) {
                if (seq.every((b, j) => data[i + j] === b)) return i;
            }
            return -1;
        }

        // データの種類に合わせて画面に出す
        function deployData(data, meta) {
            const blob = new Blob([data], { type: meta.type });
            const url = URL.createObjectURL(blob);
            const area = document.getElementById('resultArea');
            
            area.innerHTML = `<h4>🎁 復元アイテム: ${meta.name}</h4>`;

            if (meta.type.startsWith('image/')) {
                const img = document.createElement('img');
                img.src = url;
                img.className = 'preview-content';
                area.appendChild(img);
            } else if (meta.type.startsWith('video/')) {
                const vid = document.createElement('video');
                vid.src = url;
                vid.controls = true;
                vid.className = 'preview-content';
                area.appendChild(vid);
            } else if (meta.type.startsWith('audio/')) {
                const aud = document.createElement('audio');
                aud.src = url;
                aud.controls = true;
                area.appendChild(aud);
            } else {
                // それ以外（テキストやJSON、SVGなど）はダウンロード提供
                const a = document.createElement('a');
                a.href = url;
                a.download = meta.name;
                a.innerText = "💾 ファイルをダウンロードして確認";
                a.style.color = "gold";
                area.appendChild(a);
            }
        }
    </script>
</body>
</html>
