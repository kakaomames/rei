<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>音声波形カットエディタ（マルチデバイス対応版）</title>
    <style>
        body { font-family: sans-serif; background: #1e1e24; color: #fff; max-width: 900px; margin: 20px auto; padding: 0 20px; }
        .wrapper { background: #2a2a35; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .controls { margin-bottom: 15px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        button { background: #4f46e5; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:disabled { background: #4b5563; cursor: not-allowed; opacity: 0.6; }
        button#cutBtn { background: #ef4444; }
        button#cutBtn:disabled { background: #4b5563; }
        .canvas-container { position: relative; width: 100%; height: 200px; margin-top: 15px; background: #111116; border-radius: 4px; }
        /* touch-action: none でスマホ操作時の画面スクロールを防止 */
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: block; touch-action: none; }
        #info { margin-top: 10px; font-size: 14px; color: #a1a1aa; background: #141419; padding: 10px; border-radius: 4px; }
    </style>
</head>
<body>

<div class="wrapper">
    <h2>音声波形カットエディタ（パッド・タッチ対応）</h2>
    <p style="font-size:13px; color:#ccc;">①ファイル選択 ➔ ②波形をドラッグまたはタッチで範囲選択 ➔ ③カットボタンを押す</p>
    
    <div class="controls">
        <input type="file" id="audioFile" accept="">
        <button id="playBtn" disabled>▶ 再生</button>
        <button id="stopBtn" disabled>■ 停止</button>
        <button id="cutBtn" disabled>✂ 選択範囲をカット</button>
    </div>

    <div class="canvas-container">
        <canvas id="waveformCanvas"></canvas>
        <canvas id="uiCanvas"></canvas>
    </div>

    <div id="info">音声ファイルを読み込んでください</div>
</div>

<script>
    const fileInput = document.getElementById('audioFile');
    const playBtn = document.getElementById('playBtn');
    const stopBtn = document.getElementById('stopBtn');
    const cutBtn = document.getElementById('cutBtn');
    const info = document.getElementById('info');
    
    const wfCanvas = document.getElementById('waveformCanvas');
    const wfCtx = wfCanvas.getContext('2d');
    const uiCanvas = document.getElementById('uiCanvas');
    const uiCtx = uiCanvas.getContext('2d');

    let audioCtx = null;
    let audioBuffer = null;
    let currentSource = null;

    let isDragging = false;
    let startX = null;
    let endX = null;

    function resizeCanvases() {
        const rect = wfCanvas.parentElement.getBoundingClientRect();
        wfCanvas.width = rect.width;
        wfCanvas.height = rect.height;
        uiCanvas.width = rect.width;
        uiCanvas.height = rect.height;
    }

    window.addEventListener('load', resizeCanvases);
    window.addEventListener('resize', () => {
        resizeCanvases();
        if (audioBuffer) drawEntireWaveform();
    });

    fileInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        info.textContent = "音声をデコード中...";
        
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        try {
            const arrayBuffer = await file.arrayBuffer();
            audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
            
            resizeCanvases();
            playBtn.disabled = false;
            stopBtn.disabled = false;
            startX = null;
            endX = null;
            
            drawEntireWaveform();
            clearUI();
            updateInfo();
        } catch (err) {
            info.textContent = "音声ファイルの読み込みに失敗しました。";
            console.error(err);
        }
    });

    function drawEntireWaveform() {
        if (!audioBuffer) return;

        const width = wfCanvas.width;
        const height = wfCanvas.height;
        const leftChannelData = audioBuffer.getChannelData(0); 
        const step = Math.ceil(leftChannelData.length / width);

        wfCtx.clearRect(0, 0, width, height);
        wfCtx.fillStyle = '#111116';
        wfCtx.fillRect(0, 0, width, height);
        
        wfCtx.strokeStyle = '#38bdf8';
        wfCtx.lineWidth = 1.5;
        wfCtx.beginPath();

        for (let i = 0; i < width; i++) {
            let min = 1.0;
            let max = -1.0;
            
            for (let j = 0; j < step; j++) {
                const index = i * step + j;
                if (index >= leftChannelData.length) break;
                const sample = leftChannelData[index];
                if (sample < min) min = sample;
                if (sample > max) max = sample;
            }
            
            const yMin = (1 + min) * height / 2;
            const yMax = (1 + max) * height / 2;
            
            wfCtx.moveTo(i, yMin);
            wfCtx.lineTo(i, yMax);
        }
        wfCtx.stroke();
    }

    // ─── 座標取得関数の拡張 ───
    // マウスイベントとタッチイベントの両方から、正確なX座標を割り出します
    function getX(e) {
        const rect = uiCanvas.getBoundingClientRect();
        // タッチイベント（e.touches）がある場合はそちらの1点目を採用、なければ通常のマウス座標
        const clientX = e.touches && e.touches.length > 0 ? e.touches[0].clientX : e.clientX;
        return clientX - rect.left;
    }

    // ─── イベント処理の共通関数 ───
    function onStart(e) {
        if (!audioBuffer) return;
        isDragging = true;
        
        if (currentSource) {
            try { currentSource.stop(); } catch(err){}
        }

        startX = getX(e);
        endX = startX;
        clearUI();
    }

    function onMove(e) {
        if (!isDragging) return;
        endX = getX(e);
        drawSelection();
        updateInfo();
    }

    function onEnd() {
        if (!isDragging) return;
        isDragging = false;
        
        if (startX !== null && endX !== null && Math.abs(startX - endX) > 2) {
            cutBtn.disabled = false;
        } else {
            cutBtn.disabled = true;
            clearUI();
        }
        updateInfo();
    }

    // マウス用のイベント登録
    uiCanvas.addEventListener('mousedown', onStart);
    uiCanvas.addEventListener('mousemove', onMove);
    uiCanvas.addEventListener('mouseup', onEnd);

    // タッチ・パッド操作用のイベント登録
    uiCanvas.addEventListener('touchstart', onStart);
    uiCanvas.addEventListener('touchmove', onMove);
    uiCanvas.addEventListener('touchend', onEnd);


    function drawSelection() {
        uiCtx.clearRect(0, 0, uiCanvas.width, uiCanvas.height);
        uiCtx.fillStyle = 'rgba(239, 68, 68, 0.4)';
        
        const x = Math.min(startX, endX);
        const w = Math.abs(startX - endX);
        uiCtx.fillRect(x, 0, w, uiCanvas.height);
    }

    function clearUI() {
        uiCtx.clearRect(0, 0, uiCanvas.width, uiCanvas.height);
        cutBtn.disabled = true;
    }

    cutBtn.addEventListener('click', () => {
        if (!audioBuffer || startX === null || endX === null) return;

        const totalSamples = audioBuffer.length;
        const sampleRate = audioBuffer.sampleRate;
        const channels = audioBuffer.numberOfChannels;

        const xMin = Math.min(startX, endX);
        const xMax = Math.max(startX, endX);
        
        const cutStartSample = Math.floor((xMin / uiCanvas.width) * totalSamples);
        const cutEndSample = Math.floor((xMax / uiCanvas.width) * totalSamples);
        const cutLength = cutEndSample - cutStartSample;

        const newLength = totalSamples - cutLength;
        if (newLength <= 0) return;

        const newBuffer = audioCtx.createBuffer(channels, newLength, sampleRate);

        for (let ch = 0; ch < channels; ch++) {
            const oldData = audioBuffer.getChannelData(ch);
            const newData = newBuffer.getChannelData(ch);

            newData.set(oldData.subarray(0, cutStartSample), 0);
            newData.set(oldData.subarray(cutEndSample, totalSamples), cutStartSample);
        }

        audioBuffer = newBuffer;
        startX = null;
        endX = null;
        
        drawEntireWaveform();
        clearUI();
        updateInfo();
    });

    function updateInfo() {
        if (!audioBuffer) {
            info.textContent = "音声ファイルを読み込んでください";
            return;
        }
        let text = `🎵 総再生時間: ${audioBuffer.duration.toFixed(2)} 秒`;
        
        if (startX !== null && endX !== null && Math.abs(startX - endX) > 2) {
            const xMin = Math.min(startX, endX);
            const xMax = Math.max(startX, endX);
            const sTime = ((xMin / uiCanvas.width) * audioBuffer.duration).toFixed(2);
            const eTime = ((xMax / uiCanvas.width) * audioBuffer.duration).toFixed(2);
            text += ` ｜ 🔴 選択範囲: ${sTime}秒 〜 ${eTime}秒 (カットされる長さ: ${(eTime - sTime).toFixed(2)}秒)`;
        } else {
            text += ` ｜ 波形をドラッグ・タッチすると範囲を選択できます。`;
        }
        info.textContent = text;
    }

    playBtn.addEventListener('click', async () => {
        if (!audioBuffer) return;
        
        if (audioCtx.state === 'suspended') {
            await audioCtx.resume();
        }

        if (currentSource) {
            try { currentSource.stop(); } catch(err){}
        }

        currentSource = audioCtx.createBufferSource();
        currentSource.buffer = audioBuffer;
        currentSource.connect(audioCtx.destination);
        currentSource.start(0);
    });

    stopBtn.addEventListener('click', () => {
        if (currentSource) {
            try { currentSource.stop(); } catch(err){}
        }
    });
</script>

</body>
</html>
