<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Three.js OBJ ドラグ＆ドロップビルダー</title>
    <style>
        body { margin: 0; overflow: hidden; display: flex; font-family: sans-serif; }
        /* 左側のリストコンテナのスタイル */
        #object-list-container {
            width: 250px;
            height: 100vh;
            background-color: #222;
            color: white;
            padding: 10px;
            box-sizing: border-box;
            overflow-y: auto;
            border-right: 1px solid #444;
        }
        /* 3Dビューポートのスタイル */
        #threejs-container {
            flex-grow: 1;
            height: 100vh;
            position: relative;
        }
        /* ドロップゾーンのスタイル */
        #drop-zone {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            pointer-events: none; /* 通常時はクリックを透過 */
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 100;
        }
        #drop-zone.drag-over {
            opacity: 1;
            pointer-events: auto; /* ドラッグ中はクリック可能に */
        }
        /* リストアイテムのスタイル */
        #object-list > li {
            padding: 5px;
            margin-bottom: 5px;
            background-color: #333;
            cursor: pointer;
            border-radius: 3px;
            transition: background-color 0.2s;
        }
        #object-list > li:hover {
            background-color: #444;
        }
        #object-list > li.selected {
            background-color: #007bff;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="object-list-container">
        <h2>📦 OBJリスト</h2>
        <ul id="object-list" style="list-style: none; padding: 0;">
            </ul>
    </div>

    <div id="threejs-container">
        <div id="drop-zone">ここにOBJファイルをドロップしてください (.obj)</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.165.0/examples/js/loaders/OBJLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.165.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // グローバル変数
        let scene, camera, renderer, controls;
        const container = document.getElementById('threejs-container');
        const dropZone = document.getElementById('drop-zone');
        const objectList = document.getElementById('object-list');
        const loadedObjects = {}; // { id: THREE.Object3D } のマップ
        let currentObjectID = 0; // オブジェクトのユニークIDカウンター
        let selectedObject = null; // 現在選択されているオブジェクト

        /**
         * 🚀 シーンの初期化
         */
        function init() {
            // シーン
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x333333);

            // カメラ
            camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.z = 5;

            // レンダラー
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            container.appendChild(renderer.domElement);

            // ライト
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
            directionalLight.position.set(1, 1, 1).normalize();
            scene.add(directionalLight);

            // コントロール (マウスでの操作を可能にする)
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true; // 動きを滑らかにする

            // イベントリスナー設定
            window.addEventListener('resize', onWindowResize);
            setupDragAndDrop();

            // アニメーションループ開始
            animate();
            console.log("Three.js シーン初期化完了。");
        }

        /**
         * 🔄 ウィンドウサイズ変更時の処理
         */
        function onWindowResize() {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        /**
         * 🖼️ アニメーションループ
         */
        function animate() {
            requestAnimationFrame(animate);

            controls.update(); // OrbitControlsを更新

            renderer.render(scene, camera);
        }

        /**
         * 📥 ドラッグ＆ドロップ設定
         */
        function setupDragAndDrop() {
            const preventDefaults = (e) => {
                e.preventDefault();
                e.stopPropagation();
            };

            ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                container.addEventListener(eventName, preventDefaults, false);
            });

            // ドロップゾーンの表示切替
            ['dragenter', 'dragover'].forEach(eventName => {
                container.addEventListener(eventName, () => {
                    dropZone.classList.add('drag-over');
                }, false);
            });

            ['dragleave', 'drop'].forEach(eventName => {
                container.addEventListener(eventName, () => {
                    dropZone.classList.remove('drag-over');
                }, false);
            });

            container.addEventListener('drop', handleDrop, false);
        }

        /**
         * 📤 ドロップ処理
         * @param {DragEvent} e
         */
        function handleDrop(e) {
            const dt = e.dataTransfer;
            const files = dt.files;

            Array.from(files).forEach(file => {
                if (file.name.toLowerCase().endsWith('.obj')) {
                    loadOBJFile(file);
                } else {
                    console.warn(`サポートされていないファイル形式: ${file.name}`);
                }
            });
        }

        /**
         * 📦 OBJファイルの読み込み
         * @param {File} file
         */
        function loadOBJFile(file) {
            const reader = new FileReader();
            reader.onload = (event) => {
                const loader = new THREE.OBJLoader();
                const object = loader.parse(event.target.result);

                const id = currentObjectID++;
                const uniqueName = `${file.name.replace(/\.obj$/i, '')}_${id}`;
                object.name = uniqueName;

                // OBJにデフォルトのマテリアルを適用
                object.traverse((child) => {
                    if (child.isMesh) {
                        child.material = new THREE.MeshPhongMaterial({
                            color: Math.random() * 0xffffff, // ランダムな色を設定
                            specular: 0x111111,
                            shininess: 30,
                            side: THREE.DoubleSide
                        });
                        child.castShadow = true;
                        child.receiveShadow = true;
                    }
                });
                
                // オブジェクトをシーンに追加
                scene.add(object);
                loadedObjects[id] = object;
                
                console.log(`OBJ読み込み完了: ${uniqueName}`);
                printLoadedObject(id, uniqueName, object);

                // リストに項目を追加
                addToList(id, uniqueName);
            };
            reader.readAsText(file);
        }
        
        /**
         * 🐍 Pythonでの値出力のルールに従って情報を出力
         * @param {number} id
         * @param {string} name
         * @param {THREE.Object3D} object
         */
        function printLoadedObject(id, name, object) {
            const data = {
                id: id,
                name: name,
                position: { x: object.position.x, y: object.position.y, z: object.position.z },
                childrenCount: object.children.length
            };
            // 隊員の要望に従い、Python風に出力 (JavaScriptのコンソールに出力)
            console.log(`\n### 隊員報告: OBJ読み込み完了 (ID: ${id}) ###`);
            console.log(`object_id: ${id}`);
            console.log(`object_name: ${name}`);
            console.log(`object_position: x:${data.position.x}, y:${data.position.y}, z:${data.position.z}`);
            console.log(`object_children: ${data.childrenCount}`);
            console.log("#############################################\n");
        }


        /**
         * 📋 左側のリストに項目を追加
         * @param {number} id
         * @param {string} name
         */
        function addToList(id, name) {
            const listItem = document.createElement('li');
            listItem.id = `obj-item-${id}`;
            listItem.textContent = `[ID:${id}] ${name}`;
            listItem.dataset.objectId = id;
            
            listItem.addEventListener('click', () => {
                selectObject(id);
            });
            
            objectList.appendChild(listItem);
            
            // 最初のオブジェクトを自動選択
            if (Object.keys(loadedObjects).length === 1) {
                selectObject(id);
            }
        }

        /**
         * 🖱️ オブジェクトを選択し、強調表示
         * @param {number} id
         */
        function selectObject(id) {
            // 前の選択を解除
            if (selectedObject) {
                const prevItem = document.getElementById(`obj-item-${selectedObject.id}`);
                if (prevItem) {
                    prevItem.classList.remove('selected');
                    // 前のオブジェクトのハイライトを解除 (ここでは色をランダムなデフォルト色に戻す)
                    selectedObject.traverse((child) => {
                        if (child.isMesh) {
                            if (child.userData.originalColor) {
                                child.material.color.set(child.userData.originalColor);
                                delete child.userData.originalColor;
                            }
                        }
                    });
                }
            }

            // 新しい選択を設定
            selectedObject = loadedObjects[id];
            
            if (selectedObject) {
                const currentItem = document.getElementById(`obj-item-${id}`);
                currentItem.classList.add('selected');
                
                // 新しいオブジェクトをハイライト (例: 黄色にする)
                const highlightColor = 0xffff00;
                selectedObject.traverse((child) => {
                    if (child.isMesh) {
                        if (!child.userData.originalColor) {
                            // 元の色を保存してからハイライト
                            child.userData.originalColor = child.material.color.clone();
                            child.material.color.set(highlightColor);
                        }
                    }
                });
                
                // カメラをオブジェクトに近づける（オプション）
                controls.target.copy(selectedObject.position);
                controls.update();

                console.log(`✅ オブジェクト [ID:${id}] を選択しました。`);
            }
        }

        // 初期化実行
        init();
    </script>
</body>
</html>
