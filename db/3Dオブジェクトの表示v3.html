<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>カスタムファイルアップロードUI - Gemini programming隊</title>
    <style>
        /* 🎨 CSSで見た目をカスタマイズする部分 🎨 */

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f4f7f9;
        }

        /* カスタムボタンのスタイル */
        .custom-file-upload {
            /* 見た目：ボタンのデザイン */
            display: inline-block;
            padding: 12px 25px;
            cursor: pointer; /* マウスカーソルを指マークに */
            background-color: #3498db; /* 青系の色 */
            color: white;
            border-radius: 8px; /* 角を丸く */
            border: none;
            box-shadow: 0 4px #2980b9; /* 影で立体的に */
            transition: background-color 0.2s, box-shadow 0.2s, transform 0.2s;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
        }

        /* ホバー時のスタイル */
        .custom-file-upload:hover {
            background-color: #2980b9;
        }

        /* クリック（アクティブ）時のスタイル */
        .custom-file-upload:active {
            background-color: #21618c;
            box-shadow: 0 2px #21618c;
            transform: translateY(2px); /* 押し込まれたように見せる */
        }

        /* ファイル名表示エリアのスタイル */
        #file-name-display {
            margin-top: 20px;
            padding: 10px 15px;
            min-height: 20px;
            width: 300px;
            background-color: #ecf0f1;
            border: 1px solid #bdc3c7;
            border-radius: 5px;
            color: #34495e;
            text-align: center;
            font-size: 14px;
        }

    </style>
</head>
<body>

    <h2>ファイルアップロード（カスタムUI）</h2>
    
    <label for="hiddenFileInput" class="custom-file-upload">
        📂 ファイルを選択してください
    </label>

    <input type="file" id="hiddenFileInput" style="display: none;">

    <div id="file-name-display">
        ファイルは選択されていません。
    </div>

    <script>
        // 🚀 JavaScriptで動作を追加する部分 🚀
        
        // 要素の取得
        const fileInput = document.getElementById('hiddenFileInput');
        const fileLabel = document.querySelector('.custom-file-upload');
        const fileNameDisplay = document.getElementById('file-name-display');

        fileInput.addEventListener('change', (event) => {
            // event.target.files は FileList オブジェクト（選択されたファイルのリスト）
            const files = event.target.files;
            
            if (files.length > 0) {
                // ファイルが一つ以上選択された場合
                const fileName = files[0].name;
                
                // カスタムボタンのテキストとファイル名表示エリアを更新
                fileLabel.textContent = `ファイル変更（${files.length}個）`;
                fileNameDisplay.textContent = `✅ 選択されたファイル: ${fileName}`;
                
                // 複数ファイル選択の場合は補足
                if (files.length > 1) {
                    fileNameDisplay.textContent += ` 他に ${files.length - 1} 個`;
                }

                console.log(`files:${files}`); // 隊員の指示に基づき値を出力
                console.log(`fileName:${fileName}`); // 隊員の指示に基づき値を出力

            } else {
                // ファイルが選択されなかった場合（キャンセルなど）
                fileLabel.textContent = '📂 ファイルを選択してください';
                fileNameDisplay.textContent = 'ファイルは選択されていません。';
            }
        });
    </script>

</body>
</html>
