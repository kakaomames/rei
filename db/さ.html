<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="ダブル入力対応・高信頼性テクスチャスキャナー">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hybrid Scanner - Gemini Programming隊</title>
    <style>
        body { font-family: 'Courier New', monospace; background: #000; color: #0f0; text-align: center; padding: 20px; }
        .box { border: 2px solid #333; background: #111; padding: 20px; display: inline-block; width: 400px; }
        
        /* 1. ドラッグ＆ドロップ領域 */
        #drop-zone { 
            border: 3px dashed #0f0; 
            padding: 40px; 
            margin-bottom: 20px; 
            background: #001100;
            transition: 0.3s;
            cursor: pointer;
        }
        #drop-zone.hover { background: #004400; border-style: solid; }

        /* 2. ファイル選択ボタン（Input） */
        .input-section { 
            border-top: 1px solid #333; 
            padding-top: 20px; 
            margin-top: 10px; 
        }
        #file-input { color: #0f0; }

        canvas { image-rendering: pixelated; width: 256px; height: 256px; border: 1px solid #0f0; margin: 10px 0; }
        #status { color: #ff0; font-weight: bold; min-height: 1.2em; }
        button#dl-btn { background: #0f0; color: #000; border: none; padding: 10px 20px; font-weight: bold; cursor: pointer; margin-top: 10px; display: none; }
    </style>
</head>
<body>
    <img src="https://kakaomames.github.io/rei/logo.png" alt="logo" style="width: 50px;">
    <h1>📡 HYBRID INPUT SCANNER</h1>

    <div class="box">
        <div id="drop-zone">
            ここにファイルをドロップ！<br>(D&D MODE)
        </div>

        <div class="input-section">
            <p style="font-size: 0.8em;">↑が動かない場合はこちらから：</p>
            <input type="file" id="file-input" accept="image/png" multiple>
        </div>

        <canvas id="scan-canvas" width="16" height="16"></canvas>
        <div id="status">READY...</div>
        <button id="dl-btn">💾 JSON DOWNLOAD</button>
    </div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const status = document.getElementById('status');
        const canvas = document.getElementById('scan-canvas');
        const ctx = canvas.getContext('2d');
        const dlBtn = document.getElementById('dl-btn');

        let finalData = { "color": {} };

        // --- ⚙️ 共通のファイル処理エンジン ---
        async function startProtocol(files) {
            if (files.length === 0) return;
            status.textContent = "PROTOCOL START...";
            
            for (let file of files) {
                const name = file.name.replace('.png', '');
                status.textContent = `ANALYZING: ${name}`;
                
                const pixels = await new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const img = new Image();
                        img.onload = async () => {
                            ctx.drawImage(img, 0, 0, 16, 16);
                            const pix = ctx.getImageData(0, 0, 16, 16).data;
                            let res = [];
                            for (let i = 0; i < pix.length; i += 4) {
                                res.push([pix[i], pix[i+1], pix[i+2]]);
                                // 慎重派ウェイト（1ピクセルごとには重すぎるので0.5ms相当の微小ウェイト）
                                if (i % 64 === 0) await new Promise(r => setTimeout(r, 1)); 
                            }
                            console.log(`a: ${name} determined.`); // 決定時に出力
                            resolve(res);
                        };
                        img.src = e.target.result;
                    };
                    reader.readAsDataURL(file);
                });
                finalData.color[name] = pixels;
            }
            status.textContent = "✅ ALL COMPLETE.";
            dlBtn.style.display = "inline-block";
        }

        // --- 🖱️ 方法A: ドラッグ＆ドロップの制御 ---
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(n => {
            dropZone.addEventListener(n, e => { e.preventDefault(); e.stopPropagation(); });
        });
        dropZone.addEventListener('dragover', () => dropZone.classList.add('hover'));
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('hover'));
        dropZone.addEventListener('drop', (e) => {
            dropZone.classList.remove('hover');
            startProtocol(e.dataTransfer.files);
        });

        // --- 📂 方法B: ファイル選択の制御 ---
        fileInput.addEventListener('change', (e) => startProtocol(e.target.files));

        // --- 💾 保存 ---
        dlBtn.addEventListener('click', () => {
            const blob = new Blob([JSON.stringify(finalData, null, 2)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'multi_texture.json';
            a.click();
            console.log("a: multi_texture.json downloaded.");
        });
    </script>
</body>
</html>
