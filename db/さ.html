<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>JSON to Image Recovery - Gemini Programming隊</title>
    <style>
        body { background: #111; color: #0f0; font-family: monospace; text-align: center; }
        #viewer { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; padding: 20px; }
        .block-unit { border: 1px solid #0f0; padding: 5px; background: #222; }
        canvas { image-rendering: pixelated; width: 64px; height: 64px; }
    </style>
</head>
<body>
    <h1>🛠️ JSON RECOVERY UNIT</h1>
    <p>さっきダウンロードした .json を選んでみてくれ！</p>
    <input type="file" id="json-loader" accept=".json">
    <div id="viewer"></div>

    <script>
        document.getElementById('json-loader').addEventListener('change', function(e) {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = function(ev) {
                const data = JSON.parse(ev.target.result);
                const viewer = document.getElementById('viewer');
                viewer.innerHTML = ''; // リセット

                // JSON内の各ブロックをループで回す
                for (const name in data.color) {
                    const pixels = data.color[name];
                    
                    // カード作成
                    const unit = document.createElement('div');
                    unit.className = 'block-unit';
                    
                    // Canvasで画像を復元！
                    const can = document.createElement('canvas');
                    can.width = 16;
                    can.height = 16;
                    const ctx = can.getContext('2d');
                    const imgData = ctx.createImageData(16, 16);

                    for (let i = 0; i < pixels.length; i++) {
                        imgData.data[i * 4] = pixels[i][0];     // R
                        imgData.data[i * 4 + 1] = pixels[i][1]; // G
                        imgData.data[i * 4 + 2] = pixels[i][2]; // B
                        imgData.data[i * 4 + 3] = 255;          // A (不透明)
                    }
                    ctx.putImageData(imgData, 0, 0);

                    unit.appendChild(can);
                    unit.innerHTML += `<br>${name}`;
                    viewer.appendChild(unit);
                }
                console.log("a: Recovery complete for JSON data.");
            };
            reader.readAsText(file);
        });
    </script>
</body>
</html>
