<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="description" content="Minecraft Web Edition 4-Layer Canvas Prototype">
  <meta name="author" content="@kakaomames">
  <meta property="og:title" content="マイクラ4層Canvasプロトタイプ (空2D / 世界3D / 表示UI2D / 操作UI2D)">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://kakaomames.github.io/rei/logo.png">
  <link rel="icon" href="https://kakaomames.github.io/rei/logo.png">
  <title>マイクラ4層Canvasプロトタイプ</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0b0e14;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px;
      gap: 10px;
    }
    h1 {
      font-size: 1.15rem;
      text-align: center;
    }
    .stage-box {
      position: relative;
      width: 100%;
      max-width: 820px;
      height: 460px;
      border: 2px solid #38bdf8;
      border-radius: 12px;
      overflow: hidden;
      background: #05070c;
    }
    .mc-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    /* 1枚目(最奥: 空2D) -> 2枚目(世界3D) -> 3枚目(表示UI2D) -> 4枚目(操作UI2D) */
    #layer-1-sky {
      z-index: 1;
      pointer-events: none;
    }
    #layer-2-world {
      z-index: 2;
      pointer-events: none;
      background: transparent;
    }
    #layer-3-hud {
      z-index: 3;
      pointer-events: none;
      background: transparent;
    }
    #layer-4-controls {
      z-index: 4;
      pointer-events: auto;
      background: transparent;
      touch-action: none;
    }
    .log-area {
      width: 100%;
      max-width: 820px;
      background: #111722;
      border: 1px solid #263244;
      border-radius: 8px;
      padding: 8px 10px;
      font-family: monospace;
      font-size: 0.76rem;
      color: #a3e635;
      max-height: 120px;
      overflow-y: auto;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <h1>⛏️ マイクラ4層Canvas：1枚目(空2D) / 2枚目(世界3D) / 3枚目(表示UI2D) / 4枚目(操作UI2D)</h1>

  <div id="stage" class="stage-box">
    <!-- 1枚目: 空を描画する2Dキャンバス -->
    <canvas id="layer-1-sky" class="mc-canvas"></canvas>
    <!-- 2枚目: マイクラの3D世界を描画するキャンバス -->
    <canvas id="layer-2-world" class="mc-canvas"></canvas>
    <!-- 3枚目: クロスヘア・音の字幕・インベントリ背景などの表示系2D UI -->
    <canvas id="layer-3-hud" class="mc-canvas"></canvas>
    <!-- 4枚目: ジョイスティック・ジャンプ・しゃがみ・ブロック選択などの操作系2D UI -->
    <canvas id="layer-4-controls" class="mc-canvas"></canvas>
  </div>

  <div id="log-box" class="log-area">[INIT] 4層マイクラCanvas起動準備完了 ⛏️</div>

  <script type="module">
    import * as THREE from 'three';

    const stage = document.getElementById('stage');
    const c1 = document.getElementById('layer-1-sky');
    const c2 = document.getElementById('layer-2-world');
    const c3 = document.getElementById('layer-3-hud');
    const c4 = document.getElementById('layer-4-controls');
    const logBox = document.getElementById('log-box');

    const ctx1 = c1.getContext('2d');
    const ctx3 = c3.getContext('2d');
    const ctx4 = c4.getContext('2d');

    function logChange(category, msg) {
      const time = new Date().toLocaleTimeString('ja-JP');
      const div = document.createElement('div');
      div.textContent = `[${time}] [${category}] ${msg}`;
      logBox.appendChild(div);
      logBox.scrollTop = logBox.scrollHeight;
      console.log(`[${category}] ${msg}`);
    }

    const BLOCK_PALETTE = [
      { name: '草ブロック', color: 0x4ade80, hex: '#4ade80' },
      { name: '土ブロック', color: 0xa16207, hex: '#a16207' },
      { name: '石ブロック', color: 0x94a3b8, hex: '#94a3b8' },
      { name: 'オークの木材', color: 0xd97706, hex: '#d97706' },
      { name: 'ガラス', color: 0x7dd3fc, hex: '#7dd3fc' }
    ];

    const state = {
      width: 0,
      height: 0,
      playerX: 0,
      playerY: 0,
      playerZ: 4.5,
      yaw: 0,
      pitch: -0.15,
      isJumping: false,
      isSneaking: false,
      selectedSlot: 0,
      inventoryOpen: false,
      inputMode: 'TOUCH', // TOUCH / KEYBOARD / CONTROLLER
      stickActive: false,
      stickPointerId: null,
      stickOriginX: 0,
      stickOriginY: 0,
      stickVecX: 0,
      stickVecY: 0,
      lookPointerId: null,
      lookLastX: 0,
      lookLastY: 0,
      subtitles: [
        { text: '♪ 草の上を歩く音', ttl: 3.5 },
        { text: '■ ブロックが置かれた音', ttl: 2.0 }
      ]
    };

    function pushSubtitle(text) {
      state.subtitles.unshift({ text, ttl: 3.2 });
      if (state.subtitles.length > 3) {
        state.subtitles.pop();
      }
      logChange('SUBTITLE', `音の字幕追加: "${text}" 🔊`);
    }

    // --- 2枚目: Three.js 3Dワールド（1枚目の空が見えるように透過） ---
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(65, 16 / 9, 0.1, 100);
    const renderer = new THREE.WebGLRenderer({
      canvas: c2,
      alpha: true,
      antialias: true
    });
    renderer.setClearColor(0x000000, 0);

    const ambient = new THREE.AmbientLight(0xffffff, 0.85);
    scene.add(ambient);

    const sunLight = new THREE.DirectionalLight(0xfffbeb, 1.4);
    sunLight.position.set(6, 12, 8);
    scene.add(sunLight);

    const floorGrid = new THREE.GridHelper(16, 16, 0x22c55e, 0x334155);
    floorGrid.position.y = -0.5;
    scene.add(floorGrid);

    const sampleBlockGeo = new THREE.BoxGeometry(1, 1, 1);
    const sampleBlockMat = new THREE.MeshStandardMaterial({
      color: BLOCK_PALETTE[state.selectedSlot].color,
      roughness: 0.65
    });
    const previewBlock = new THREE.Mesh(sampleBlockGeo, sampleBlockMat);
    previewBlock.position.set(0, 0, 0);
    scene.add(previewBlock);

    function syncCamera() {
      const eyeHeight = state.isSneaking ? 0.85 : 1.35;
      const jumpOffset = state.isJumping ? 0.55 : 0;
      camera.position.set(state.playerX, state.playerY + eyeHeight + jumpOffset, state.playerZ);

      const dirX = Math.sin(state.yaw) * Math.cos(state.pitch);
      const dirY = Math.sin(state.pitch);
      const dirZ = -Math.cos(state.yaw) * Math.cos(state.pitch);
      camera.lookAt(
        camera.position.x + dirX,
        camera.position.y + dirY,
        camera.position.z + dirZ
      );
    }
    syncCamera();

    // --- 4枚全レイヤーのサイズ同期 ---
    function resizeAllLayers() {
      const w = stage.clientWidth;
      const h = stage.clientHeight;
      if (!w || !h || (w === state.width && h === state.height)) return;

      const prevW = state.width;
      const prevH = state.height;
      state.width = w;
      state.height = h;

      const dpr = Math.min(window.devicePixelRatio || 1, 2);

      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(dpr);
      renderer.setSize(w, h, false);

      for (const canvas of [c1, c3, c4]) {
        canvas.width = Math.round(w * dpr);
        canvas.height = Math.round(h * dpr);
        const ctx = canvas.getContext('2d');
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      logChange('RESIZE', `レイヤーサイズ変更: ${prevW}x${prevH} -> ${w}x${h} 📐`);
    }
    resizeAllLayers();
    window.addEventListener('resize', resizeAllLayers);

    // --- 4枚目UIレイアウト計算（ジョイスティック / ジャンプ / しゃがみ / ホットバー / インベントリボタン） ---
    function getUIHitboxes() {
      const w = state.width;
      const h = state.height;
      const stickBase = { x: 95, y: h - 105, radius: 52 };

      const jumpBtn = { x: w - 85, y: h - 135, r: 30, label: 'JUMP' };
      const sneakBtn = { x: w - 155, y: h - 85, r: 26, label: 'SNEAK' };
      const invBtn = { x: w - 85, y: 36, w: 68, h: 28, label: 'INV' };

      const slotCount = BLOCK_PALETTE.length;
      const slotSize = 42;
      const gap = 6;
      const totalW = slotCount * slotSize + (slotCount - 1) * gap;
      const startX = Math.round((w - totalW) / 2);
      const startY = h - 54;

      const hotbarSlots = BLOCK_PALETTE.map((item, index) => ({
        index,
        x: startX + index * (slotSize + gap),
        y: startY,
        w: slotSize,
        h: slotSize,
        item
      }));

      return { stickBase, jumpBtn, sneakBtn, invBtn, hotbarSlots };
    }

    function pointInRect(px, py, rect) {
      return px >= rect.x && px <= rect.x + rect.w && py >= rect.y && py <= rect.y + rect.h;
    }

    function dist(x1, y1, x2, y2) {
      return Math.hypot(x1 - x2, y1 - y2);
    }

    // --- 4枚目: タッチ・ポインタ入力処理 ---
    c4.addEventListener('pointerdown', (e) => {
      c4.setPointerCapture(e.pointerId);
      const rect = c4.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      if (state.inputMode !== 'TOUCH') {
        const prevMode = state.inputMode;
        state.inputMode = 'TOUCH';
        logChange('INPUT_MODE', `入力モード変更: ${prevMode} -> TOUCH 👆`);
      }

      const hb = getUIHitboxes();

      // インベントリ開閉トグル（4枚目のボタン操作 -> 3枚目のインベントリ背景と連動）
      if (pointInRect(x, y, hb.invBtn)) {
        const prev = state.inventoryOpen;
        state.inventoryOpen = !state.inventoryOpen;
        logChange('INVENTORY', `インベントリ表示: ${prev} -> ${state.inventoryOpen} 🎒`);
        return;
      }

      // ブロック選択ホットバー
      for (const slot of hb.hotbarSlots) {
        if (pointInRect(x, y, slot)) {
          const prevSlot = state.selectedSlot;
          state.selectedSlot = slot.index;
          previewBlock.material.color.setHex(slot.item.color);
          logChange(
            'HOTBAR',
            `選択ブロック変更: [${prevSlot}] -> [${slot.index}] (${slot.item.name}) 🧱`
          );
          pushSubtitle(`■ ${slot.item.name}を選択`);
          return;
        }
      }

      // ジャンプボタン
      if (dist(x, y, hb.jumpBtn.x, hb.jumpBtn.y) <= hb.jumpBtn.r) {
        const prev = state.isJumping;
        state.isJumping = true;
        syncCamera();
        if (prev !== state.isJumping) {
          logChange('ACTION', `ジャンプ状態: ${prev} -> ${state.isJumping} ⬆️`);
          pushSubtitle('♪ ジャンプした音');
        }
        setTimeout(() => {
          state.isJumping = false;
          syncCamera();
          logChange('ACTION', `ジャンプ着地: isJumping -> false ⬇️`);
        }, 320);
        return;
      }

      // しゃがみボタン
      if (dist(x, y, hb.sneakBtn.x, hb.sneakBtn.y) <= hb.sneakBtn.r) {
        const prev = state.isSneaking;
        state.isSneaking = !state.isSneaking;
        syncCamera();
        logChange('ACTION', `しゃがみ状態: ${prev} -> ${state.isSneaking} 🔽`);
        pushSubtitle(state.isSneaking ? '♪ しゃがんだ音' : '♪ 立ち上がった音');
        return;
      }

      // ジョイスティック領域
      if (dist(x, y, hb.stickBase.x, hb.stickBase.y) <= hb.stickBase.radius * 1.45 && !state.stickActive) {
        state.stickActive = true;
        state.stickPointerId = e.pointerId;
        state.stickOriginX = hb.stickBase.x;
        state.stickOriginY = hb.stickBase.y;
        const dx = x - state.stickOriginX;
        const dy = y - state.stickOriginY;
        const len = Math.hypot(dx, dy);
        const maxR = hb.stickBase.radius;
        const clamped = Math.min(len, maxR);
        const angle = Math.atan2(dy, dx);
        state.stickVecX = len > 0 ? +((Math.cos(angle) * clamped) / maxR).toFixed(2) : 0;
        state.stickVecY = len > 0 ? +((Math.sin(angle) * clamped) / maxR).toFixed(2) : 0;
        logChange('JOYSTICK', `ジョイスティック操作開始 vec=(${state.stickVecX}, ${state.stickVecY}) 🕹️`);
        return;
      }

      // その他エリア：3D視点ドラッグ回転
      if (state.lookPointerId === null) {
        state.lookPointerId = e.pointerId;
        state.lookLastX = x;
        state.lookLastY = y;
      }
    });

    c4.addEventListener('pointermove', (e) => {
      const rect = c4.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      if (state.stickActive && e.pointerId === state.stickPointerId) {
        const prevX = state.stickVecX;
        const prevY = state.stickVecY;
        const dx = x - state.stickOriginX;
        const dy = y - state.stickOriginY;
        const len = Math.hypot(dx, dy);
        const maxR = getUIHitboxes().stickBase.radius;
        const clamped = Math.min(len, maxR);
        const angle = Math.atan2(dy, dx);
        state.stickVecX = len > 1 ? +((Math.cos(angle) * clamped) / maxR).toFixed(2) : 0;
        state.stickVecY = len > 1 ? +((Math.sin(angle) * clamped) / maxR).toFixed(2) : 0;

        if (prevX !== state.stickVecX || prevY !== state.stickVecY) {
          logChange('JOYSTICK', `スティックベクトル変化: (${prevX}, ${prevY}) -> (${state.stickVecX}, ${state.stickVecY}) 🕹️`);
        }
        return;
      }

      if (state.lookPointerId === e.pointerId) {
        const dx = x - state.lookLastX;
        const dy = y - state.lookLastY;
        state.lookLastX = x;
        state.lookLastY = y;

        const prevYaw = state.yaw;
        const prevPitch = state.pitch;
        state.yaw = +(state.yaw - dx * 0.008).toFixed(3);
        state.pitch = +(Math.max(-1.4, Math.min(1.4, state.pitch - dy * 0.008))).toFixed(3);
        syncCamera();

        if (prevYaw !== state.yaw || prevPitch !== state.pitch) {
          logChange('CAMERA', `視点回転 yaw: ${prevYaw} -> ${state.yaw}, pitch: ${prevPitch} -> ${state.pitch} 👀`);
        }
      }
    });

    function releasePointer(e) {
      if (c4.hasPointerCapture(e.pointerId)) {
        c4.releasePointerCapture(e.pointerId);
      }
      if (state.stickActive && e.pointerId === state.stickPointerId) {
        state.stickActive = false;
        state.stickPointerId = null;
        state.stickVecX = 0;
        state.stickVecY = 0;
        logChange('JOYSTICK', `ジョイスティック中央復帰 (0, 0) 🕹️`);
      }
      if (state.lookPointerId === e.pointerId) {
        state.lookPointerId = null;
      }
    }

    c4.addEventListener('pointerup', releasePointer);
    c4.addEventListener('pointercancel', releasePointer);

    // キーボード／ゲームパッド接続検知（3枚目の表示UI切替用）
    window.addEventListener('keydown', (e) => {
      if (state.inputMode !== 'KEYBOARD') {
        const prev = state.inputMode;
        state.inputMode = 'KEYBOARD';
        logChange('INPUT_MODE', `入力モード変更: ${prev} -> KEYBOARD ⌨️`);
      }
      if (e.key >= '1' && e.key <= '5') {
        const idx = Number(e.key) - 1;
        const prev = state.selectedSlot;
        state.selectedSlot = idx;
        previewBlock.material.color.setHex(BLOCK_PALETTE[idx].color);
        logChange('HOTBAR', `キー選択ブロック: [${prev}] -> [${idx}] (${BLOCK_PALETTE[idx].name}) 🧱`);
      }
    });

    window.addEventListener('gamepadconnected', (e) => {
      const prev = state.inputMode;
      state.inputMode = 'CONTROLLER';
      logChange('INPUT_MODE', `コントローラ接続 (${e.gamepad.id}): ${prev} -> CONTROLLER 🎮`);
    });

    // --- 1枚目: 空（2D）描画 ---
    function drawLayer1Sky(elapsed) {
      const w = state.width;
      const h = state.height;
      ctx1.clearRect(0, 0, w, h);

      const skyGrad = ctx1.createLinearGradient(0, 0, 0, h);
      skyGrad.addColorStop(0, '#0ea5e9');
      skyGrad.addColorStop(0.55, '#7dd3fc');
      skyGrad.addColorStop(1, '#e0f2fe');
      ctx1.fillStyle = skyGrad;
      ctx1.fillRect(0, 0, w, h);

      // 太陽
      const sunX = w * 0.78;
      const sunY = h * 0.22;
      ctx1.fillStyle = '#fef08a';
      ctx1.beginPath();
      ctx1.arc(sunX, sunY, 26, 0, Math.PI * 2);
      ctx1.fill();

      // 2Dの雲
      ctx1.fillStyle = 'rgba(255, 255, 255, 0.72)';
      const cloudOffset = (elapsed * 14) % (w + 160);
      for (let i = 0; i < 3; i++) {
        const cx = ((cloudOffset + i * 280) % (w + 180)) - 90;
        const cy = 58 + i * 32;
        ctx1.fillRect(cx, cy, 88, 18);
        ctx1.fillRect(cx + 16, cy - 10, 52, 12);
      }
    }

    // --- 3枚目: 表示系2D UI（クロスヘア・音の字幕・インベントリ背景・モード表示） ---
    function drawLayer3Hud() {
      const w = state.width;
      const h = state.height;
      ctx3.clearRect(0, 0, w, h);

      // 1) クロスヘア（中央照準 +）
      const cx = w / 2;
      const cy = h / 2;
      ctx3.save();
      ctx3.strokeStyle = 'rgba(255, 255, 255, 0.92)';
      ctx3.lineWidth = 2;
      ctx3.beginPath();
      ctx3.moveTo(cx - 10, cy);
      ctx3.lineTo(cx + 10, cy);
      ctx3.moveTo(cx, cy - 10);
      ctx3.lineTo(cx, cy + 10);
      ctx3.stroke();
      ctx3.restore();

      // 2) 入力モード表示（KEYBOARD / CONTROLLER / TOUCH）
      ctx3.fillStyle = 'rgba(15, 23, 42, 0.68)';
      ctx3.fillRect(12, 12, 195, 26);
      ctx3.fillStyle = '#f8fafc';
      ctx3.font = '12px monospace';
      ctx3.fillText(`MODE: ${state.inputMode} | POS:(${state.playerX.toFixed(1)}, ${state.playerZ.toFixed(1)})`, 18, 29);

      // 3) 音の字幕（BE追加風の字幕表示）
      let subY = h - 120;
      for (const sub of state.subtitles) {
        const alpha = Math.min(1, sub.ttl / 0.8);
        ctx3.fillStyle = `rgba(15, 23, 42, ${(0.72 * alpha).toFixed(2)})`;
        ctx3.fillRect(14, subY - 18, 185, 22);
        ctx3.fillStyle = `rgba(253, 224, 71, ${alpha.toFixed(2)})`;
        ctx3.font = '12px sans-serif';
        ctx3.fillText(sub.text, 20, subY - 3);
        subY -= 26;
      }

      // 4) インベントリ背景パネル（3枚目で背景描画、4枚目にアイテム枠を描画する構成も拡張可能）
      if (state.inventoryOpen) {
        const panelW = Math.min(420, w - 48);
        const panelH = 210;
        const px = Math.round((w - panelW) / 2);
        const py = Math.round((h - panelH) / 2) - 10;

        ctx3.fillStyle = 'rgba(15, 23, 42, 0.82)';
        ctx3.fillRect(px, py, panelW, panelH);
        ctx3.strokeStyle = 'rgba(148, 163, 184, 0.7)';
        ctx3.lineWidth = 2;
        ctx3.strokeRect(px, py, panelW, panelH);

        ctx3.fillStyle = '#e2e8f0';
        ctx3.font = 'bold 14px sans-serif';
        ctx3.fillText('INVENTORY BACKDROP (Layer 3)', px + 14, py + 24);
      }
    }

    // --- 4枚目: 操作系2D UI（ジョイスティック・ジャンプ・しゃがみ・ブロック選択・INVボタン） ---
    function drawLayer4Controls() {
      const hb = getUIHitboxes();
      ctx4.clearRect(0, 0, state.width, state.height);

      // ジョイスティックベース＆ノブ
      ctx4.save();
      ctx4.fillStyle = 'rgba(15, 23, 42, 0.45)';
      ctx4.strokeStyle = 'rgba(255, 255, 255, 0.55)';
      ctx4.lineWidth = 2;
      ctx4.beginPath();
      ctx4.arc(hb.stickBase.x, hb.stickBase.y, hb.stickBase.radius, 0, Math.PI * 2);
      ctx4.fill();
      ctx4.stroke();

      const knobX = hb.stickBase.x + state.stickVecX * hb.stickBase.radius;
      const knobY = hb.stickBase.y + state.stickVecY * hb.stickBase.radius;
      ctx4.fillStyle = state.stickActive ? 'rgba(56, 189, 248, 0.85)' : 'rgba(241, 245, 249, 0.75)';
      ctx4.beginPath();
      ctx4.arc(knobX, knobY, 20, 0, Math.PI * 2);
      ctx4.fill();
      ctx4.restore();

      // ジャンプボタン
      ctx4.save();
      ctx4.fillStyle = state.isJumping ? 'rgba(74, 222, 128, 0.75)' : 'rgba(15, 23, 42, 0.55)';
      ctx4.strokeStyle = '#ffffff';
      ctx4.lineWidth = 2;
      ctx4.beginPath();
      ctx4.arc(hb.jumpBtn.x, hb.jumpBtn.y, hb.jumpBtn.r, 0, Math.PI * 2);
      ctx4.fill();
      ctx4.stroke();
      ctx4.fillStyle = '#ffffff';
      ctx4.font = 'bold 11px sans-serif';
      ctx4.textAlign = 'center';
      ctx4.fillText('JUMP', hb.jumpBtn.x, hb.jumpBtn.y + 4);
      ctx4.restore();

      // しゃがみボタン
      ctx4.save();
      ctx4.fillStyle = state.isSneaking ? 'rgba(251, 191, 36, 0.78)' : 'rgba(15, 23, 42, 0.55)';
      ctx4.strokeStyle = '#ffffff';
      ctx4.lineWidth = 2;
      ctx4.beginPath();
      ctx4.arc(hb.sneakBtn.x, hb.sneakBtn.y, hb.sneakBtn.r, 0, Math.PI * 2);
      ctx4.fill();
      ctx4.stroke();
      ctx4.fillStyle = '#ffffff';
      ctx4.font = 'bold 10px sans-serif';
      ctx4.textAlign = 'center';
      ctx4.fillText('SNEAK', hb.sneakBtn.x, hb.sneakBtn.y + 3);
      ctx4.restore();

      // INV開閉ボタン
      ctx4.save();
      ctx4.fillStyle = state.inventoryOpen ? 'rgba(56, 189, 248, 0.85)' : 'rgba(15, 23, 42, 0.65)';
      ctx4.strokeStyle = '#cbd5e1';
      ctx4.lineWidth = 1.5;
      ctx4.fillRect(hb.invBtn.x, hb.invBtn.y, hb.invBtn.w, hb.invBtn.h);
      ctx4.strokeRect(hb.invBtn.x, hb.invBtn.y, hb.invBtn.w, hb.invBtn.h);
      ctx4.fillStyle = '#ffffff';
      ctx4.font = 'bold 12px monospace';
      ctx4.textAlign = 'center';
      ctx4.fillText('INV', hb.invBtn.x + hb.invBtn.w / 2, hb.invBtn.y + 18);
      ctx4.restore();

      // ブロック選択ホットバー
      for (const slot of hb.hotbarSlots) {
        const isSelected = slot.index === state.selectedSlot;
        ctx4.save();
        ctx4.fillStyle = 'rgba(15, 23, 42, 0.65)';
        ctx4.fillRect(slot.x, slot.y, slot.w, slot.h);

        ctx4.fillStyle = slot.item.hex;
        ctx4.fillRect(slot.x + 8, slot.y + 8, slot.w - 16, slot.h - 16);

        ctx4.strokeStyle = isSelected ? '#fde047' : 'rgba(203, 213, 225, 0.55)';
        ctx4.lineWidth = isSelected ? 3 : 1.5;
        ctx4.strokeRect(slot.x, slot.y, slot.w, slot.h);
        ctx4.restore();
      }
    }

    // --- メインループ ---
    const t0 = performance.now();
    let prevNow = t0;

    function loop(now) {
      requestAnimationFrame(loop);
      const dt = Math.min(0.1, (now - prevNow) / 1000);
      const elapsed = (now - t0) / 1000;
      prevNow = now;

      // ジョイスティック入力でプレイヤー座標を更新
      if (state.stickActive && (state.stickVecX !== 0 || state.stickVecY !== 0)) {
        const speed = state.isSneaking ? 2.0 : 4.2;
        const forward = -state.stickVecY;
        const right = state.stickVecX;

        const moveX = (Math.sin(state.yaw) * forward + Math.cos(state.yaw) * right) * speed * dt;
        const moveZ = (-Math.cos(state.yaw) * forward + Math.sin(state.yaw) * right) * speed * dt;

        state.playerX = +(state.playerX + moveX).toFixed(2);
        state.playerZ = +(state.playerZ + moveZ).toFixed(2);
        syncCamera();
      }

      // 音の字幕TTL更新
      for (let i = state.subtitles.length - 1; i >= 0; i--) {
        state.subtitles[i].ttl -= dt;
        if (state.subtitles[i].ttl <= 0) {
          state.subtitles.splice(i, 1);
        }
      }

      drawLayer1Sky(elapsed);
      renderer.render(scene, camera);
      drawLayer3Hud();
      drawLayer4Controls();
    }

    requestAnimationFrame(loop);
    logChange('SYSTEM', '1枚目(空2D)〜4枚目(操作UI2D) 起動完了！🎉');
  </script>
</body>
</html>
