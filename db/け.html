<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Programming隊 - Texture Analyzer</title>
    <style>
        body { font-family: sans-serif; background: #222; color: #fff; text-align: center; }
        .container { padding: 20px; }
        #drop-zone { border: 2px dashed #555; padding: 40px; margin: 20px auto; width: 300px; cursor: pointer; }
        pre { background: #000; padding: 15px; text-align: left; overflow-x: auto; max-height: 400px; }
        canvas { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📦 Texture to JSON Converter</h1>
        <p>16x16の画像をアップロードしてくれ、隊員！</p>
        <input type="file" id="file-input" multiple accept="image/png">
        <div id="drop-zone">ここにファイルをドロップするか選択</div>
        
        <h2>📜 生成されたJSON</h2>
        <button id="copy-btn">JSONをコピー</button>
        <pre id="result-json">{}</pre>
    </div>

    <canvas id="proc-canvas" width="16" height="16"></canvas>

    <script>
        const fileInput = document.getElementById('file-input');
        const dropZone = document.getElementById('drop-zone');
        const resultJson = document.getElementById('result-json');
        const canvas = document.getElementById('proc-canvas');
        const ctx = canvas.getContext('2d');

        let finalData = { "color": {} };

        // ファイル選択時のイベント
        fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

        async function handleFiles(files) {
            finalData.color = {}; // 初期化
            
            for (let file of files) {
                const fileName = file.name.split('.')[0]; // dirt.png -> dirt
                const imgData = await processImage(file);
                finalData.color[fileName] = imgData;
            }

            resultJson.textContent = JSON.stringify(finalData, null, 2);
            console.log("JSON generated for: ", Object.keys(finalData.color));
        }

        function processImage(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        // Canvasに16x16で描画
                        ctx.clearRect(0, 0, 16, 16);
                        ctx.drawImage(img, 0, 0, 16, 16);
                        
                        const pixData = ctx.getImageData(0, 0, 16, 16).data;
                        let pixelArray = [];
                        
                        // 1ピクセルずつ[R, G, B]を取得
                        for (let i = 0; i < pixData.length; i += 4) {
                            pixelArray.push([pixData[i], pixData[i+1], pixData[i+2]]);
                        }
                        resolve(pixelArray);
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        // コピー機能
        document.getElementById('copy-btn').addEventListener('click', () => {
            navigator.clipboard.writeText(resultJson.textContent);
            alert("JSONをコピーしたぞ、隊員！🫡");
        });
    </script>
</body>
</html>
