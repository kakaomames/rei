<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Python Code Cleaner - File handling unit for WE Project">
    <meta name="author" content="カカオマメ">
    <meta name="keywords" content="Python, Comment Remover, File System, JavaScript, GitHub Pages">
    <meta property="og:title" content="Python File Commander">
    <meta property="og:image" content="https://kakaomames.github.io/rei/logo.png">
    <meta property="og:type" content="article">
    <title>Python File Commander - Gemini programming隊</title>
    <style>
        :root { --main-bg: #1e1e2e; --accent: #fab387; --text: #cdd6f4; }
        body { background-color: var(--main-bg); color: var(--text); font-family: 'Consolas', monospace; margin: 0; padding: 20px; }
        .base-camp { max-width: 900px; margin: 0 auto; background: #313244; padding: 25px; border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,0.5); }
        h1 { color: var(--accent); border-left: 5px solid var(--accent); padding-left: 15px; font-size: 20pt; }
        
        .file-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .control-panel { background: #45475a; padding: 15px; border-radius: 8px; }
        
        textarea { width: 100%; height: 250px; background: #181825; color: #a6e3a1; border: 1px solid #585b70; border-radius: 5px; padding: 10px; box-sizing: border-box; resize: vertical; margin-top: 10px; }
        
        button { cursor: pointer; border: none; border-radius: 5px; padding: 10px 15px; font-weight: bold; transition: 0.2s; margin: 5px 2px; }
        .btn-action { background: var(--accent); color: #11111b; width: 100%; height: 50px; font-size: 1.2em; }
        .btn-action:hover { background: #f5c2e7; }
        .btn-sub { background: #585b70; color: white; }
        
        input[type="text"] { background: #181825; color: white; border: 1px solid #585b70; padding: 5px; border-radius: 3px; width: 200px; }
        
        #missionLog { background: #11111b; color: #89b4fa; height: 120px; overflow-y: auto; padding: 10px; font-size: 11px; border-radius: 5px; border: 1px solid #45475a; margin-top: 20px; }
        .log-entry { border-bottom: 1px solid #313244; padding: 2px 0; }
    </style>
</head>
<body>

<div class="base-camp">
    <img src="https://kakaomames.github.io/rei/logo.png" alt="Logo" style="width: 60px; float: right;">
    <h1>Python File Commander 🐍</h1>

    <div class="file-controls">
        <div class="control-panel">
            <label>📂 ファイルを読み込む (.py / .py.txt)</label><br>
            <input type="file" id="fileInput" accept=".py,.txt" style="margin-top:10px;">
        </div>
        <div class="control-panel">
            <label>💾 保存時のファイル名</label><br>
            <input type="text" id="fileNameInput" value="cleaned_script.py">
        </div>
    </div>

    <textarea id="mainEditor" placeholder="ファイルを選択するか、ここにコードをペーストしてください..."></textarea>

    <button class="btn-action" onclick="executeMission()">コメント抹消 ＆ 処理開始 🚀</button>

    <div style="display: flex; justify-content: space-between; margin-top: 10px;">
        <button class="btn-sub" onclick="copyToClipboard()">📋 クリップボードにコピー</button>
        <button class="btn-sub" onclick="downloadFile()">📥 ファイルをダウンロード</button>
    </div>

    <div id="missionLog">
        <div class="log-entry">[SYSTEM] 待機中... 隊員の指示を待っています。</div>
    </div>
</div>

<script>
    const editor = document.getElementById('mainEditor');
    const fileInput = document.getElementById('fileInput');
    const logBox = document.getElementById('missionLog');
    const fileNameInput = document.getElementById('fileNameInput');

    // ログ出力
    function missionLog(type, msg) {
        const entry = document.createElement('div');
        entry.className = 'log-entry';
        const now = new Date().toLocaleTimeString();
        entry.textContent = `[${now}] [${type}] ${msg}`;
        logBox.appendChild(entry);
        logBox.scrollTop = logBox.scrollHeight;
        console.log(`[${type}] ${msg}`);
    }

    // ファイル読み込み処理
    fileInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        missionLog("FILE", `ファイル検知: ${file.name}`);
        
        // ファイル名の自動セット
        fileNameInput.value = "cleaned_" + file.name.replace(".txt", "");

        const reader = new FileReader();
        reader.onload = function(e) {
            editor.value = e.target.result;
            missionLog("SUCCESS", "ファイルの読み込みが完了しました。");
        };
        reader.readAsText(file);
    });

    // メインミッション：コメント抹消
    function executeMission() {
        let code = editor.value;
        if (!code) {
            missionLog("ERROR", "データがありません！");
            return;
        }

        missionLog("ACTION", "コメント置換プロトコル発動。");

        // 1. マルチライン文字列(コメント代わり)を無に
        code = code.replace(/('''[\s\S]*?'''|"""[\s\S]*?""")/g, "");
        
        // 2. カカオマメ隊員の「#から\nまで無に」
        // [^\n]* は改行以外の全ての文字にマッチ
        code = code.replace(/#[^\n]*/g, "");

        // 3. 余分な空行を整理
        code = code.split('\n').filter(line => line.trim() !== "").join('\n');

        editor.value = code;
        missionLog("SUCCESS", "すべてのコメントを「無」に変換し、空行を詰めました。");
    }

    // コピー機能
    function copyToClipboard() {
        editor.select();
        document.execCommand('copy');
        missionLog("INFO", "クリップボードに結果をコピーしました。");
        alert("コピー完了！");
    }

    // ダウンロード機能
    function downloadFile() {
        const content = editor.value;
        const filename = fileNameInput.value;
        if (!content) {
            missionLog("ERROR", "保存するデータがありません。");
            return;
        }

        const blob = new Blob([content], { type: 'text/plain' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        a.click();
        window.URL.revokeObjectURL(url);
        
        missionLog("SAVE", `ファイル名「${filename}」で出撃準備完了（DL開始）。`);
    }
</script>

</body>
</html>
