<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Gemini Programming隊によるマイクラ転生プロジェクト">
    <meta property="og:image" content="https://kakaomames.github.io/rei/logo.png">
    <title>Gemini Programming隊 - 探検基地</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        /* Canvasを画面いっぱいに広げる設定 */
        #game-canvas {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        #ui-overlay {
            position: absolute; top: 10px; left: 10px;
            color: white; font-family: sans-serif;
            text-shadow: 2px 2px 2px black;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div id="ui-overlay">
        <h1>Gemini Programming隊 探検中 🚀</h1>
        <div id="status">Status: 起動中...</div>
    </div>

    <canvas id="game-canvas"></canvas>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
    <script src="js/GeometryCore.js"></script>
    <script src="js/RenderBridge.js"></script>
    <script src="js/AddonManager.js"></script>
    <script src="js/PlayerPhysics.js"></script>
    <script src="js/BlockRegistry.js"></script>
    <script src="js/main.js"></script>

</body>
</html>
