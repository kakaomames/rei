<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="https://kakaomames.github.io/rei/logo.png">
    <title>Gemini Craft - アクション実装！🏃💨</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; font-family: sans-serif; }
        canvas { display: block; }
        #crosshair {
            position: absolute; top: 50%; left: 50%;
            width: 20px; height: 20px; margin: -10px 0 0 -10px;
            color: white; font-size: 24px; text-align: center; line-height: 20px;
            pointer-events: none; z-index: 10;
        }
        #ui-info {
            position: absolute; top: 10px; left: 10px;
            color: white; background: rgba(0,0,0,0.6);
            padding: 10px; border-radius: 8px; pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="ui-info">
        <b>Gemini programming隊：アクション班</b><br>
        Space: ジャンプ / Shift: スニーク<br>
        WASD: 移動 / マウス: 視点
    </div>
    <div id="crosshair">+</div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>
    <script type="module">
        import * as THREE from 'three';

        // --- 1. 基本設定 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const sun = new THREE.DirectionalLight(0xffffff, 1.0);
        sun.position.set(10, 50, 10);
        scene.add(sun);

        // 地面（1陣の成果）
        const geometry = new THREE.BoxGeometry(1, 1, 1);
        const grassMat = new THREE.MeshStandardMaterial({ color: 0x55aa55 });
        const world = new THREE.Group();
        scene.add(world);
        for(let x=0; x<20; x++) {
            for(let z=0; z<20; z++) {
                const block = new THREE.Mesh(geometry, grassMat);
                block.position.set(x - 10, -1, z - 10);
                world.add(block);
            }
        }

        // --- 2. プレイヤーの状態管理 ---
        let player = {
            height: 1.6,
            sneakHeight: 1.2,
            speed: 0.1,
            sneakSpeed: 0.04,
            jumpStrength: 0.15,
            velocity: new THREE.Vector3(0, 0, 0),
            isGrounded: false,
            yaw: 0,
            pitch: 0
        };

        const keys = {};
        document.addEventListener('keydown', (e) => { 
            keys[e.code] = true;
            console.log(`Key Down: ${e.code}`);
        });
        document.addEventListener('keyup', (e) => { keys[e.code] = false; });

        // 視点移動
        document.addEventListener('click', () => document.body.requestPointerLock());
        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement === document.body) {
                player.yaw -= e.movementX * 0.002;
                player.pitch -= e.movementY * 0.002;
                player.pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, player.pitch));
                camera.rotation.order = "YXZ";
                camera.rotation.y = player.yaw;
                camera.rotation.x = player.pitch;
            }
        });

        // --- 3. 物理演算 ＆ 移動ループ ---
        function updatePlayer() {
            // 現在の速度（重力）
            const gravity = -0.008;
            player.velocity.y += gravity;
            
            // 接地判定（簡易版：y=0以下にならない）
            const currentHeight = keys['ShiftLeft'] ? player.sneakHeight : player.height;
            const floorY = 0; 
            
            if (camera.position.y <= floorY + currentHeight) {
                if (player.velocity.y < 0) {
                    player.velocity.y = 0;
                    player.isGrounded = true;
                }
                camera.position.y = floorY + currentHeight;
            } else {
                player.isGrounded = false;
            }

            // ジャンプ処理
            if (keys['Space'] && player.isGrounded) {
                player.velocity.y = player.jumpStrength;
                player.isGrounded = false;
                console.log(`Jump! Power: ${player.jumpStrength}`);
            }

            // 移動計算
            const currentSpeed = keys['ShiftLeft'] ? player.sneakSpeed : player.speed;
            const moveDir = new THREE.Vector3();
            if (keys['KeyW']) moveDir.z -= 1;
            if (keys['KeyS']) moveDir.z += 1;
            if (keys['KeyA']) moveDir.x -= 1;
            if (keys['KeyD']) moveDir.x += 1;
            
            moveDir.normalize().applyAxisAngle(new THREE.Vector3(0, 1, 0), player.yaw);
            
            camera.position.x += moveDir.x * currentSpeed;
            camera.position.z += moveDir.z * currentSpeed;
            camera.position.y += player.velocity.y;

            // 定期的なログ出力
            if (Math.abs(player.velocity.y) > 0.01) {
                console.log(`Velocity Y: ${player.velocity.y.toFixed(4)} | Grounded: ${player.isGrounded}`);
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            updatePlayer();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
