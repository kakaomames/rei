<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="https://kakaomames.github.io/rei/logo.png">
    <meta name="description" content="Gemini programming隊 - 統合サバイバルシステム">
    <meta name="author" content="Gemini programming隊">
    <meta property="og:title" content="Gemini Craft Inventory Edition">
    <meta property="og:image" content="https://kakaomames.github.io/rei/logo.png">
    <meta name="robots" content="index,follow">
    <title>Gemini Craft - Inventory System ⚒️</title>
    <link rel="stylesheet" href="./style.css"><!-- ここに全てのcssがあります。追加する場合はこのタグの下に新しいstyleタグを置いて、記入してください。 -->
    <link rel="stylesheet" href="./style.css">
    <style>
        /* モバイル対応のための追加スタイル 📱 */
        body { touch-action: none; overflow: hidden; -webkit-user-select: none; user-select: none; }
        
        /* モバイル用コントローラー */
        #mobile-controls {
            position: fixed; bottom: 20px; left: 20px;
            display: none; grid-template-columns: repeat(3, 50px); gap: 10px;
            z-index: 100;
        }
        .touch-btn {
            width: 50px; height: 50px; background: rgba(255,255,255,0.3);
            border: 2px solid #fff; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; color: white;
        }
        #btn-jump { position: fixed; bottom: 20px; right: 20px; width: 60px; height: 60px; border-radius: 50%; }
        #btn-inv { position: fixed; top: 10px; right: 10px; width: 50px; height: 50px; background: rgba(0,0,0,0.5); }

        @media (max-width: 768px) {
            #mobile-controls { display: grid; }
            #ui-info { font-size: 10px; top: 5px; left: 5px; }
            #hotbar { transform: scale(0.8); bottom: 5px; }
            #survival-ui { transform: scale(0.8); bottom: 70px; left: 5px; }
        }

        /* インベントリスロットをタップしやすく */
        .inv-slot { min-width: 40px; min-height: 40px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="ui-info">
        <b>Gemini programming隊：拠点</b><br>
        [E/Tap] インベントリ / [Move] タッチ操作
    </div>

    <div id="clock-ui">Time: 06:00 ☀️</div>

    <div id="inventory-overlay">
        <div id="inventory-window"></div>
    </div>

    <div id="mobile-controls">
        <div></div><div class="touch-btn" id="btn-w">W</div><div></div>
        <div class="touch-btn" id="btn-a">A</div><div class="touch-btn" id="btn-s">S</div><div class="touch-btn" id="btn-d">D</div>
    </div>
    <div class="touch-btn" id="btn-jump">UP</div>
    <div class="touch-btn" id="btn-inv">🎒</div>

    <div id="storage-ui">
        <b>📦 Storage Manager</b>
        <div id="db-status">DB: 接続中...</div>
        <button class="btn" onclick="document.getElementById('file-input').click()">Import</button>
        <input type="file" id="file-input" style="display:none" accept=".mcpack,.mcaddon,.mcworld">
        <hr>
        <div id="data-list" style="max-height: 50px; overflow-y: auto;">保存データなし</div>
    </div>

    <div id="survival-ui">
        <div class="bar-container">
            <div id="hp-row" class="icon-row">❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️</div>
            <div id="hunger-row" class="icon-row">🍖🍖🍖🍖🍖🍖🍖🍖🍖🍖</div>
        </div>
        <div id="xp-container"><div id="xp-bar"></div></div>
    </div>
    
    <div id="hotbar">
        <div id="hot-0" class="slot active" onclick="selectHotbar(0)">🌿</div>
        <div id="hot-1" class="slot" onclick="selectHotbar(1)">🪨</div>
        <div id="hot-2" class="slot" onclick="selectHotbar(2)">⛏️</div>
        <div id="hot-3" class="slot" onclick="selectHotbar(3)">🍎</div>
        <div id="hot-4" class="slot" onclick="selectHotbar(4)"></div>
        <div id="hot-5" class="slot" onclick="selectHotbar(5)"></div>
        <div id="hot-6" class="slot" onclick="selectHotbar(6)"></div>
        <div id="hot-7" class="slot" onclick="selectHotbar(7)"></div>
        <div id="hot-8" class="slot" onclick="selectHotbar(8)"></div>
    </div>

    <div id="crosshair">+</div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>
    <script type="module">
        import * as THREE from 'three';

        // --- 1. インベントリ管理 JS ---
        const inventoryData = {
            isOpen: false,
            slots: Array(27).fill(null).map((_, i) => (i < 5 ? ["🍎", "🪵", "⛏️", "🌿", "🪨"][i] : null)),
            hotbar: ["🌿", "🪨", "⛏️", "🍎", "", "", "", "", ""],
            activeIndex: 0
        };

        function toggleInventory() {
            inventoryData.isOpen = !inventoryData.isOpen;
            console.log(`inventoryData.isOpen: ${inventoryData.isOpen}`);
            const overlay = document.getElementById('inventory-overlay');
            overlay.style.display = inventoryData.isOpen ? 'flex' : 'none';
            
            if (inventoryData.isOpen) {
                if(document.pointerLockElement) document.exitPointerLock();
                renderInventory();
            } else {
                if(!isMobile()) document.body.requestPointerLock();
            }
        }

        function renderInventory() {
            const win = document.getElementById('inventory-window');
            win.innerHTML = '';
            inventoryData.slots.forEach((item, i) => {
                const div = document.createElement('div');
                div.className = 'inv-slot';
                div.innerText = item || '';
                div.onclick = () => {
                    console.log(`Slot ${i} selected: ${item}`);
                };
                win.appendChild(div);
            });
        }

        // ホットバー選択用
        window.selectHotbar = (i) => {
            inventoryData.activeIndex = i;
            console.log(`activeIndex: ${inventoryData.activeIndex}`);
            updateHotbarUI();
        };

        // モバイル判定
        const isMobile = () => /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

        // --- 2. 既存のロジック拡張 ---
        class GeminiStorage {
            constructor() { this.dbName = "GeminiCraftDB"; this.db = null; }
            async init() {
                return new Promise((resolve) => {
                    const request = indexedDB.open(this.dbName, 1);
                    request.onupgradeneeded = (e) => {
                        const db = e.target.result;
                        if (!db.objectStoreNames.contains('addons')) db.createObjectStore('addons', { keyPath: 'id' });
                        if (!db.objectStoreNames.contains('worlds')) db.createObjectStore('worlds', { keyPath: 'id' });
                    };
                    request.onsuccess = (e) => {
                        this.db = e.target.result;
                        document.getElementById('db-status').innerText = "DB: OK ✅";
                        resolve();
                    };
                });
            }
        }

        const storage = new GeminiStorage();
        await storage.init();

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const geometry = new THREE.BoxGeometry(1, 1, 1);
        const mat = new THREE.MeshStandardMaterial({ color: 0x55aa55 });
        for(let x=0; x<16; x++) {
            for(let z=0; z<16; z++) {
                const b = new THREE.Mesh(geometry, mat);
                b.position.set(x, 0, z);
                scene.add(b);
            }
        }

        let player = { pos: new THREE.Vector3(8, 2, 8), vel: new THREE.Vector3(0, 0, 0), yaw: 0, pitch: 0 };
        const keys = {};
        let stats = { hp: 20, hunger: 20, xp: 0, worldTime: 600 };

        // --- 3. イベントリスナー (モバイル対応) ---
        const setupMobileEvents = (id, key) => {
            const btn = document.getElementById(id);
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[key] = true; });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[key] = false; });
        };

        if(isMobile()) {
            setupMobileEvents('btn-w', 'KeyW');
            setupMobileEvents('btn-a', 'KeyA');
            setupMobileEvents('btn-s', 'KeyS');
            setupMobileEvents('btn-d', 'KeyD');
            setupMobileEvents('btn-jump', 'Space');
            document.getElementById('btn-inv').onclick = toggleInventory;
        }

        document.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            if (e.code === 'KeyE') toggleInventory();
            if (e.key >= 1 && e.key <= 9) selectHotbar(parseInt(e.key) - 1);
        });
        document.addEventListener('keyup', (e) => keys[e.code] = false);

        // タッチでの視点移動
        let touchX = 0, touchY = 0;
        document.addEventListener('touchstart', (e) => {
            if(inventoryData.isOpen) return;
            touchX = e.touches[0].pageX;
            touchY = e.touches[0].pageY;
        });
        document.addEventListener('touchmove', (e) => {
            if(inventoryData.isOpen || e.target.closest('.touch-btn')) return;
            const dx = e.touches[0].pageX - touchX;
            const dy = e.touches[0].pageY - touchY;
            player.yaw -= dx * 0.005;
            player.pitch -= dy * 0.005;
            player.pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, player.pitch));
            touchX = e.touches[0].pageX;
            touchY = e.touches[0].pageY;
        });

        document.addEventListener('click', () => {
            if (!inventoryData.isOpen && !isMobile()) document.body.requestPointerLock();
        });

        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement === document.body) {
                player.yaw -= e.movementX * 0.002;
                player.pitch -= e.movementY * 0.002;
                player.pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, player.pitch));
            }
        });

        function updateHotbarUI() {
            for (let i = 0; i < 9; i++) {
                const slot = document.getElementById(`hot-${i}`);
                slot.className = i === inventoryData.activeIndex ? 'slot active' : 'slot';
            }
        }

        function updateUI() {
            const h = Math.max(0, Math.ceil(stats.hp / 2));
            document.getElementById('hp-row').innerText = "❤️".repeat(h) + "🖤".repeat(10 - h);
            const hu = Math.max(0, Math.ceil(stats.hunger / 2));
            document.getElementById('hunger-row').innerText = "🍖".repeat(hu) + "🦴".repeat(10 - hu);
            document.getElementById('xp-bar').style.width = `${stats.xp % 100}%`;
            
            stats.worldTime = (stats.worldTime + 0.1) % 2400;
            const hrs = Math.floor(stats.worldTime / 100).toString().padStart(2, '0');
            document.getElementById('clock-ui').innerText = `Time: ${hrs}:00 ☀️`;
        }

        function animate() {
            requestAnimationFrame(animate);
            if (!inventoryData.isOpen) {
                const speed = keys['ShiftLeft'] ? 0.15 : 0.08;
                if (keys['KeyW']) { player.pos.x -= Math.sin(player.yaw) * speed; player.pos.z -= Math.cos(player.yaw) * speed; }
                if (keys['KeyS']) { player.pos.x += Math.sin(player.yaw) * speed; player.pos.z += Math.cos(player.yaw) * speed; }
                if (keys['KeyA']) { player.pos.x -= Math.cos(player.yaw) * speed; player.pos.z += Math.sin(player.yaw) * speed; }
                if (keys['KeyD']) { player.pos.x += Math.cos(player.yaw) * speed; player.pos.z -= Math.sin(player.yaw) * speed; }

                if (keys['Space'] && player.pos.y <= 2.1) player.vel.y = 0.15;
                player.vel.y -= 0.008; player.pos.y += player.vel.y;
                if (player.pos.y < 2) { player.pos.y = 2; player.vel.y = 0; }
            }
            camera.rotation.set(player.pitch, player.yaw, 0, 'YXZ');
            camera.position.copy(player.pos);
            updateUI();
            renderer.render(scene, camera);
        }

        animate();
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
