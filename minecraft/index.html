<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="https://kakaomames.github.io/rei/logo.png">
    <meta name="description" content="Gemini programming隊 - 統合サバイバルシステム">
    <meta name="author" content="Gemini programming隊">
    <meta property="og:title" content="Gemini Craft Advanced Edition">
    <meta property="og:image" content="https://kakaomames.github.io/rei/logo.png">
    <title>Gemini Craft - Survival & Command ⚒️</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Courier New', Courier, monospace; }
        canvas { display: block; }
        #ui-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; color: white; text-shadow: 2px 2px 0 #000; }
        .hud { position: absolute; padding: 10px; pointer-events: auto; }
        #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-size: 24px; pointer-events: none; }
        #hotbar { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; background: rgba(0,0,0,0.5); padding: 5px; border: 2px solid #888; }
        .slot { width: 40px; height: 40px; border: 2px solid #555; margin: 0 2px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .slot.active { border-color: #fff; background: rgba(255,255,255,0.2); }
        #chat-box { position: absolute; bottom: 100px; left: 20px; width: 300px; height: 150px; background: rgba(0,0,0,0.3); display: none; flex-direction: column; }
        #chat-input { background: rgba(0,0,0,0.6); border: none; color: white; padding: 5px; width: 100%; outline: none; }
        #chat-log { flex-grow: 1; overflow-y: auto; font-size: 12px; padding: 5px; }
        #inventory-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; pointer-events: auto; }
        #inventory-window { background: #c6c6c6; border: 4px solid #333; padding: 20px; display: grid; grid-template-columns: repeat(9, 40px); gap: 5px; }
        .inv-slot { width: 40px; height: 40px; background: #8b8b8b; border: 2px solid #373737; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <div id="ui-layer">
        <div id="crosshair">+</div>
        <div class="hud" style="top:0; left:0;">Gemini programming隊: 探検中 🧭</div>
        
        <div id="chat-box">
            <div id="chat-log"></div>
            <input type="text" id="chat-input" placeholder="Type command...">
        </div>

        <div id="hotbar">
            <div id="hot-0" class="slot active">🌿</div>
            <div id="hot-1" class="slot">🪨</div>
            <div id="hot-2" class="slot">⛏️</div>
            <div id="hot-3" class="slot">🪵</div>
            <div id="hot-4" class="slot">🧱</div>
            <div id="hot-5" class="slot"></div>
            <div id="hot-6" class="slot"></div>
            <div id="hot-7" class="slot"></div>
            <div id="hot-8" class="slot">⚙️</div>
        </div>
    </div>

    <div id="inventory-overlay">
        <div id="inventory-window">
            </div>
        <div style="margin-left: 20px; color: white;">
            <h3>Crafting</h3>
            <button onclick="craftItem('⛏️')">Craft Pickaxe (2x🪵)</button>
        </div>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>
    <script type="module">
        import * as THREE from 'three';

        // --- 設定・定数 ---
        const BLOCK_SIZE = 1;
        const WORLD_SIZE = 16;
        const DEPTH = 5;
        const TYPES = { AIR: 0, GRASS: 1, DIRT: 2, STONE: 3, BEDROCK: 4, WOOD: 5 };
        const EMOJI = { 1: "🌿", 2: "🟫", 3: "🪨", 4: "🖤", 5: "🪵" };

        let isCreative = false;
        let inventory = { "🌿": 10, "🪨": 10, "🪵": 5 };
        let hotbarItems = ["🌿", "🪨", "⛏️", "🪵", "🧱", "", "", "", ""];
        let activeHotbarIndex = 0;

        // --- 初期化 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const light = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
        scene.add(light);

        // --- 地層生成 ---
        const blocks = [];
        const geo = new THREE.BoxGeometry(BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);
        
        const materials = {
            [TYPES.GRASS]: new THREE.MeshStandardMaterial({ color: 0x55aa55 }),
            [TYPES.DIRT]: new THREE.MeshStandardMaterial({ color: 0x8b4513 }),
            [TYPES.STONE]: new THREE.MeshStandardMaterial({ color: 0x808080 }),
            [TYPES.BEDROCK]: new THREE.MeshStandardMaterial({ color: 0x222222 }),
            [TYPES.WOOD]: new THREE.MeshStandardMaterial({ color: 0x654321 })
        };

        function createWorld() {
            for (let x = 0; x < WORLD_SIZE; x++) {
                for (let z = 0; z < WORLD_SIZE; z++) {
                    for (let y = 0; y >= -DEPTH; y--) {
                        let type = TYPES.STONE;
                        if (y === 0) type = TYPES.GRASS;
                        else if (y > -3) type = TYPES.DIRT;
                        if (y === -DEPTH) type = TYPES.BEDROCK;

                        addBlock(x, y, z, type);
                    }
                }
            }
        }

        function addBlock(x, y, z, type) {
            const mesh = new THREE.Mesh(geo, materials[type]);
            mesh.position.set(x, y, z);
            mesh.userData.type = type;
            scene.add(mesh);
            blocks.push(mesh);
            console.log(`Block added at (${x},${y},${z}) type:${type}`);
        }

        createWorld();

        // --- プレイヤー & 操作 ---
        let player = { pos: new THREE.Vector3(8, 2, 8), vel: new THREE.Vector3(0, 0, 0), yaw: 0, pitch: 0 };
        const keys = {};

        document.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            if (e.code === 'KeyE') toggleInventory();
            if (e.code === 'KeyG') spawnSteve();
            if (e.code === 'Enter' || e.code === 'KeyT') openChat();
            if (e.key >= 1 && e.key <= 9) selectHotbar(parseInt(e.key) - 1);
        });
        document.addEventListener('keyup', (e) => keys[e.code] = false);

        // --- インタラクション (破壊・設置) ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2(0, 0);

        window.addEventListener('mousedown', (e) => {
            if (document.pointerLockElement !== document.body) return;
            
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(blocks);

            if (intersects.length > 0) {
                const intersect = intersects[0];
                if (e.button === 0) { // 左クリック: 破壊
                    if (intersect.object.userData.type !== TYPES.BEDROCK || isCreative) {
                        console.log("Block destroyed");
                        scene.remove(intersect.object);
                        blocks.splice(blocks.indexOf(intersect.object), 1);
                    }
                } else if (e.button === 2) { // 右クリック: 設置
                    const pos = intersect.object.position.clone().add(intersect.face.normal);
                    addBlock(pos.x, pos.y, pos.z, TYPES.WOOD); // 現在は木材を設置
                }
            }
        });

        // --- スティーブ召喚 ---
        function spawnSteve() {
            const steveGeo = new THREE.BoxGeometry(0.6, 1.8, 0.6);
            const steveMat = new THREE.MeshStandardMaterial({ color: 0x0000ff });
            const steve = new THREE.Mesh(steveGeo, steveMat);
            
            // プレイヤーの向いている方向に召喚
            const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
            steve.position.copy(player.pos).add(dir.multiplyScalar(2));
            steve.position.y = 1;
            scene.add(steve);
            logChat("スティーブを召喚しました！");
            console.log(`Steve spawned at: ${steve.position.x}, ${steve.position.y}, ${steve.position.z}`);
        }

        // --- チャット・コマンド ---
        function openChat() {
            const box = document.getElementById('chat-box');
            const input = document.getElementById('chat-input');
            box.style.display = 'flex';
            input.focus();
            document.exitPointerLock();
        }

        document.getElementById('chat-input').addEventListener('keydown', (e) => {
            if (e.code === 'Enter') {
                const val = e.target.value;
                if (val.startsWith('/')) {
                    handleCommand(val);
                } else {
                    logChat(`[Player] ${val}`);
                }
                e.target.value = '';
                document.getElementById('chat-box').style.display = 'none';
                document.body.requestPointerLock();
            }
        });

        function handleCommand(cmd) {
            console.log(`Command received: ${cmd}`);
            if (cmd === '/gamemode c') {
                isCreative = true;
                logChat("ゲームモードをクリエイティブに変更しました。");
            } else if (cmd === '/gamemode s') {
                isCreative = false;
                logChat("ゲームモードをサバイバルに変更しました。");
            } else {
                logChat("不明なコマンドです。");
            }
        }

        function logChat(msg) {
            const log = document.getElementById('chat-log');
            log.innerHTML += `<div>${msg}</div>`;
            log.scrollTop = log.scrollHeight;
        }

        // --- インベントリ・クラフト ---
        function toggleInventory() {
            const inv = document.getElementById('inventory-overlay');
            const isVisible = inv.style.display === 'flex';
            inv.style.display = isVisible ? 'none' : 'flex';
            if (!isVisible) {
                document.exitPointerLock();
                renderInventory();
            } else {
                document.body.requestPointerLock();
            }
        }

        function renderInventory() {
            const win = document.getElementById('inventory-window');
            win.innerHTML = '';
            for (let i = 0; i < 27; i++) {
                const div = document.createElement('div');
                div.className = 'inv-slot';
                div.innerText = i < 5 ? ["🌿", "🪨", "🪵", "🧱", "⛏️"][i] : "";
                win.appendChild(div);
            }
        }

        window.craftItem = (item) => {
            console.log(`Crafting request: ${item}`);
            logChat(`${item} をクラフトしました！`);
        };

        function selectHotbar(i) {
            activeHotbarIndex = i;
            document.querySelectorAll('.slot').forEach((s, idx) => {
                s.classList.toggle('active', idx === i);
            });
            console.log(`Selected hotbar slot: ${i}`);
        }

        // --- ループ ---
        function animate() {
            requestAnimationFrame(animate);
            
            if (document.pointerLockElement === document.body) {
                const speed = 0.1;
                if (keys['KeyW']) { player.pos.x -= Math.sin(player.yaw) * speed; player.pos.z -= Math.cos(player.yaw) * speed; }
                if (keys['KeyS']) { player.pos.x += Math.sin(player.yaw) * speed; player.pos.z += Math.cos(player.yaw) * speed; }
                if (keys['KeyA']) { player.pos.x -= Math.cos(player.yaw) * speed; player.pos.z += Math.sin(player.yaw) * speed; }
                if (keys['KeyD']) { player.pos.x += Math.cos(player.yaw) * speed; player.pos.z -= Math.sin(player.yaw) * speed; }
                
                if (keys['Space'] && player.pos.y <= 1.1) player.vel.y = 0.15;
                if (!isCreative) {
                    player.vel.y -= 0.008;
                    player.pos.y += player.vel.y;
                    if (player.pos.y < 1.5) { player.pos.y = 1.5; player.vel.y = 0; }
                }
            }

            camera.rotation.set(player.pitch, player.yaw, 0, 'YXZ');
            camera.position.copy(player.pos);
            renderer.render(scene, camera);
        }

        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement === document.body) {
                player.yaw -= e.movementX * 0.002;
                player.pitch -= e.movementY * 0.002;
                player.pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, player.pitch));
            }
        });

        document.addEventListener('click', () => {
            if (document.getElementById('inventory-overlay').style.display !== 'flex') {
                document.body.requestPointerLock();
            }
        });

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

    </script>
</body>
</html>
