<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="description" content="ポケモンクエスト風の探検選択画面を再現">
    <meta name="keywords" content="ポケモンクエスト, マップ, ステージ選択, HTML, CSS, JavaScript">
    <meta name="author" content="Gemini programming隊">
    <meta property="og:title" content="ポケモンクエスト風 探検選択画面">
    <meta property="og:description" content="探検先を選ぶマップ画面">
    <meta property="og:image" content="logo.png">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" href="icon.png" type="image/png">

    <title>探検選択画面 | Gemini programming隊</title>
    <style>
        :root {
            --ui-blue: #6699ff;
            --ui-dark: #333;
        }

        body {
            background-color: #2c3e50; /* 暗めの背景色 */
            font-family: 'Verdana', 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .expedition-screen {
            width: 90%;
            max-width: 850px;
            height: 550px;
            border: 8px solid var(--ui-dark);
            box-shadow: 12px 12px 0 0 #555;
            background-color: #fff;
            display: flex; /* Flexで左右に分割 */
        }

        /* --- 左側のマップエリア --- */
        .map-area {
            flex: 1; /* 均等に分割 */
            background-color: var(--ui-blue); /* マップの海の色 */
            border-right: 4px solid var(--ui-dark);
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-size: 20px;
            font-weight: bold;
        }
        
        /* 島の表現 */
        .island {
            width: 200px;
            height: 150px;
            background-color: #6a956a; /* 島の緑 */
            border: 4px solid var(--ui-dark);
            transform: rotate(5deg);
        }

        /* --- 右側のステージリスト --- */
        .stage-list-area {
            flex: 1;
            padding: 10px;
            background-color: #f0f0f0;
            overflow-y: auto; /* リストをスクロール可能にする */
        }

        .stage-entry {
            background-color: #fff;
            border: 2px solid var(--ui-dark);
            padding: 10px;
            margin-bottom: 8px;
            box-shadow: 2px 2px 0 0 #999;
            cursor: pointer;
            font-size: 14px;
        }

        .stage-entry:hover {
            background-color: #ffe0b2;
        }

        /* 戻るボタン (左上) */
        .back-button {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: #ff6666;
            border: 3px solid var(--ui-dark);
            padding: 8px 12px;
            font-weight: bold;
            color: #fff;
            cursor: pointer;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div class="expedition-screen">
        
        <div class="back-button" onclick="goToBasecamp()">← ベースキャンプへ</div>
        
        <div class="map-area">
            <div class="island">
                カクコロ島
            </div>
        </div>

        <div class="stage-list-area">
            <h3>ステージ一覧</h3>
            <div class="stage-entry" onclick="onStageSelect('1-1')">1-1: はじまりの森</div>
            <div class="stage-entry" onclick="onStageSelect('1-2')">1-2: なみのり海岸</div>
            <div class="stage-entry" onclick="onStageSelect('1-3')">1-3: ゴツゴツ山</div>
            </div>

    </div>

    <script>
        const currentScreen = 'expedition.html';
        console.log(`currentScreen:${currentScreen}`);

        function goToBasecamp() {
            const nextScreen = 'basecamp.html';
            console.log(`nextScreen:${nextScreen}`);
            console.log("ベースキャンプへ戻ります！");
            window.location.href = nextScreen;
        }

        // ★ 新しいロジック: ステージを選択したらチーム編集画面へ
        function onStageSelect(stageId) {
            const nextScreen = 'team_edit.html';
            // 選択したステージIDを保持します (今回はURLのクエリパラメータとして渡します)
            console.log(`stageId:${stageId}`);
            console.log(`nextScreen:${nextScreen}`);
            
            console.log(`ステージ ${stageId} を選択。チーム編成画面へ推移します。`);
            // チーム編成画面へ、ステージIDをパラメータとして渡して遷移
            window.location.href = `${nextScreen}?stage=${stageId}`;
        }
        
        console.log(`goToBasecamp関数の準備完了。次の推移先: basecamp.html`);
        console.log(`onStageSelect関数の準備完了。次の推移先: team_edit.html`);
    </script>
</body>
</html>
</body>
</html>
