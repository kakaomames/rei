<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Gemini programming隊">
    <meta name="description" content="Gemini programming隊のベースキャンプ。ポケモンの管理や探検の準備を行います。">
    <meta name="keywords" content="ポケモン, ゲーム, HTML, JavaScript, ベースキャンプ, Gemini">
    <meta property="og:title" content="ベースキャンプ | Gemini programming隊">
    <meta property="og:description" content="隊員の作戦基地。ポケモンの管理や探検の準備を行います。">
    <meta property="og:image" content="https://kakaomames.github.io/rei/logo.png">
    <title>ベースキャンプ | Gemini programming隊</title>
    <style>
        :root {
            --ui-yellow: #ffc90e;
            --ui-dark: #333;
            --ui-orange: #ff9900;
            --ui-basecamp-bg: #e6f0f7; /* 明るい青系 */
        }

        body {
            background-color: var(--ui-basecamp-bg);
            font-family: 'Verdana', 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .game-screen {
            width: 100%;
            max-width: 900px;
            height: 600px;
            border: 8px solid var(--ui-dark);
            box-shadow: 12px 12px 0 0 #555;
            box-sizing: border-box;
            position: relative;
            background-color: #fff;
            display: flex;
            flex-direction: column;
        }

        /* 共通ボタン */
        .ui-button {
            background-color: var(--ui-yellow);
            border: 3px solid var(--ui-dark);
            color: var(--ui-dark);
            padding: 10px 15px;
            text-align: center;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            border-radius: 5px;
            box-shadow: 0 4px 0 0 #b38b00;
            transition: all 0.1s;
        }
        .ui-button:active {
            box-shadow: 0 1px 0 0 #b38b00;
            transform: translateY(3px);
        }
        .expedition-button {
            background-color: var(--ui-orange);
            box-shadow: 0 4px 0 0 #cc7a00;
            color: white;
            font-size: 16px;
        }
        .expedition-button:active {
            box-shadow: 0 1px 0 0 #cc7a00;
        }

        /* 上部UI */
        .top-ui-fixed {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background-color: var(--ui-dark);
            color: white;
            border-bottom: 5px solid var(--ui-yellow);
        }
        .currency-status, .stamina-status {
            font-size: 16px;
            font-weight: bold;
            color: var(--ui-yellow);
        }

        /* メインコンテンツ */
        .main-content {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
        }
        .content-title {
            font-size: 24px;
            font-weight: bold;
            color: var(--ui-dark);
            margin-bottom: 15px;
            border-bottom: 2px solid var(--ui-yellow);
            padding-bottom: 5px;
            text-align: center;
        }

        /* ロースターリスト */
        .roster-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px;
        }

        .pokemon-card {
            background-color: #f0f0f0;
            border: 3px solid var(--ui-dark);
            padding: 10px;
            text-align: center;
            box-shadow: 4px 4px 0 0 #888;
        }
        .pokemon-name {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .pokemon-image {
            width: 80px;
            height: 80px;
            margin: 0 auto 5px;
            background-color: #ccc; /* 仮画像 */
            line-height: 80px;
            font-size: 10px;
        }
        .pokemon-stats {
            font-size: 12px;
            text-align: left;
            padding: 5px 0;
            border-top: 1px dashed #999;
        }
        .pokemon-stats div {
            margin-bottom: 2px;
        }
        .exp-bar-container {
            height: 8px;
            background-color: #ccc;
            border: 1px solid #999;
            margin-top: 5px;
        }
        .exp-bar {
            height: 100%;
            background-color: #3498db;
        }

        /* 下部メニューバー */
        .bottom-menu-bar {
            display: flex;
            justify-content: space-around;
            padding: 10px;
            border-top: 5px solid var(--ui-dark);
            background-color: #c9c9c9;
        }
        .bottom-menu-bar .ui-button {
            flex-grow: 1;
            margin: 0 5px;
        }

        /* 初回選択画面 */
        #starterSelection {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 100;
        }
        .starter-pokemon-list {
            display: flex;
            gap: 30px;
            margin-top: 20px;
        }
        .starter-card {
            background-color: #333;
            border: 5px solid var(--ui-yellow);
            padding: 15px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="game-screen">
        
        <div class="top-ui-fixed">
            <div class="currency-status" id="currencyDisplay">💰 0</div>
            <div class="stamina-status" id="staminaDisplay">⚡️ 5/5 あと 00:00</div>
        </div>

        <div class="main-content">
            <div class="content-title">ベースキャンプ</div>

            <div id="dailyBonusArea" style="margin-bottom: 20px; text-align: center;">
                </div>
            
            <h3 style="color: var(--ui-dark);">仲間のポケモン</h3>
            <div id="rosterList" class="roster-list">
                <p>ロード中...</p>
            </div>
            
        </div>

        <div class="bottom-menu-bar">
            <div class="ui-button expedition-button" onclick="goToExpedition()">探検に出発</div>
            <div class="ui-button" onclick="goToStore()">💰 ストアへ</div>
            <div class="ui-button" onclick="goToCooking()">🍳 料理</div>
            <div class="ui-button" onclick="goToTeamEdit()">チーム編成</div>
        </div>
        
    </div>
    
    <div id="starterSelection" style="display: none;">
        <h2>隊長、歓迎します！</h2>
        <p>最初のパートナーを選んでください。</p>
        <div class="starter-pokemon-list">
            <div class="starter-card" onclick="selectStarter(1)">
                <div class="pokemon-name">フシギダネ</div>
                <div class="pokemon-image">🌱</div>
            </div>
            <div class="starter-card" onclick="selectStarter(4)">
                <div class="pokemon-name">ヒトカゲ</div>
                <div class="pokemon-image">🔥</div>
            </div>
            <div class="starter-card" onclick="selectStarter(7)">
                <div class="pokemon-name">ゼニガメ</div>
                <div class="pokemon-image">💧</div>
            </div>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'pokemon_quest_data';
        const STAMINA_RECOVERY_INTERVAL_MS = 30 * 60 * 1000; // 30分
        const DAILY_CURRENCY_AMOUNT = 50;
        const DAILY_RECOVERY_INTERVAL_MS = 22 * 60 * 60 * 1000; // 22時間
        
        let gameData = null; 
        let allPokemonData = [];
        let masterDataLoaded = false;
        
        // ----------------------------------------------------
        // I. データ管理関数
        // ----------------------------------------------------
        function loadGameData() {
            const storedData = localStorage.getItem(STORAGE_KEY);
            return storedData ? JSON.parse(storedData) : null;
        }
        
        function saveGameData(data) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        }

        async function fetchPokemonMasterData() {
             // ポケモンマスターデータの読み込み（既存ロジック）
            try {
                const response = await fetch('/rei/assets/pokemon.json'); 
                if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);
                allPokemonData = await response.json();
                masterDataLoaded = true;
                console.log("fetchPokemonMasterData:ポケモンマスターデータ読み込み成功。");
            } catch (error) {
                console.error("fetchPokemonMasterData:ポケモンマスターデータの読み込みに失敗しました:", error);
            }
        }
        
        // ----------------------------------------------------
        // II. ポケモンレベルアップロジック
        // ----------------------------------------------------
        
        function getExpToNextLevel(level) {
            const exp = 50 + (level * 50); 
            return exp;
        }

        function applyLevelUpAndStats(instance, masterData) {
            let levelGained = 0;
            let currentExp = instance.exp_current || 0;
            let currentLevel = instance.level;
            
            const baseMaster = allPokemonData.find(p => p.id === instance.pokemon_id);
            if (!baseMaster) return instance;

            const baseHp = baseMaster.base_hp;
            const baseAtk = baseMaster.base_atk;

            while (currentLevel < 100) {
                const expNeeded = getExpToNextLevel(currentLevel);

                if (currentExp >= expNeeded) {
                    currentExp -= expNeeded;
                    currentLevel += 1;
                    levelGained += 1;
                } else {
                    break;
                }
            }

            if (levelGained > 0) {
                // 経験値とレベルを更新
                instance.level = currentLevel;
                instance.exp_current = currentExp;
                
                // ステータス更新（線形成長）
                const hpGain = Math.floor((baseHp / 100) * levelGained);
                const atkGain = Math.floor((baseAtk / 100) * levelGained);
                
                instance.hp += hpGain;
                instance.atk += atkGain;
                
                console.log(`applyLevelUpAndStats: ${instance.name} LV UP! (+${levelGained} Lv)`);
            } else {
                 instance.exp_current = currentExp;
            }

            return instance;
        }

        function checkAndApplyAllLevelUps() {
            if (!gameData || !gameData.roster) return;

            let levelUpOccurred = false;
            
            gameData.roster = gameData.roster.map(pokeInstance => {
                const oldLevel = pokeInstance.level;
                const updatedInstance = applyLevelUpAndStats(pokeInstance, allPokemonData);
                if (updatedInstance.level !== oldLevel) {
                    levelUpOccurred = true;
                }
                return updatedInstance;
            });

            if (levelUpOccurred) {
                saveGameData(gameData);
                // レベルアップしたことをプレイヤーに伝える (アラートは不要、UI更新で十分)
            }
        }

        // ----------------------------------------------------
        // III. スタミナロジック
        // ----------------------------------------------------
        
        function checkAndApplyStaminaRecovery() {
            const now = Date.now();
            let lastRecovery = gameData.player.last_recovery_timestamp || now;
            
            let recoveredStamina = 0;
            while (gameData.player.stamina < gameData.player.max_stamina && now - lastRecovery >= STAMINA_RECOVERY_INTERVAL_MS) {
                gameData.player.stamina += 1;
                lastRecovery += STAMINA_RECOVERY_INTERVAL_MS;
                recoveredStamina += 1;
            }

            if (recoveredStamina > 0) {
                gameData.player.last_recovery_timestamp = lastRecovery;
                saveGameData(gameData);
                // console.log(`スタミナ回復: +${recoveredStamina}`);
            }
            updateStaminaDisplay(gameData.player.stamina, gameData.player.max_stamina, gameData.player.last_recovery_timestamp);
        }

        function updateStaminaDisplay(stamina, maxStamina, lastTimestamp) {
            const now = Date.now();
            const lastTime = lastTimestamp || now;
            
            let timeUntilNextRecovery = STAMINA_RECOVERY_INTERVAL_MS - (now - lastTime);
            
            let displayTime = "(満タン)";
            if (stamina < maxStamina) {
                timeUntilNextRecovery = Math.max(0, timeUntilNextRecovery);
                const minutes = Math.floor(timeUntilNextRecovery / 60000);
                const seconds = Math.floor((timeUntilNextRecovery % 60000) / 1000);
                displayTime = `あと ${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            }

            const displayValue = `⚡️ ${stamina}/${maxStamina} ${displayTime}`;
            document.getElementById('staminaDisplay').textContent = displayValue;
        }

        function startStaminaRecoveryTimer() {
            setInterval(() => {
                // 1秒ごとにスタミナ回復をチェックし、UIを更新する
                checkAndApplyStaminaRecovery();
            }, 1000); 
        }

        // ----------------------------------------------------
        // IV. 通貨＆デイリーボーナスロジック
        // ----------------------------------------------------
        
        function updateCurrencyDisplay() {
            const currency = gameData.player.currency || 0;
            document.getElementById('currencyDisplay').textContent = `💰 ${currency.toLocaleString()}`;
        }
        
        function checkDailyCurrencyClaim() {
            const now = Date.now();
            const lastClaim = gameData.player.last_daily_currency_claim_timestamp || 0;
            const timeElapsed = now - lastClaim;
            const area = document.getElementById('dailyBonusArea');
            
            if (timeElapsed >= DAILY_RECOVERY_INTERVAL_MS) {
                area.innerHTML = `
                    <div class="ui-button" onclick="claimDailyCurrency()">
                        ✨ デイリーボーナスを受け取る (${DAILY_CURRENCY_AMOUNT}💰)
                    </div>
                `;
                area.querySelector('.ui-button').style.backgroundColor = '#4CAF50';
                area.querySelector('.ui-button').style.color = 'white';
                area.querySelector('.ui-button').style.boxShadow = '0 4px 0 0 #2e7d32';

            } else {
                const timeRemaining = DAILY_RECOVERY_INTERVAL_MS - timeElapsed;
                const hours = Math.floor(timeRemaining / (60 * 60 * 1000));
                const minutes = Math.floor((timeRemaining % (60 * 60 * 1000)) / (60 * 1000));
                
                area.innerHTML = `
                    <p style="font-weight: bold; color: #555;">
                        デイリーボーナスまで: あと ${hours}時間 ${String(minutes).padStart(2, '0')}分
                    </p>
                `;
            }
        }
        
        function claimDailyCurrency() {
            const now = Date.now();
            const lastClaim = gameData.player.last_daily_currency_claim_timestamp || 0;
            const timeElapsed = now - lastClaim;

            if (timeElapsed < DAILY_RECOVERY_INTERVAL_MS) {
                return;
            }

            gameData.player.currency = (gameData.player.currency || 0) + DAILY_CURRENCY_AMOUNT;
            gameData.player.last_daily_currency_claim_timestamp = now;
            
            saveGameData(gameData);
            
            updateCurrencyDisplay();
            checkDailyCurrencyClaim(); 
            
            alert(`🎉 デイリーボーナス ${DAILY_CURRENCY_AMOUNT}💰 を獲得しました！`);
        }

        // ----------------------------------------------------
        // V. UI描画ロジック
        // ----------------------------------------------------

        function calculateExpPercentage(level, currentExp) {
            if (level >= 100) return 100;
            const expNeeded = getExpToNextLevel(level);
            return Math.min(100, (currentExp / expNeeded) * 100);
        }

        function updateRosterList() {
            const list = document.getElementById('rosterList');
            list.innerHTML = '';
            
            if (!gameData || !gameData.roster || gameData.roster.length === 0) {
                 list.innerHTML = '<p>まだ仲間がいません。最初のポケモンを選んでください。</p>';
                return;
            }

            gameData.roster.forEach(poke => {
                const card = document.createElement('div');
                card.className = 'pokemon-card';
                
                const expPercent = calculateExpPercentage(poke.level, poke.exp_current);
                
                // チームメンバーをハイライト
                const isTeamMember = gameData.current_team_ids.includes(poke.instance_id);
                if (isTeamMember) {
                    card.style.border = '3px solid var(--ui-orange)';
                    card.style.boxShadow = '4px 4px 0 0 var(--ui-orange)';
                }
                
                card.innerHTML = `
                    <div class="pokemon-name">${poke.name} (Lv.${poke.level})</div>
                    <div class="pokemon-image">${isTeamMember ? '⭐' : '🥚'}</div>
                    <div class="pokemon-stats">
                        <div>HP: ${poke.hp}</div>
                        <div>ATK: ${poke.atk}</div>
                    </div>
                    <div class="exp-bar-container">
                        <div class="exp-bar" style="width: ${expPercent}%;"></div>
                    </div>
                    <small>EXP: ${poke.exp_current}/${getExpToNextLevel(poke.level)}</small>
                `;
                
                list.appendChild(card);
            });
        }
        
        // ----------------------------------------------------
        // VI. 初回起動/スターター選択ロジック
        // ----------------------------------------------------

        function selectStarter(pokemonId) {
            const pokemonMaster = allPokemonData.find(p => p.id === pokemonId);
            if (!pokemonMaster) {
                alert("ポケモンのデータが見つかりません。");
                return;
            }
            
            const now = Date.now();

            // 新しいゲームデータを初期化
            gameData = {
                player: {
                    max_stamina: 5,
                    stamina: 5,
                    last_recovery_timestamp: now,
                    currency: 100, // 初期通貨を付与
                    last_daily_currency_claim_timestamp: now // 初回は受け取り済みに
                },
                roster: [],
                current_team_ids: [],
                inventory: {
                    materials: {}
                },
                next_instance_id: 1001
            };
            
            // スターターポケモンをロースターに追加
            const newPokemon = {
                instance_id: gameData.next_instance_id++,
                pokemon_id: pokemonMaster.id,
                name: pokemonMaster.name_ja,
                level: 1,
                exp_current: 0,
                hp: pokemonMaster.base_hp,
                atk: pokemonMaster.base_atk
            };
            gameData.roster.push(newPokemon);
            gameData.current_team_ids.push(newPokemon.instance_id); // チームに設定

            saveGameData(gameData);
            alert(`🎊 ${pokemonMaster.name_ja} をパートナーに選びました！`);
            document.getElementById('starterSelection').style.display = 'none';
            initializeGame(); // メイン画面を再初期化
        }

        // ----------------------------------------------------
        // VII. 画面初期化メイン
        // ----------------------------------------------------
        
        async function initializeGame() {
            // 1. マスターデータの読み込み
            await fetchPokemonMasterData();

            // 2. ゲームデータのロード
            gameData = loadGameData();
            
            // 3. 初回起動チェック
            if (!gameData && masterDataLoaded) {
                document.getElementById('starterSelection').style.display = 'flex';
                return; 
            } else if (gameData) {
                // 4. データ構造のマイグレーション/初期化
                gameData.roster = gameData.roster.map(p => {
                    p.exp_current = p.exp_current || 0;
                    return p;
                });
                
                // playerデータの初期化（通貨、デイリータイムスタンプ）
                gameData.player.currency = gameData.player.currency || 0;
                gameData.player.last_daily_currency_claim_timestamp = gameData.player.last_daily_currency_claim_timestamp || 0;
                
                // 5. レベルアップチェック
                checkAndApplyAllLevelUps(); 

                // 6. 自動回復のチェックとタイマー開始
                checkAndApplyStaminaRecovery(); 
                startStaminaRecoveryTimer();

                // 7. UIの初期表示
                updateRosterList();
                updateCurrencyDisplay(); 
                
                // 8. デイリーボーナスのチェック
                checkDailyCurrencyClaim();
                // 1分ごとにチェックを更新
                setInterval(checkDailyCurrencyClaim, 60000); 
                
            } else {
                // ロード失敗時
                alert("ゲームデータが破損しています。最初からやり直します。");
                localStorage.removeItem(STORAGE_KEY);
                window.location.reload();
            }
        }
        
        // 画面ロード時に実行
        window.onload = initializeGame;

        // ----------------------------------------------------
        // VIII. 画面遷移ロジック
        // ----------------------------------------------------
        function goToExpedition() {
            window.location.href = 'expedition.html';
        }

        function goToStore() {
             window.location.href = 'store.html';
        }
        
        function goToCooking() {
             alert('🚨 料理機能は次の任務で実装します！');
             // window.location.href = 'cooking.html'; // 実際の遷移先
        }

        function goToTeamEdit() {
            alert('🚨 チーム編成画面は未実装です。');
             window.location.href = 'team_edit.html'; // 実際の遷移先
        }

    </script>
</body>
</html>
