<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="description" content="ポケモンクエスト風のベースキャンプ画面を忠実に再現">
    <meta name="keywords" content="ポケモンクエスト, キャンプ, HTML, CSS, ピクセルアート">
    <meta name="author" content="Gemini programming隊">
    <meta property="og:title" content="ポケモンクエスト風 ベースキャンプ画面">
    <meta property="og:description" content="忠実なUIの再現">
    <meta property="og:image" content="logo.png">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" href="icon.png" type="image/png">

    <title>ベースキャンプ | Gemini programming隊</title>
    <style>
        /* CSSカスタムプロパティ（色の定義） */
        :root {
            --ui-yellow: #ffc90e;
            --ui-orange: #ff9900;
            --ui-dark: #333;
            --ui-green-field: #a4c6a4;
            --ui-light-green: #c0dbc0;
        }

        /* 全体の設定 */
        body {
            background-color: #f7f0e6;
            font-family: 'Verdana', 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* ゲーム画面コンテナ */
        .game-screen {
            width: 100%;
            max-width: 900px; /* 画面サイズを広げ、画像に近づける */
            height: 500px; /* 画面の高さを固定 */
            border: 8px solid var(--ui-dark);
            box-shadow: 12px 12px 0 0 #555;
            box-sizing: border-box;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* --- 1. フィールド背景 --- */
        .field-background {
            flex-grow: 1;
            background-color: var(--ui-green-field);
            /* 画像の模様を再現する（複雑なCSSグラデーションで再現可能だが、今回は簡易的な模様で） */
            background-image: repeating-linear-gradient(
                45deg,
                var(--ui-light-green) 0px,
                var(--ui-light-green) 10px,
                transparent 10px,
                transparent 20px
            );
            position: relative;
            overflow: hidden;
        }
        
        /* 模様をさらに重ねて、忠実度を上げる (CSSの背景は複雑なので、ここでは模様の四角だけ配置) */
        .field-background::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 10% 20%, rgba(255, 255, 255, 0.2) 2px, transparent 0),
                radial-gradient(circle at 50% 70%, rgba(255, 255, 255, 0.2) 2px, transparent 0);
        }

        /* 料理鍋と配置エリア（中央のUI） */
        .center-ui {
            position: absolute;
            top: 25%;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 砂地の配置マス */
        .sand-plot {
            width: 80px;
            height: 80px;
            background-color: var(--ui-yellow);
            border: 3px solid #b38b00;
            position: absolute; /* 鍋の周りに配置するために絶対配置 */
            transform: rotateX(50deg) perspective(100px); /* 立体感を出す */
        }
        .plot-1 { top: 100px; left: -100px; }
        .plot-2 { top: 100px; left: 20px; }
        .plot-3 { top: 180px; left: -40px; }
        .plot-4 { top: 20px; left: -40px; }

        .cooking-pot {
            width: 150px;
            height: 100px;
            background-color: #666;
            border: 5px solid var(--ui-dark);
            position: relative;
            z-index: 10;
        }


        /* --- 2. 上部UI (タイトルとスタミナ) --- */
        .top-ui-fixed {
            position: absolute;
            top: 5px;
            width: 100%;
            padding: 0 10px;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            z-index: 20;
        }

        .basecamp-title {
            background-color: #66aa44;
            border: 3px solid var(--ui-dark);
            color: #fff;
            padding: 5px 10px;
            font-weight: bold;
            font-size: 16px;
        }

        .stamina-status {
            background-color: var(--ui-dark);
            color: #fff;
            padding: 5px 10px;
            border: 3px solid var(--ui-yellow);
        }

        /* --- 3. 下部UI (ボタン群) --- */
        .bottom-menu-group {
            position: absolute;
            bottom: 10px;
            left: 10px;
            right: 10px;
            display: grid;
            grid-template-columns: repeat(6, 1fr); /* 6列のグリッド */
            grid-template-rows: repeat(2, auto); /* 2行のグリッド */
            gap: 5px;
            z-index: 20;
        }
        
        /* 汎用ボタンのスタイル */
        .ui-button {
            background-color: var(--ui-yellow);
            border: 3px solid var(--ui-dark);
            color: var(--ui-dark);
            padding: 8px;
            text-align: center;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            border-radius: 5px;
            box-shadow: 0 4px 0 0 #b38b00; /* 立体的な影 */
            transition: all 0.1s;
        }
        .ui-button:active {
            box-shadow: 0 1px 0 0 #b38b00;
            transform: translateY(3px);
        }

        /* 画像の配置に合わせて調整 */
        .moyo-button { 
            grid-column: 1 / 2;
            grid-row: 1 / 3;
            height: 100px;
            background-color: var(--ui-orange);
            font-size: 14px;
        }

        .team-button { grid-column: 3 / 4; grid-row: 2 / 3;}
        .pokemon-button { grid-column: 4 / 5; grid-row: 2 / 3;}
        .quest-button { grid-column: 2 / 3; grid-row: 2 / 3;}

        /* 「島の探検」ボタン - 最も目立つボタン */
        .explore-button {
            grid-column: 6 / 7;
            grid-row: 2 / 3;
            background-color: var(--ui-orange);
            color: #fff;
            border-color: #ff0000; /* 画像の赤枠を再現 */
            box-shadow: 0 5px 0 0 #9e0000;
            padding: 15px 5px;
            font-size: 14px;
        }
        .explore-button:active {
            box-shadow: 0 2px 0 0 #9e0000;
        }
    </style>
</head>
<body>
    <div class="game-screen">
        
        <div class="field-background">
            
            <div class="center-ui">
                <div class="sand-plot plot-1"></div>
                <div class="sand-plot plot-2"></div>
                <div class="sand-plot plot-3"></div>
                <div class="sand-plot plot-4"></div>
                
                <div class="cooking-pot">
                    </div>
            </div>
            
        </div>

        <div class="top-ui-fixed">
            <div class="basecamp-title">
                ベースキャンプ
                </div>
            <div class="stamina-status">
                ⚡️ 4/5 あと 25:59
            </div>
        </div>

        <div class="bottom-menu-group">
            
            <div class="ui-button moyo-button">もようがえ</div>
            
            <div class="ui-button">オプション</div>
            <div class="ui-button">クエスト</div>
            <div class="ui-button">図鑑</div>

            <div class="ui-button team-button">チーム編成</div>
            <div class="ui-button pokemon-button">ピカチュウ</div>

           <div class="ui-button explore-button" onclick="goToExpedition()">島の探検</div>
<script>
    // 島の探検ボタンが押された時の関数
    function goToExpedition() {
        console.log("島の探検へ推移します！");
        // basecamp.html から expedition.html へ遷移
        window.location.href = 'expedition.html';
    }
    // Pythonのデバッグ出力のように、遷移先をコンソールに出力
    console.log(`現在の画面: basecamp.html`);
    console.log(`次の推移先: expedition.html`);
    // 【ローカルストレージ管理のための関数群】

// データのキー定義
const STORAGE_KEY = 'pokemon_quest_data';
console.log(`STORAGE_KEY:${STORAGE_KEY}`);

// 1. ローカルストレージからデータを読み込む関数
function loadGameData() {
    const storedData = localStorage.getItem(STORAGE_KEY);
    const storedDataValue = storedData ? storedData.substring(0, 30) + '...' : 'null';
    console.log(`storedDataValue:${storedDataValue}`); 
    return storedData ? JSON.parse(storedData) : null;
}

// 2. データをローカルストレージに保存する関数
function saveGameData(data) {
    const dataString = JSON.stringify(data);
    const dataStringValue = dataString.substring(0, 30) + '...';
    console.log(`dataStringValue:${dataStringValue}`); 
    localStorage.setItem(STORAGE_KEY, dataString);
}

// 3. 実行：初期ロードとデータ確認
function initializeGame() {
    let gameData = loadGameData();
    
    // データがない場合（初回起動時）
    if (!gameData) {
        console.log("初回起動です。初期データを生成します。");
        // ★ ここで fetch('pokemon.json') を実行し、データを読み込む処理が必要
        // 今回はダミーデータで初期化
        gameData = {
            player: { name: "隊員", stamina: 5 },
            // 例: 手持ちのポケモンリスト
            roster: [
                { id: 4, name: "ヒトカゲ", level: 5, hp: 120 },
                { id: 7, name: "ゼニガメ", level: 5, hp: 130 }
            ],
            inventory: []
        };
        saveGameData(gameData);
    } else {
        console.log("ゲームデータをロードしました。");
        // 例: スタミナを表示に反映させるなどの処理
    }
    const rosterCount = gameData.roster.length;
    console.log(`rosterCount:${rosterCount}`);
    
    // UIを更新する関数 (例: スタミナを表示)
    updateStaminaDisplay(gameData.player.stamina);
}

function updateStaminaDisplay(stamina) {
    const staminaDisplay = document.querySelector('.stamina-status');
    const displayValue = `⚡️ ${stamina}/5 あと 25:59`;
    console.log(`displayValue:${displayValue}`);
    if (staminaDisplay) {
        staminaDisplay.textContent = displayValue;
    }
}

// 画面ロード時に実行
window.onload = initializeGame;
</script>
            
            </div>
        
    </div>
</body>
</html>
