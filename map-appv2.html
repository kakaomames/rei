<!DOCTYPE html>
<html>
<head>
    <title>OpenStreetMap + Leaflet Custom Map (Pokemon GO Style)</title>
    <meta charset="utf-8">
    
    <link rel="stylesheet" type="text/css" href="./map-appv2.css" />
    
    <link rel="stylesheet" type="text/css" href="./leaflet/leaflet.css" />
</head>
<body>
    <script src="./leaflet/leaflet.js"></script>
    <div id="map" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0;"></div>

    
    <div id="pokemon-box-ui" style="position: absolute; top: 10px; right: 10px; z-index: 20; padding: 10px; background-color: rgba(0, 0, 0, 0.5); border-radius: 10px; max-width: 300px;">
        </div>

    <button id="menu-button" onclick="window.openMenu()" 
        style="position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); z-index: 15; padding: 15px 30px; font-size: 18px; cursor: pointer; border-radius: 25px; background-color: #4CAF50; color: white; border: 3px solid #38703a;">
        メニュー
    </button>
    
    
    <div id="capture-ui" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: white; display: none; z-index: 25;">
        </div>

    <div id="main-menu" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.9); display: none; z-index: 30; color: white;">
        
        <button onclick="window.closeMenu()" style="position: absolute; top: 20px; right: 20px; font-size: 24px; background: none; border: none; color: white; cursor: pointer;">
            ❌
        </button>

        <div id="menu-options" style="text-align: center; padding-top: 50px;">
        <h1 style="margin-bottom: 40px;">メインメニュー</h1>
        <div style="display: flex; justify-content: center; flex-wrap: wrap; gap: 30px;">
            <button onclick="window.showPokemonList()" class="menu-item">ポケモン</button>
            
            <button onclick="window.showInventory()" class="menu-item">道具</button>
            
            <button onclick="alert('ショップ画面（後で実装）');" class="menu-item">ショップ</button>
            <button onclick="alert('図鑑画面（後で実装）');" class="menu-item">図鑑</button>
            <button onclick="alert('対戦画面（後で実装）');" class="menu-item">対戦</button>
            <button onclick="window.showSettings()" class="menu-item">設定</button>
        </div>
    </div>

    <div id="pokemon-list-container" class="sub-menu-content" style="display: none; padding: 20px; overflow-y: auto; height: 100%;"></div>
    <div id="settings-container" class="sub-menu-content" style="display: none; padding: 20px;"></div>
    <div id="inventory-container" class="sub-menu-content" style="display: none; padding: 20px; overflow-y: auto; height: 100%;"></div>
    </div>

    
    <style>
    .menu-item {
        padding: 15px 25px;
        font-size: 16px;
        background-color: #333;
        color: white;
        border: 2px solid #555;
        border-radius: 8px;
        cursor: pointer;
        transition: background-color 0.3s;
    }
    .menu-item:hover {
        background-color: #555;
    }
    .sub-menu-content {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.95); /* メニューオプションより濃い背景 */
    }
    </style>

 <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module" src="./map_logic.js"></script>
<script type="module" src="./api.js"></script>

<script type="module" src="./pokemon.js"></script>
<script type="module" src="./pokemongo-UI.js"></script>
<script type="module" src="./item.js"></script>
<script type="module" src="./settings.js"></script>
<script type="module" src="./pokestop.js"></script>

    <script>
    import { L } from './leaflet/leaflet.js'
    import { initializeMapModule } from './map_logic.js'
    // 💡 待機処理をポーリング（短い間隔でチェック）に切り替え、
    // L と initializeMapModule の両方が定義されるのを待ちます。
    
    let checkCount = 0;
    const maxChecks = 100; // 最大1秒間 (10ms * 100) チェックする

    function tryInitialize() {
        if (typeof L !== 'undefined' && typeof window.initializeMapModule === 'function') {
            console.log("✅ [TRIGGER] Leafletとモジュール登録を確認。マップ初期化を開始します。");
            // ログが失われないよう、L のチェックは initializeMapModule の中ではなく、ここで行う
            window.initializeMapModule();
        } else if (checkCount < maxChecks) {
            checkCount++;
            // 10ミリ秒ごとに再チェック
            setTimeout(tryInitialize, 10); 
        } else {
            console.error("🚨 [FATAL ERROR] 1秒間待機しましたが、L (Leaflet) または initializeMapModule が未定義のままです。");
        }
    }

    // ページロードまたはDOM構築が完了したら待機を開始
    window.addEventListener('load', tryInitialize); 
    // または、DOMContentLoaded でも試せます
    // document.addEventListener('DOMContentLoaded', tryInitialize);

</script>
</body>
</html>
