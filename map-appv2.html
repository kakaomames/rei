<!DOCTYPE html>
<html>
<head>
    <title>OpenStreetMap + Leaflet Custom Map (Pokemon GO Style)</title>
    <meta charset="utf-8">
    
    <link rel="stylesheet" type="text/css" href="./map-appv2.css" />
    
    <link rel="stylesheet" type="text/css" href="./leaflet/leaflet.css" />
</head>
<body>
    
    <div id="menu-screen" class="overlay-screen">
        <div>
            <h2>メニュー画面 (Z: 20)</h2>
            <p>設定やオプションを表示します。</p>
            <button class="close-button" onclick="closeOverlay('menu-screen')">❌</button> 
        </div>
    </div>
    
    <div id="account-screen" class="overlay-screen">
        <div>
            <h2>アカウント画面 (Z: 20)</h2>
            <p>プレイヤー情報や図鑑を表示します。</p>
            <button class="close-button" onclick="closeOverlay('account-screen')">❌</button>
        </div>
    </div>
    
    <div id="quest-screen" class="overlay-screen">
        <div>
            <h2>クエスト画面 (Z: 20)</h2>
            <p>今日のタスクやリサーチを表示します。</p>
            <button class="close-button" onclick="closeOverlay('quest-screen')">❌</button>
        </div>
    </div>

    <div id="map"></div>

    <div id="button-bar">
        <button id="menu-button" class="ui-button" onclick="openOverlay('menu-screen')">メニュー</button>
        <button id="account-button" class="ui-button" onclick="openOverlay('account-screen')">アカウント</button>
        <button id="quest-button" class="ui-button" onclick="openOverlay('quest-screen')">クエスト</button>
    </div>
    <div id="capture-ui" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: white; display: none; z-index: 25;">
    </div>
    <div id="pokemon-box-ui" style="position: absolute; top: 10px; right: 10px; z-index: 20; padding: 10px; background-color: rgba(0, 0, 0, 0.5); border-radius: 10px; max-width: 300px;">
    </div>

<script type="module" src="./pokemon.js"></script>
<script type="module" src="./pokemongo-UI.js"></script>
    <script src="./leaflet/leaflet.js"></script> 
    
    <script src="./map_logic.js"></script> 
    
    <script>
        /**
         * 指定されたIDのオーバーレイ画面を表示する
         * @param {string} screenId - 表示する画面のDOM ID
         */
        function openOverlay(screenId) {
            const screenElement = document.getElementById(screenId);
            if (screenElement) {
                screenElement.style.display = 'flex'; // flexを使って中央寄せを有効化
            }
        }

        /**
         * 指定されたIDのオーバーレイ画面を非表示にする (マップに戻る)
         * @param {string} screenId - 非表示にする画面のDOM ID
         */
        function closeOverlay(screenId) {
            const screenElement = document.getElementById(screenId);
            if (screenElement) {
                screenElement.style.display = 'none';
            }
        }
    </script>

</body>
</html>
