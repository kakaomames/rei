<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ウェブマイクラ！ - プレイ</title>
    <link rel="stylesheet" href="style.css"> 
    <style>
        /* play.html専用のスタイル。 */
        body {
            overflow: hidden; 
        }
        #game-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
        }
    </style>
</head>
<body>
    <div id="game-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/controls/PointerLockControls.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.7.1/jszip.min.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const delayInMilliseconds = 1000; // 1秒遅延

            console.log(`[LOG] game.js の読み込みを ${delayInMilliseconds}ms 遅延します...`);
            
            setTimeout(() => {
                const gameScript = document.createElement('script');
                gameScript.src = 'game.js';
                // gameScript.async = true; // 必要に応じて非同期フラグを追加
                document.body.appendChild(gameScript);
                console.log("[LOG] game.js の遅延読み込みを開始しました。");
            }, delayInMilliseconds);
        });
    </script>
    <script src="addon.js"></script>

<script>
  // addon.js

// ------------------------------------
// 定数
// ------------------------------------
const ADDON_INDEX_KEY = 'custom-addon'; // アドオン一覧のローカルストレージキー
const STATUS_ELEMENT = document.getElementById('addon-status');

// ------------------------------------
// ユーティリティ関数
// ------------------------------------

/**
 * PromiseでファイルをBase64文字列に変換する
 * @param {Blob} blob - ファイルのBlobデータ
 * @returns {Promise<string>} Base64文字列
 */
function blobToBase64(blob) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onloadend = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(blob);
    });
}

/**
 * ローカルストレージからJSONデータを安全に取得する
 * @param {string} key - ローカルストレージのキー
 * @returns {object} JSONデータ (存在しない場合は空のオブジェクト)
 */
function getStorageJson(key) {
    const data = localStorage.getItem(key);
    try {
        return data ? JSON.parse(data) : {};
    } catch (e) {
        console.error(`Local Storageのキー ${key} の解析エラー`, e);
        return {};
    }
}

/**
 * ローカルストレージにJSONデータを安全に保存する
 * @param {string} key - ローカルストレージのキー
 * @param {object} data - 保存するJSONオブジェクト
 */
function setStorageJson(key, data) {
    try {
        localStorage.setItem(key, JSON.stringify(data));
    } catch (e) {
        console.error(`Local Storageへのキー ${key} の保存エラー`, e);
    }
}

// ------------------------------------
// メインロジック
// ------------------------------------

/**
 * ユーザーが選択したMCAddon/MCPackファイルを処理する
 * @param {File} file - ユーザーが選択したファイルオブジェクト
 */
async function processAddonFile(file) {
    if (!file) return;

    STATUS_ELEMENT.textContent = `ファイルを解析中: ${file.name}...`;

    try {
        const jszip = new JSZip();
        // 1. ファイルをJSZipで読み込み解凍
        const zip = await jszip.loadAsync(file);
        
        // 2. manifest.jsonを取得し解析
        const manifestFile = zip.file('manifest.json');
        if (!manifestFile) {
            throw new Error('manifest.jsonが見つかりません。これは有効なMinecraft Packではありません。');
        }

        const manifestText = await manifestFile.async('string');
        const manifest = JSON.parse(manifestText);

        const header = manifest.header;
        if (!header || !header.uuid || !header.name) {
            throw new Error('manifest.jsonのHeader情報（UUIDまたは名前）が不正です。');
        }

        const uuid = header.uuid;
        const packName = header.name;

        // 3. アドオンの実データを収集し、Base64にエンコード
        const packData = {
            manifest: manifest, // manifest.json自体も保存
        };
        
        // manifest.json以外のすべてのファイルを処理
        const filePromises = [];
        zip.forEach((relativePath, zipEntry) => {
            if (relativePath === 'manifest.json' || zipEntry.dir) {
                return;
            }
            
            // ファイルをBlobとして取得し、Base64に変換してパックデータに追加
            filePromises.push(
                zipEntry.async('blob')
                    .then(blob => blobToBase64(blob))
                    .then(base64Data => {
                        packData[relativePath] = base64Data;
                    })
            );
        });

        // 全てのファイル変換が終わるのを待つ
        await Promise.all(filePromises);

        // 4. Local Storageに保存
        
        // A. 実データをUUIDをキーとして保存
        setStorageJson(uuid, packData);
        
        // B. インデックス（一覧）を更新
        const addonIndex = getStorageJson(ADDON_INDEX_KEY);
        addonIndex[uuid] = packName;
        setStorageJson(ADDON_INDEX_KEY, addonIndex);

        STATUS_ELEMENT.textContent = `✅ アドオン「${packName}」を保存しました！ (UUID: ${uuid})`;
        console.log(`アドオン保存完了: ${uuid}`);

    } catch (error) {
        STATUS_ELEMENT.textContent = `❌ アドオン処理エラー: ${error.message}`;
        console.error('アドオン処理中にエラーが発生しました:', error);
    }
}


// ------------------------------------
// 初期設定 (イベントリスナー)
// ------------------------------------
document.addEventListener('DOMContentLoaded', () => {
    const fileInput = document.getElementById('addon-file-input');
    if (fileInput) {
        fileInput.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (file) {
                processAddonFile(file);
            }
        });
    } else {
        console.warn('ファイル入力要素 #addon-file-input が見つかりません。');
    }
    
    // 起動時に既存のアドオンを読み込む関数を呼び出す（後で実装）
    // loadExistingAddons();
});
  // game.js

// ------------------------------------
// 1. 基本定数とグローバル変数の定義
// ------------------------------------
let scene, camera, renderer, controls;
const container = document.getElementById('game-container');

// アドオン管理関連の定数
const ADDON_INDEX_KEY = 'custom-addon';
const ASSET_MANAGER = {}; // 読み込まれたテクスチャやモデルを格納
const textureLoader = new THREE.TextureLoader();

// プレイヤー移動用変数
let moveForward = false;
let moveBackward = false;
let moveLeft = false;
let moveRight = false;
let velocity = new THREE.Vector3(); // プレイヤーの移動速度
let direction = new THREE.Vector3(); // 移動方向
const speed = 15.0; // 移動速度
let prevTime = performance.now(); // 毎フレームのデルタタイム計算用

// ------------------------------------
// 2. ユーティリティ関数
// ------------------------------------

/**
 * ローカルストレージからJSONデータを安全に取得する
 * @param {string} key - ローカルストレージのキー
 * @returns {object} JSONデータ (存在しない場合は空のオブジェクト)
 */
function getStorageJson(key) {
    const data = localStorage.getItem(key);
    try {
        return data ? JSON.parse(data) : {};
    } catch (e) {
        console.error(`Local Storageのキー ${key} の解析エラー`, e);
        return {};
    }
}

/**
 * Base64文字列をThree.jsのテクスチャオブジェクトに変換する
 * @param {string} base64 - Base64データURL
 * @returns {THREE.Texture}
 */
function loadTextureFromBase64(base64) {
    const texture = textureLoader.load(base64);
    // マイクラ風の見た目を再現するため、ピクセル補間設定を適用
    texture.magFilter = THREE.NearestFilter;
    texture.minFilter = THREE.NearestFilter;
    return texture;
}

// ------------------------------------
// 3. アドオンの読み込みと適用
// ------------------------------------

/**
 * ローカルストレージに保存されたカスタムアドオンを読み込む
 */
async function loadCustomAddons() {
    console.log("[LOG] カスタムアドオンの読み込みを開始...");
    
    const addonIndex = getStorageJson(ADDON_INDEX_KEY);
    const activeUUIDs = Object.keys(addonIndex);

    if (activeUUIDs.length === 0) {
        console.log("[LOG] アクティブなカスタムアドオンは見つかりませんでした。");
        return;
    }

    for (const uuid of activeUUIDs) {
        const packData = getStorageJson(uuid);
        
        if (Object.keys(packData).length === 0) continue;

        console.log(`[LOG] パック「${addonIndex[uuid]}」のデータを解析中...`);

        for (const filePath in packData) {
            if (filePath === 'manifest') {
                ASSET_MANAGER[uuid] = ASSET_MANAGER[uuid] || {};
                ASSET_MANAGER[uuid]['manifest'] = packData[filePath];
                continue;
            }
            
            const extension = filePath.split('.').pop().toLowerCase();
            const base64Data = packData[filePath];
            
            if (!base64Data.startsWith('data:')) continue;

            if (extension === 'png' || extension === 'jpg') {
                // テクスチャ（画像ファイル）の処理
                const texture = loadTextureFromBase64(base64Data);
                ASSET_MANAGER[filePath] = texture;
                
            } else if (extension === 'json') {
                // JSONファイルの処理（モデル、ブロック定義など）
                const jsonBase64 = base64Data.split(',')[1];
                try {
                    const jsonString = atob(jsonBase64); // Base64デコード
                    const jsonData = JSON.parse(jsonString);
                    ASSET_MANAGER[filePath] = jsonData;
                } catch (e) {
                    console.error(`[${filePath}] JSON解析エラー:`, e);
                }
            } 
        }
    }

    console.log("[LOG] 全カスタムアドオンの読み込み完了。");
}

// ------------------------------------
// 4. 初期化関数 (init)
// ------------------------------------
async function init() {
    console.log("[LOG] --- init() 開始 ---"); // デバッグログ

    // 🚀 アドオン読み込みを最初に行う
    await loadCustomAddons(); 

    // 🌍 シーンの作成
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0xff0000); // 確認用: 赤
    // scene.background = new THREE.Color(0x87ceeb); // 本来の空の色

    // 💡 光源の追加
    const ambientLight = new THREE.AmbientLight(0x404040); 
    scene.add(ambientLight);
    const directionalLight = new THREE.DirectionalLight(0xffffff, 1); 
    directionalLight.position.set(1, 1, 1).normalize();
    scene.add(directionalLight);

    // 📸 カメラの作成
    camera = new THREE.PerspectiveCamera(
        75, 
        window.innerWidth / window.innerHeight, 
        0.1, 
        1000 
    );
    camera.position.set(0, 10, 0);

    // 🖼️ レンダラーの作成
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    container.appendChild(renderer.domElement);

    // 🕹️ PointerLockControlsのセットアップ
    controls = new THREE.PointerLockControls(camera, document.body);

    container.addEventListener('click', function () {
        controls.lock(); 
    });

    scene.add(controls.getObject()); 

    // キーボードイベントリスナーの追加
    document.addEventListener('keydown', onKeyDown, false);
    document.addEventListener('keyup', onKeyUp, false);
    
    // ウィンドウサイズ変更時のリサイズ処理
    window.addEventListener('resize', onWindowResize, false);
    
    // 初期ワールド生成とアニメーション開始
    createVoxelWorld();
    animate();

    console.log("[LOG] --- init() 完了 ---"); // デバッグログ
}

// ------------------------------------
// 5. ボクセル (ブロック) の作成
// ------------------------------------
function createVoxelWorld() {
    const geometry = new THREE.BoxGeometry(1, 1, 1);
    
    // 🌳 アドオンからテクスチャを取得、なければデフォルトの緑色
    const DIRT_PATH = 'textures/block/dirt.png'; 
    let material;
    
    if (ASSET_MANAGER[DIRT_PATH]) {
        const dirtTexture = ASSET_MANAGER[DIRT_PATH];
        material = new THREE.MeshLambertMaterial({ map: dirtTexture });
        console.log("[LOG] カスタムテクスチャ (Dirt) を適用しました。");
    } else {
        material = new THREE.MeshLambertMaterial({ color: 0x5aa743 });
        console.log("[LOG] カスタムテクスチャが見つかりません。デフォルトの緑色を使用します。");
    }

    // 地面を生成 (11x11の範囲)
    for (let x = -5; x <= 5; x++) {
        for (let z = -5; z <= 5; z++) {
            const block = new THREE.Mesh(geometry, material);
            block.position.set(x, 0, z); // Y=0 の地面に配置
            scene.add(block);
        }
    }
}

// ------------------------------------
// 6. イベントハンドラ (キー入力とリサイズ)
// ------------------------------------
function onKeyDown(event) {
    if (!controls.isLocked) return;
    
    switch (event.code) {
        case 'KeyW':
            moveForward = true;
            break;
        case 'KeyA':
            moveLeft = true;
            break;
        case 'KeyS':
            moveBackward = true;
            break;
        case 'KeyD':
            moveRight = true;
            break;
    }
}

function onKeyUp(event) {
    switch (event.code) {
        case 'KeyW':
            moveForward = false;
            break;
        case 'KeyA':
            moveLeft = false;
            break;
        case 'KeyS':
            moveBackward = false;
            break;
        case 'KeyD':
            moveRight = false;
            break;
    }
}

function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix(); 
    renderer.setSize(window.innerWidth, window.innerHeight); 
}

// ------------------------------------
// 7. ループ処理 (animate)
// ------------------------------------
function animate() {
    requestAnimationFrame(animate); 

    const time = performance.now();
    const delta = (time - prevTime) / 1000; 

    if (controls.isLocked === true) {

        // 減速処理
        velocity.x -= velocity.x * 10.0 * delta;
        velocity.z -= velocity.z * 10.0 * delta;

        // 移動方向の計算
        direction.z = Number(moveForward) - Number(moveBackward);
        direction.x = Number(moveRight) - Number(moveLeft);
        direction.normalize(); 

        // 速度の加算
        if (moveForward || moveBackward) velocity.z -= direction.z * speed * delta;
        if (moveLeft || moveRight) velocity.x -= direction.x * speed * delta;

        // カメラを移動
        controls.moveForward(-velocity.z * delta);
        controls.moveRight(velocity.x * delta);
    }
    
    prevTime = time;

    renderer.render(scene, camera);
}

// ------------------------------------
// 8. 実行
// ------------------------------------
console.log("==> game.js 実行開始トリガー"); // デバッグログ
init();
console.log("==> init() 呼び出し完了"); // デバッグログ
</script>
  </body>
</html>
