
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>クッキークリッカー</title>
    <link rel="stylesheet" href="style.css">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=Edge">
    <meta name="robots" content="noindex,nofollow">
    <meta name="viewport" content="width=device-width,initial-scale=1">
</head>
<body>
    <div id="wrapper">
        <div id="sectionLeft" class="inset">
            <div id="cookiesAnchor">
                <div id="bakeryNameAnchor"><div id="bakeryName"></div></div>
                <div id="cookiesNumber"></div>
                <div id="cookiesPerSecond"></div>
            </div>
            <div id="cookieAnchor">
                <div id="bigCookie"></div>
                <div id="cookieNumbers"></div>
            </div>
            <div id="sectionLeftInfo"></div>
        </div>

        <div id="sectionMiddle" class="inset">
            <div id="comments">
                <div id="commentsText"></div>
            </div>
            <div id="rows"></div>
            <div id="menu"></div>
        </div>

        <div id="sectionRight" class="inset">
            <div id="store">
                <div id="storeTitle" class="inset title">ストア</div>
                <div id="upgrades"></div>
                <div id="products"></div>
            </div>
        </div>

        <div id="tooltipAnchor"><div id="tooltip" class="inset"></div></div>
        <div id="debugLog"></div>
        <div id="fpsCounter"></div>
    </div>

    <script src="main.js"></script>
</body>
</html>
