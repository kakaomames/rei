<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>カカオマメのシンプルなゲームSPA (遅延読み込み)</title>
    
    <style>
        /* DOMがロードされた瞬間、JSが起動するまでコンテンツが重なるのを防ぐため、
           デフォルトで全てのゲーム画面を非表示にしておく */
        .game-page {
            display: none; 
        }
    </style>
    
    <style id="dynamic-style"></style> 
</head>
<body>
    <div id="game-container">
        
        <section id="title-screen" class="game-page">
            <h1>ゲーム選択画面</h1>
            <p>
                <button onclick="navigateTo('game1')">ゲーム1へ (type=game1)</button>
                <button onclick="navigateTo('slot')">スロットへ (type=slot)</button>
                <button onclick="navigateTo('hansya')">反射神経ゲームへ</button>
            </p>
        </section>

        <section id="game1-screen" class="game-page">
            <h2>🎮 ゲーム1 画面</h2>
            <p>ここが ?type=game1 で表示される画面です。</p>
            <p><button onclick="navigateTo('title')">タイトルに戻る</button></p>
        </section>

        <section id="slot-screen" class="game-page">
            <h2>💰 持ち金: <span id="money-display">5000</span> 円</h2>
            
            <div id="reels-container">
                <div class="reel-box" onclick="stopReel(0)"><div class="reel" id="reel-0">?</div></div>
                <div class="reel-box" onclick="stopReel(1)"><div class="reel" id="reel-1">?</div></div>
                <div class="reel-box" onclick="stopReel(2)"><div class="reel" id="reel-2">?</div></div>
            </div>
            
            <p id="result-message">スピンボタンを押してください (1回 100円)</p>
            
            <button id="spin-button" onclick="spin()">スピン！</button>
            <p style="margin-top: 20px;"><button onclick="navigateTo('title')">タイトルに戻る</button></p>
        </section>
        
        <section id="hansya-screen" class="game-page">
            <h2>🚀 反射神経テストゲーム</h2>
            <p class="instruction">現在のコイン: <span id="coin-display-hansya">0</span> 🪙</p>
            <p class="instruction">「スタート！」の表示後、丸が表示されたらすぐにクリックしてください。</p>
            <div id="game-area-hansya">
                <div id="target-hansya"></div>
                <div id="message-hansya">クリックでスタート！</div>
            </div>
            <div id="result-hansya" class="result"></div>
            
            <p style="margin-top: 20px;"><button onclick="navigateTo('title')">タイトルに戻る</button></p>
        </section>
    </div>

    <script>
        /**
         * 外部スクリプトを動的に作成・読み込み、完了時にコールバックを実行する汎用関数。
         */
        function loadScript(src, callback) {
            const script = document.createElement('script');
            script.src = src;
            
            script.onload = () => {
                console.log(`[Script Loader] ${src} の読み込みと実行が完了しました。`);
                if (callback) callback();
            };
            
            script.onerror = () => {
                console.error(`[Script Loader] ${src} の読み込みに失敗しました。`);
            };
            
            document.body.appendChild(script);
            console.log(`[Script Loader] ${src} の読み込みを開始しました。`);
        }

        /**
         * 全ての外部スクリプトを順番に読み込み、完了後に初期化関数を実行する。
         */
        function startLoading() {
            // 1. script.js (共通ロジック/ルーティング) を読み込む
            loadScript('script.js', () => {
                // 2. slot.js (スロットロジック) を読み込む
                loadScript('slot.js', () => {
                    // 3. hansya_logic.js (反射神経ロジック) を読み込む
                    loadScript('hansya.js', () => {
                        
                        // 4. 全てのスクリプトの実行完了後、initializeGame を実行
                        if (typeof initializeGame === 'function') {
                            initializeGame();
                            console.log("[Script Loader] ゲームの初期化処理を実行しました。");
                        } else {
                            console.error("[Script Loader] initializeGame 関数が見つかりません (実行タイミングエラー)。");
                        }
                    });
                });
            });
        }

        // 1秒 (1000ミリ秒) の遅延後にスクリプトの読み込みを開始 (ご要望の遅延処理)
        setTimeout(startLoading, 1000); 
        console.log("【初期ログ】ゲームスクリプトの読み込みを1秒遅延させます...");
    </script>
</body>
</html>
