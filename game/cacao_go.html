<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cacao GO - Real World Game</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <link rel="stylesheet" href="./cacao_go.css" />
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>

    <div id="map-container"></div>
    <div id="debug-controls">
        </div>
    <div id="capture-container">
        </div>
    
    <script>
        console.log("【1. HTMLロード完了】 1秒待機してからJSファイルを読み込みます。");
        
        // 1秒 (1000ms) の遅延をかける
        setTimeout(() => {
            console.log("【2. 1秒経過】 JSファイルの読み込みを開始します。");
            
            // capture_3d.js を先に読み込みます（map_managerが依存しているため）
            const script3d = document.createElement('script');
            script3d.type = 'module';
            script3d.src = './capture_3d.js';
            document.body.appendChild(script3d);

            console.log(`a:./capture_3d.js`);

            // map_manager.js を読み込みます
            const scriptMap = document.createElement('script');
            scriptMap.type = 'module';
            scriptMap.src = './map_manager.js';
            document.body.appendChild(scriptMap);
            
            console.log(`a:./map_manager.js`);

        }, 1000); // 1000ミリ秒 = 1秒
    </script>

</body>
</html>
