<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cacao GO - Real World Game</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <link rel="stylesheet" href="./cacao_go.css" />
    
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    </head>
<body>

    <div id="map-container"></div>
    
    <div class="overlay-ui top-ui">
        <h1>🍫 Cacao GO 🍌</h1>
        <br>
        <div id="msg">GPS信号を探索中...</div>
    </div>

    <div id="debug-controls">
        <button class="d-btn" onclick="logPositions()" style="font-size: 0.9rem; padding: 5px 10px;">📌 ログ出力</button>
        <button class="d-btn" onclick="moveFake(0.001, 0)">⬆️</button>
        <div style="display:flex; gap:5px;">
            <button class="d-btn" onclick="moveFake(0, -0.001)">⬅️</button>
            <button class="d-btn" onclick="moveFake(0, 0.001)">➡️</button>
        </div>
        <button class="d-btn" onclick="moveFake(-0.001, 0)">⬇️</button>
    </div>
    <div id="main-nav-controls" class="overlay-ui bottom-ui">
        <button id="nav-center-btn" onclick="showMainUIScreen('menu')" style="background-color: #f6b31c; color: white; border-radius: 50%; width: 60px; height: 60px; font-size: 1.5rem; border: 5px solid #d29400; box-shadow: 0 5px 0 #999;">
            🏠
        </button>
    </div>

    <div id="capture-container">
    <div id="threejs-container">
        <div class="overlay-ui top-ui">
            <h1 id="target-name">野生のバナナが現れた！</h1>
        </div>
        
        <div id="capture-message-display" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; background: rgba(0,0,0,0.7); padding: 20px; border-radius: 10px; display: none; z-index: 1000;">
            捕獲メッセージ
        </div>
        
        <div class="overlay-ui bottom-ui">
            <button id="throw-btn">ボールを投げる！</button>
            <button onclick="closeCapture()" style="background:#ccc; box-shadow:0 5px 0 #999; font-size:1rem; padding:10px 20px; margin-top:10px;">逃げる</button>
        </div>
    </div>
    </div>
    <div id="main-ui-screens" style="display: none;">
        
        <header class="screen-header">
            <h2 id="screen-title"></h2>
            <button onclick="hideMainUIScreen()" class="close-btn">❌ 閉じる</button>
        </header>

        <section id="menu-screen" class="ui-screen active-screen">
            <h3>🏠 メインメニュー</h3>
            <div class="menu-list">
                <button onclick="switchScreen('monsters')">🐉 モンスター一覧</button>
                <button onclick="switchScreen('pokedex')">📘 図鑑</button>
                <button onclick="switchScreen('items')">🎒 アイテム一覧</button>
                <button onclick="switchScreen('settings')">⚙️ 設定</button>
                <button onclick="toggleCapture(true)" style="margin-top: 15px;">🔴 捕獲シーンテスト</button>
            </div>
        </section>

        <section id="monsters-screen" class="ui-screen hidden-screen">
            <h3>🐉 モンスター一覧</h3>
            <div id="monster-list-view">
                <p>捕まえたカカオマメモンスターがここに表示されます。</p>
            </div>
        </section>

        <section id="pokedex-screen" class="ui-screen hidden-screen">
            <h3>📘 図鑑</h3>
            <div id="pokedex-view">
                <p>モンスターの図鑑情報がここに表示されます。</p>
            </div>
        </section>

        <section id="items-screen" class="ui-screen hidden-screen">
            <h3>🎒 アイテム一覧</h3>
            <div id="item-list-view">
                <p>アイテムのリストと使用ボタンがここに表示されます。</p>
                <div class="item-category">
                    <h4>💎 回復アイテム (kaihuku-item)</h4>
                    <button onclick="useItem('kizugusuri', {hp: 50, max_hp: 100})">キズぐすり × 5</button>
                </div>
            </div>
        </section>

        <section id="settings-screen" class="ui-screen hidden-screen">
            <h3>⚙️ 設定</h3>
            <div id="settings-view">
                <p>各種設定オプション</p>
            </div>
        </section>

    </div>
    <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script> 
    
    <script src="https://unpkg.com/three@0.160.0/examples/js/loaders/OBJLoader.js"></script>
    <script src="https://unpkg.com/three@0.160.0/examples/js/loaders/MTLLoader.js"></script> 
    
    <script src="./capture_3d.js"></script>
    <script src="./map_manager.js"></script>
    <script src="./item.js"></script>
    <script src="./ui_manager.js"></script>

</body>
</html>
