<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="無限に進化する3Dキューブで防衛せよ！">
    <meta name="author" content="Gemini programming隊">
    <meta name="robots" content="index, follow">
    <title>Merge Craft 3D: Ultimate</title>
    <style>
        :root { --primary-bg: #121212; --panel-bg: #2c3e50; --accent: #e74c3c; }
        body { background-color: var(--primary-bg); color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; margin: 0; padding-bottom: 50px; }
        #logo { width: 60px; margin-top: 10px; }
        #game-container { margin: 10px auto; width: 95%; max-width: 450px; background: var(--panel-bg); padding: 15px; border-radius: 20px; border: 4px solid #34495e; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        /* 3Dステータス表示 */
        .status-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; background: #16a085; padding: 10px; border-radius: 10px; margin-bottom: 15px; font-weight: bold; font-size: 0.8rem; }
        
        /* 3Dキューブ表示 */
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin: 20px auto; }
        .slot { width: 100%; aspect-ratio: 1/1; display: flex; align-items: center; justify-content: center; position: relative; }
        .scene { width: 60px; height: 60px; perspective: 300px; }
        .cube { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transform: rotateX(-20deg) rotateY(25deg); transition: transform 0.3s; }
        .cube-face { position: absolute; width: 60px; height: 60px; border: 1px solid rgba(255,255,255,0.5); line-height: 60px; font-size: 18px; font-weight: bold; text-shadow: 1px 1px 2px #000; }
        .front  { transform: rotateY(  0deg) translateZ(30px); }
        .back   { transform: rotateY(180deg) translateZ(30px); }
        .right  { transform: rotateY( 90deg) translateZ(30px); }
        .left   { transform: rotateY(-90deg) translateZ(30px); }
        .top    { transform: rotateX( 90deg) translateZ(30px); }
        .bottom { transform: rotateX(-90deg) translateZ(30px); }

        /* 敵：カクカク丸 */
        #enemy-area { background: #34495e; padding: 20px; border-radius: 15px; margin-bottom: 15px; position: relative; overflow: hidden; }
        .boss-active { border: 3px solid #f1c40f; box-shadow: 0 0 15px #f1c40f; }
        .enemy-sphere { width: 60px; height: 60px; margin: 10px auto; transform-style: preserve-3d; animation: rotateEnemy 3s linear infinite; }
        .voxel-layer { position: absolute; width: 100%; height: 100%; opacity: 0.8; border: 2px solid rgba(0,0,0,0.3); }
        .v-y { transform: rotateY(90deg); } .v-x { transform: rotateX(90deg); }
        @keyframes rotateEnemy { from { transform: rotateX(0) rotateY(0); } to { transform: rotateX(360deg) rotateY(360deg); } }

        /* 操作系 */
        #build-btn { width: 100%; height: 40px; background: #e67e22; border: none; color: white; font-weight: bold; margin-bottom: 10px; cursor: pointer; border-radius: 5px; }
        #build-btn:active { background: #d35400; }
        .action-btns { display: flex; gap: 10px; }
        .action-btns button { flex: 1; padding: 12px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; color: white; }
        
        /* カラーパレット & セーブ */
        .sub-panel { background: #222; padding: 10px; border-radius: 10px; margin-top: 10px; font-size: 0.8rem; }
        .color-dot { width: 25px; height: 25px; display: inline-block; margin: 3px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
        .color-dot.active { border-color: white; transform: scale(1.2); }
        input { width: 70%; padding: 5px; font-size: 0.7rem; margin-top: 5px; }
    </style>
</head>
<body>

    <img src="https://kakaomames.github.io/rei/logo.png" alt="logo" id="logo">
    <h2 style="margin: 5px;">Merge Craft 3D 🧊</h2>

    <div id="game-container">
        <div class="status-grid">
            <div>💰 <span id="gold">100</span></div>
            <div>❤️ HP: <span id="hp">10</span></div>
            <div>🌊 Wave: <span id="wave">1</span></div>
        </div>

        <div id="enemy-area">
            <div id="enemy-label">ENEMY</div>
            <div id="enemy-visual"></div>
            <div style="font-size: 1.1rem; margin-top: 5px;">👾 HP: <span id="enemy-hp">50</span></div>
            <div style="color: #f1c40f; font-size: 0.8rem;">攻撃まで: <span id="timer">5.0</span>s</div>
        </div>

        <button id="build-btn" onclick="buildWall()">🔨 建築 (壁HP: <span id="whp">0</span>)</button>

        <div class="grid" id="grid"></div>

        <div class="action-btns">
            <button style="background: #2ecc71;" onclick="spawnTower()">召喚 (20G)</button>
            <button style="background: #e74c3c;" onclick="attackEnemy()">ATTACK ⚔️</button>
        </div>
    </div>

    <div class="sub-panel">
        <h4>🎨 Color Select</h4>
        <div id="palette"></div>
        <button onclick="buyColor()" style="margin-top:5px; font-size:0.7rem;">新色アンロック (500G)</button>
    </div>

    <div class="sub-panel">
        <h4>💾 Save Code (Base64)</h4>
        <input type="text" id="save-input" placeholder="Paste code here">
        <br>
        <button onclick="exportSave()">コード発行</button>
        <button onclick="importSave()">ロード</button>
    </div>

    <script>
        // --- 初期データ ---
        let gold = 100, hp = 10, wave = 1, enemyHP = 50, wallHP = 0, baseLevel = 1;
        let field = [0,0,0,0,0,0,0,0,0], timer = 5.0, isBoss = false;
        let colors = ["#3498db", "#2ecc71", "#e74c3c", "#f1c40f"];
        let selectedColor = "#3498db";
        let selectedIdx = -1;

        // --- 自動セーブ (LocalStorage) ---
        function autoSave() {
            const data = { gold, hp, wave, field, colors, selectedColor, baseLevel };
            localStorage.setItem('merge_craft_autosave', JSON.stringify(data));
        }

        function autoLoad() {
            const saved = localStorage.getItem('merge_craft_autosave');
            if (saved) {
                const d = JSON.parse(saved);
                gold = d.gold; hp = d.hp; wave = d.wave; field = d.field;
                colors = d.colors; selectedColor = d.selectedColor; baseLevel = d.baseLevel;
                updateDisplay();
            }
        }

        // --- 描画ロジック ---
        function initGrid() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            field.forEach((lvl, i) => {
                const div = document.createElement('div');
                div.className = 'slot';
                if (lvl > 0) {
                    const hueShift = lvl * 20;
                    const style = `background: ${selectedColor}; filter: hue-rotate(${hueShift}deg) brightness(${0.5 + (lvl*0.1)});`;
                    div.innerHTML = `
                        <div class="scene">
                            <div class="cube" style="${selectedIdx === i ? 'transform: rotateX(0) rotateY(0) scale(1.1);' : ''}">
                                <div class="cube-face front" style="${style}">${lvl}</div>
                                <div class="cube-face back" style="${style}">${lvl}</div>
                                <div class="cube-face right" style="${style}">${lvl}</div>
                                <div class="cube-face left" style="${style}">${lvl}</div>
                                <div class="cube-face top" style="${style}">${lvl}</div>
                                <div class="cube-face bottom" style="${style}">${lvl}</div>
                            </div>
                        </div>`;
                } else {
                    div.style.border = "1px dashed #555";
                    div.style.borderRadius = "10px";
                }
                div.onclick = () => handleMerge(i);
                grid.appendChild(div);
            });
        }

        function drawEnemy() {
            const color = isBoss ? "#9b59b6" : "#2ecc71";
            document.getElementById('enemy-visual').innerHTML = `
                <div class="enemy-sphere">
                    <div class="voxel-layer" style="background:${color}"></div>
                    <div class="voxel-layer v-y" style="background:${color}"></div>
                    <div class="voxel-layer v-x" style="background:${color}"></div>
                </div>`;
        }

        // --- ゲームロジック ---
        function handleMerge(i) {
            if (field[i] === 0) return;
            if (selectedIdx === -1) selectedIdx = i;
            else if (selectedIdx === i) selectedIdx = -1;
            else {
                if (field[selectedIdx] === field[i]) {
                    field[i]++; field[selectedIdx] = 0; selectedIdx = -1;
                    console.log(`a: ${field[i]}`);
                } else selectedIdx = i;
            }
            initGrid();
            autoSave();
        }

        function spawnTower() {
            if (gold >= 20 && field.includes(0)) {
                gold -= 20; field[field.indexOf(0)] = baseLevel;
                updateDisplay(); autoSave();
            }
        }

        function buildWall() {
            wallHP++; updateDisplay();
            console.log(`a: ${wallHP}`);
        }

        function attackEnemy() {
            let pwr = field.reduce((s, l) => s + (l > 0 ? Math.pow(2, l - 1) : 0), 1);
            enemyHP -= pwr;
            if (enemyHP <= 0) {
                wave++; gold += 50 + (wave * 10);
                isBoss = wave % 10 === 0;
                enemyHP = Math.floor((isBoss ? 300 : 50) * Math.pow(1.15, wave - 1));
                timer = isBoss ? 8.0 : 5.0;
                drawEnemy();
            }
            updateDisplay(); autoSave();
        }

        // タイマー処理
        setInterval(() => {
            timer -= 0.1;
            if (timer <= 0) {
                if (wallHP > 0) wallHP = 0;
                else { hp--; if (hp <= 0) { alert("Game Over!"); location.reload(); } }
                timer = isBoss ? 8.0 : 5.0;
            }
            document.getElementById('timer').innerText = timer.toFixed(1);
            updateDisplay();
        }, 100);

        // --- UI更新 ---
        function updateDisplay() {
            document.getElementById('gold').innerText = gold;
            document.getElementById('hp').innerText = hp;
            document.getElementById('wave').innerText = wave;
            document.getElementById('enemy-hp').innerText = enemyHP;
            document.getElementById('whp').innerText = wallHP;
            document.getElementById('enemy-label').innerText = isBoss ? "⚠️ BOSS ⚠️" : "ENEMY";
            initGrid();
        }

        function updatePalette() {
            const p = document.getElementById('palette');
            p.innerHTML = '';
            colors.forEach(c => {
                const d = document.createElement('div');
                d.className = `color-dot ${selectedColor === c ? 'active' : ''}`;
                d.style.backgroundColor = c;
                d.onclick = () => { selectedColor = c; updatePalette(); initGrid(); autoSave(); };
                p.appendChild(d);
            });
        }

        function buyColor() {
            if (gold >= 500) {
                gold -= 500;
                const newColor = `hsl(${Math.random() * 360}, 70%, 50%)`;
                colors.push(newColor);
                updatePalette(); updateDisplay(); autoSave();
            }
        }

        // --- セーブコード (Base64) ---
        function exportSave() {
            const code = btoa(JSON.stringify({ gold, hp, wave, field, colors, selectedColor, baseLevel }));
            document.getElementById('save-input').value = code;
            console.log(`a: ${code}`);
        }

        function importSave() {
            try {
                const d = JSON.parse(atob(document.getElementById('save-input').value));
                gold = d.gold; hp = d.hp; wave = d.wave; field = d.field;
                colors = d.colors; selectedColor = d.selectedColor;
                updateDisplay(); updatePalette(); alert("Loaded!");
            } catch(e) { alert("Invalid Code"); }
        }

        // 起動
        autoLoad();
        updatePalette();
        drawEnemy();
        updateDisplay();

    </script>
</body>
</html>
