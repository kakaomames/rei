<!DOCTYPE html>
<html>
<head>
    <title>OpenStreetMap + Leaflet Custom Map (Debug Mode)</title>
    <meta charset="utf-8">
    <style>
        /* ⭐ マップ表示に必須なCSS。高さ100%を保証 */
        html, body, #map {
            height: 100%; 
            margin: 0;
            padding: 0;
            overflow: hidden; 
        }
    </style>
    </head>
<body>
    <div id="map"></div>

    <script>
        // ===========================================
        // グローバル変数とデバッグ用定数
        // ===========================================
        let map;
        let playerMarker;
        let pokemonMarkers = [];
        let landmarkMarkers = [];
        const initialCoords = [35.681236, 139.767125]; 
        const TRANSPARENT_IMAGE = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=';

        // ランドマーク/ポケモンのアイコンはダミーURLのままにしておきます
        const LANDMARKS = [
          {"lat": 35.6816, "lng": 139.766, "type": "gym"},
          {"lat": 35.6808, "lng": 139.7675, "type": "pokestop"},
        ];
        const LANDMARK_ICONS = {
            'gym': 'https://example.com/gym.png',
            'pokestop': 'https://example.com/pokestop.png'
        };
        const POKEMON_ICONS = {
            'pikachu': 'https://example.com/pikachu.png',
        };

        // ===========================================
        // 外部スクリプトの動的ロードと遅延関数
        // ===========================================
        function loadLeafletDependencies() {
            console.log("[DEBUG:INIT] 0.5秒の遅延後、Leafletの読み込みを開始します。");

            // 1. CSSを動的にロード
            const link = document.createElement('link');
            link.rel = 'stylesheet';
            link.href = './leaflet/leaflet.css';
            link.integrity = 'sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=';
            link.crossOrigin = '';
            document.head.appendChild(link);
            console.log("[DEBUG:LOAD] Leaflet CSSをDOMに追加しました。");

            // 2. JSを動的にロード
            const script = document.createElement('script');
            script.src = './leaflet/leaflet.js';
            script.integrity = 'sha256-20n6s/rYQk2hWOf9TLhMTFu7QW+K0H8SAzE5X3fVTC0=';
            script.crossOrigin = '';
            
            script.onload = () => {
                console.log("[DEBUG:LOAD] Leaflet JSのロードが完了しました。地図の初期化関数(initMap)を実行します。");
                initMap(); // ロード完了後に地図を初期化
            };
            script.onerror = (e) => {
                 console.error("[ERROR:LOAD] Leaflet JSのロード中にエラーが発生しました。", e);
            };

            document.body.appendChild(script);
        }

        // ===========================================
        // Leaflet マップ 初期化関数
        // ===========================================
        function initMap() {
            if (typeof L === 'undefined') {
                console.error("[ERROR:INIT] L (Leaflet) オブジェクトが見つかりません。ロード失敗の可能性があります。");
                return;
            }
            console.log("[DEBUG:INIT] L (Leaflet) オブジェクトを確認しました。マップ初期化開始。");

            try {
                map = L.map('map').setView(initialCoords, 17);
                console.log("[DEBUG:INIT] Leafletマップを作成しました。");
                
                L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    maxZoom: 19,
                    attribution: '© OpenStreetMap contributors' 
                }).addTo(map);
                console.log("[DEBUG:INIT] OpenStreetMapタイルレイヤーを追加しました。");

                // プレイヤーマーカーの初期化
                const dummyIcon = L.icon({
                    iconUrl: TRANSPARENT_IMAGE, // 透明画像を使用
                    iconSize: [64, 64],
                    iconAnchor: [32, 64]
                });
                playerMarker = L.marker(initialCoords, { icon: dummyIcon }).addTo(map);
                console.log("[DEBUG:INIT] プレイヤーマーカーを初期位置に追加しました。");

                loadLandmarks();
                
                // ポケモン生成タイマー
                setInterval(() => {
                    if(playerMarker) {
                        const pos = playerMarker.getLatLng();
                        spawnRandomPokemon(pos.lat, pos.lng);
                    }
                }, 5 * 60 * 1000); 

            } catch (e) {
                console.error("[FATAL ERROR] マップの初期化中に致命的なエラーが発生しました。", e);
            }
        }
        
        // ===========================================
        // ランドマーク/ポケモン配置ロジック
        // ===========================================
        function loadLandmarks() {
            console.log(`[DEBUG:LANDMARK] ランドマーク ${LANDMARKS.length} 件の配置を開始します。`);
            LANDMARKS.forEach(landmark => {
                const icon = L.icon({
                    iconUrl: LANDMARK_ICONS[landmark.type] || TRANSPARENT_IMAGE, // 透明画像を使用
                    iconSize: [48, 48],
                    iconAnchor: [24, 24]
                });
                const marker = L.marker([landmark.lat, landmark.lng], { icon: icon }).addTo(map);
                landmarkMarkers.push(marker);
                console.log(`[DEBUG:LANDMARK] ${landmark.type}を配置 (Lat: ${landmark.lat})`);
            });
        }
        
        function spawnRandomPokemon(centerLat, centerLng) {
            // ... (ランダム座標計算ロジックは省略)
            // ... (中略) ...
            
            const lat = centerLat + (Math.random() * 0.0005 * Math.cos(Math.random() * 2 * Math.PI));
            const lng = centerLng + (Math.random() * 0.0005 * Math.sin(Math.random() * 2 * Math.PI));
            
            const pokemonNames = Object.keys(POKEMON_ICONS);
            const chosenPokemon = pokemonNames[Math.floor(Math.random() * pokemonNames.length)];

            const icon = L.icon({
                iconUrl: POKEMON_ICONS[chosenPokemon] || TRANSPARENT_IMAGE,
                iconSize: [40, 40],
                iconAnchor: [20, 20]
            });
            
            const marker = L.marker([lat, lng], { icon: icon }).addTo(map);
            pokemonMarkers.push(marker);
            
            console.log(`[DEBUG:POKEMON] ${chosenPokemon}を生成しました。15分後に消滅します。`);
            
            // 15分後に自動消滅
            setTimeout(() => {
                map.removeLayer(marker); 
                pokemonMarkers = pokemonMarkers.filter(m => m !== marker); 
                console.log(`[DEBUG:POKEMON] ${chosenPokemon}を消滅させました。`);
            }, 15 * 60 * 1000); 
        }

        // ===========================================
        // マーカー/マップ更新ロジック (postMessage受信時)
        // ===========================================

        function updateSpriteMarker(lat, lng, imageData) {
            console.log(`[DEBUG:MSG] UPDATE_SPRITEを受信しました。Lat:${lat}, Lon:${lng}`);
            const newPos = [lat, lng];
            
            if (playerMarker) {
                playerMarker.setLatLng(newPos);

                if (imageData && imageData.length > 50) { 
                    const customIcon = L.icon({
                        iconUrl: imageData,
                        iconSize: [64, 64],
                        iconAnchor: [32, 64] 
                    });
                    playerMarker.setIcon(customIcon);
                    console.log("[DEBUG:MSG] スプライトアイコンをBase64画像に更新しました。");
                }
                
                map.panTo(newPos);
                console.log("[DEBUG:MSG] マップをプレイヤーの位置にセンタリングしました。");
            }
        }

        function updateMapView(lat, lng, radius) {
             console.log(`[DEBUG:MSG] UPDATE_MAP_VIEWを受信しました。Lat:${lat}, Lon:${lng}, Radius:${radius}`);
             const newCenter = [lat, lng];
             map.panTo(newCenter);

             const zoomLevel = Math.max(12, Math.min(19, Math.floor(-Math.log2(radius) + 11)));
             map.setZoom(zoomLevel);
             console.log(`[DEBUG:MSG] ズームレベルを ${zoomLevel} に設定しました。`);
        }

        // ===========================================
        // postMessage リスナー
        // ===========================================
        window.addEventListener('message', (event) => {
            const data = event.data;
            if (!data || !data.type) {
                 console.warn("[WARN:MSG] 受信したメッセージの形式が不正です。");
                 return;
            }

            console.log(`[DEBUG:MSG] 受信メッセージタイプ: ${data.type}`);
            switch (data.type) {
                case 'UPDATE_SPRITE':
                    updateSpriteMarker(data.latitude, data.longitude, data.imageData);
                    break;
                case 'UPDATE_MAP_VIEW':
                    updateMapView(data.latitude, data.longitude, data.radius);
                    break;
                default:
                    console.warn(`[WARN:MSG] 未知のメッセージタイプ: ${data.type}`);
            }
        });

        // ⭐ 0.5秒の遅延を設定してLeafletのロードを開始
        setTimeout(loadLeafletDependencies, 500);
        
    </script>
</body>
</html>
