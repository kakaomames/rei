<!DOCTYPE html>
<html>
<head>
    <title>OpenStreetMap + Leaflet Custom Map (Zero Cost)</title>
    <style>
        /* Iframe全体を使うためのCSSリセット */
        html, body, #map {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden; 
        }
    </style>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
</head>
<body>
    <div id="map"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20n6s/rYQk2hWOf9TLhMTFu7QW+K0H8SAzE5X3fVTC0=" crossorigin=""></script>

    <script>
        // ===========================================
        // Leaflet マップ 初期化とグローバル変数
        // ===========================================
        let map;
        let playerMarker;
        let pokemonMarkers = []; // ポケモン
        let landmarkMarkers = []; // ジム/ポケストップ
        const initialCoords = [35.681236, 139.767125]; // 初期表示座標

        function initMap() {
            map = L.map('map').setView(initialCoords, 17);
            
            // OpenStreetMapのタイルレイヤーを追加
            L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '© OpenStreetMap contributors' 
            }).addTo(map);

            // プレイヤーマーカーの初期化（カスタムスプライト用）
            const dummyIcon = L.icon({
                iconUrl: 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=',
                iconSize: [64, 64],
                iconAnchor: [32, 64]
            });
            playerMarker = L.marker(initialCoords, { icon: dummyIcon }).addTo(map);

            loadLandmarks();
            // 5分ごとにポケモンを自動生成するタイマーを開始
            setInterval(() => {
                if(playerMarker) {
                    const pos = playerMarker.getLatLng();
                    spawnRandomPokemon(pos.lat, pos.lng);
                }
            }, 5 * 60 * 1000); 
        }
        initMap();

        // ===========================================
        // ランドマーク/ポケモン配置ロジック
        // ===========================================
        
        const LANDMARKS = [
          {"lat": 35.6816, "lng": 139.766, "type": "gym"},
          {"lat": 35.6808, "lng": 139.7675, "type": "pokestop"},
        ];
        const LANDMARK_ICONS = {
            'gym': 'https://example.com/gym.png', // ⭐ 実際の画像URL/Base64に置き換える
            'pokestop': 'https://example.com/pokestop.png' // ⭐ 実際の画像URL/Base64に置き換える
        };
        const POKEMON_ICONS = {
            'pikachu': 'https://example.com/pikachu.png', // ⭐ 実際の画像URL/Base64に置き換える
        };

        function loadLandmarks() {
            LANDMARKS.forEach(landmark => {
                const icon = L.icon({
                    iconUrl: LANDMARK_ICONS[landmark.type] || 'https://developers.google.com/maps/documentation/javascript/advanced-markers/migration',
                    iconSize: [48, 48],
                    iconAnchor: [24, 24]
                });
                const marker = L.marker([landmark.lat, landmark.lng], { icon: icon }).addTo(map);
                landmarkMarkers.push(marker);
            });
        }
        
        function spawnRandomPokemon(centerLat, centerLng) {
            const randomAngle = Math.random() * 2 * Math.PI;
            const randomDistance = Math.random() * 0.0005; 
            
            const lat = centerLat + randomDistance * Math.cos(randomAngle);
            const lng = centerLng + randomDistance * Math.sin(randomAngle);
            
            const pokemonNames = Object.keys(POKEMON_ICONS);
            const chosenPokemon = pokemonNames[Math.floor(Math.random() * pokemonNames.length)];

            const icon = L.icon({
                iconUrl: POKEMON_ICONS[chosenPokemon],
                iconSize: [40, 40],
                iconAnchor: [20, 20]
            });
            
            const marker = L.marker([lat, lng], { icon: icon }).addTo(map);
            pokemonMarkers.push(marker);

            // 15分後に自動消滅
            setTimeout(() => {
                map.removeLayer(marker); 
                pokemonMarkers = pokemonMarkers.filter(m => m !== marker); 
            }, 15 * 60 * 1000); 
        }

        // ===========================================
        // マーカー/マップ更新ロジック (postMessage受信時)
        // ===========================================

        function updateSpriteMarker(lat, lng, imageData) {
            const newPos = [lat, lng];
            
            if (playerMarker) {
                playerMarker.setLatLng(newPos);

                if (imageData && imageData.length > 50) { 
                    const customIcon = L.icon({
                        iconUrl: imageData,
                        iconSize: [64, 64],
                        iconAnchor: [32, 64] 
                    });
                    playerMarker.setIcon(customIcon);
                }
                
                map.panTo(newPos);
            }
        }

        function updateMapView(lat, lng, radius) {
             const newCenter = [lat, lng];
             map.panTo(newCenter);

             const zoomLevel = Math.max(12, Math.min(19, Math.floor(-Math.log2(radius) + 11)));
             map.setZoom(zoomLevel);
        }

        // ===========================================
        // postMessage リスナー
        // ===========================================
        window.addEventListener('message', (event) => {
            const data = event.data;
            if (!data || !data.type) return;

            switch (data.type) {
                case 'UPDATE_SPRITE':
                    updateSpriteMarker(data.latitude, data.longitude, data.imageData);
                    break;
                case 'UPDATE_MAP_VIEW':
                    updateMapView(data.latitude, data.longitude, data.radius);
                    break;
            }
        });
    </script>
</body>
</html>
