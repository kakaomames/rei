name: Custom Command Execution and Deploy

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # ジョブ名をシンプルに「deploy」一つにまとめるぞ！
  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Node.jsのセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Pythonのセットアップ
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: JARファイルを調達 (25MB制限を突破！)
        run: |
          echo "ミッション：巨大なJARファイルを外部から確保する！"
          mkdir -p public/jar
          # ここにJARファイルの直リンクをセット！
          JAR_URL="https://github.com/kakaomames/rei/releases/download/1-21-8/1.21.8.jar" 
          

          
          echo "downloading: $JAR_URL"
          curl -L "$JAR_URL" -o public/jar/1.21.8.jar
          echo "file_size: $(du -h public/jar/1.21.8.jar)"

      - name: PythonスクリプトでHTML生成
        run: |
          python -c "
          import os
          target = '1.21.8.jar'
          logo_url = 'https://kakaomames.github.io/rei/logo.png'
          print(f'target:{target}')
          print(f'logo_url:{logo_url}')

          html_content = f'''<!DOCTYPE html>
          <html>
          <head>
              <meta charset=\"utf-8\">
              <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">
              <link rel=\"icon\" href=\"{logo_url}\">
              <title>Gemini Explorer - 1.21.8</title>
              <script src=\"https://cjrtnc.leaningtech.com/3.0/loader.js\"></script>
              <style>body{{background:#1a1a1a;color:white;text-align:center;padding:50px;}}</style>
          </head>
          <body>
              <img src=\"{logo_url}\" style=\"width:100px;\">
              <h1>1.21.8 Mission Control</h1>
              <script>
                  cheerpjInit().then(() => {{ cheerpjRunJar(\"/app/archive/{target}\"); }});
              </script>
          </body>
          </html>'''

          with open('public/jar/index.html', 'w', encoding='utf-8') as f:
              f.write(html_content)
          print('status: index.html has been created in public/jar!')
          "

      - name: 成果物をアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: GitHub Pagesへデプロイ！🚀
        id: deployment
        uses: actions/deploy-pages@v4
          
