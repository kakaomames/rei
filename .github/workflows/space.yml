name: minecraft-通信 🛰️

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  wake-up-base:
    runs-on: ubuntu-latest
    # 403エラーをぶっ飛ばすための権限付与！
    permissions:
      contents: write
      codespaces: write
      
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CODESPACE_NAME: ${{ secrets.MY_CODESPACE_NAME }}
      
    steps:
      - name: 📡 基地の状態を確認 & 起動
        run: |
          echo "Target Codespace: $CODESPACE_NAME"
          # 状態を確認
          STATUS=$(gh codespace list --json name,state --jq ".[] | select(.name==\"$CODESPACE_NAME\") | .state")
          echo "current_status: $STATUS"
          
          if [ "$STATUS" != "Available" ]; then
            echo "基地が沈黙中。再起動シーケンス開始... 🔥"
            gh codespace resume -c $CODESPACE_NAME
          else
            echo "✅ 基地はすでに稼働中だ！"
          fi

      - name: 🧪 最終疎通テスト (Port 5000)
        run: |
          sleep 10
          # ポート5000番がPublicになっていれば、ここから叩けるぞ！
          TARGET_URL="https://${CODESPACE_NAME}-5000.app.github.dev/"
          echo "testing_url: $TARGET_URL"
          RESPONSE=$(curl -L -s -o /dev/null -w "%{http_code}" $TARGET_URL)
          echo "http_response: $RESPONSE"
