name: Invidious Silent Extraction 🛰️

on:
  workflow_dispatch:
  push:
    paths: [ 'video.txt' ]

jobs:
  extract-and-rescue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Security Check
        run: |
          python -c "
          import sys
          with open('video.txt', 'r') as f:
              v = f.read().strip()
          print(f'current_v:{v}')
          if len(v) >= 20: sys.exit(1)
          "

      - name: Create Docker Compose File
        run: |
          cat <<EOF > docker-compose.yml
          services:
            db:
              image: docker.io/library/postgres:14-alpine
              environment:
                - POSTGRES_DB=invidious
                - POSTGRES_USER=kemal
                - POSTGRES_PASSWORD=kemal
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U kemal -d invidious"]
                interval: 5s
                timeout: 5s
                retries: 5
            invidious:
              image: quay.io/invidious/invidious:latest
              ports:
                - "3000:3000"
              environment:
                - INVIDIOUS_DATABASE_URL=postgres://kemal:kemal@db:5432/invidious
              depends_on:
                db:
                  condition: service_healthy
          EOF

      - name: Deploy Invidious Stack
        run: |
          docker compose up -d
          echo "Waiting for Invidious to stabilize..."

      - name: Python Mission Control (With Retries)
        run: |
          python -c "
          import requests, uuid, os, subprocess, time

          with open('video.txt', 'r') as f:
              video_id = f.read().strip()
          print(f'target_id:{video_id}')

          task_id = str(uuid.uuid4())
          print(f'task_id:{task_id}')
          os.makedirs(task_id, exist_ok=True)

          api_endpoint = f'http://localhost:3000/api/v1/videos/{video_id}'
          
          # 最大10回リトライするぞ！
          response = None
          for i in range(10):
              try:
                  print(f'Attempt {i+1}: Checking Invidious API...')
                  response = requests.get(api_endpoint, params={'local': 'true'}, timeout=10)
                  if response.status_code == 200:
                      print('Connection established!')
                      break
              except Exception as e:
                  print(f'Wait... {e}')
              time.sleep(10)

          if response and response.status_code == 200:
              data = response.json()
              video_data = data['formatStreams'][0]
              proxy_url = f'http://localhost:3000{video_data[\"url\"]}'
              print(f'proxy_url_ready:{proxy_url[:60]}...')

              print('Starting download...')
              subprocess.run(['curl', '-L', proxy_url, '-o', f'{task_id}/video.mp4'], check=True)
              
              with open('video.txt', 'w') as f:
                  f.write(task_id)
          else:
              print('Failed to connect after retries.')
              exit(1)
          "

      - name: Show Docker Logs on Failure
        if: failure()
        run: docker compose logs invidious

      - name: Deliver Spoils
        if: always()
        run: |
          git config --global user.name 'Gemini-Bot'
          git config --global user.email 'bot@gemini.team'
          git add .
          # メッセージをシンプルにしてクォート事故を防止！
          git commit -m "Mission_Update_Skip_CI" || echo "No changes"
          git push
