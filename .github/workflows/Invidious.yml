name: Invidious Silent Extraction 🛰️

on:
  push:
    paths: [ 'video.txt' ]

jobs:
  extract-and-rescue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. 検問（20文字以上ならKill）
      - name: Security Check
        run: |
          python -c "
          import sys
          with open('video.txt', 'r') as f:
              v = f.read().strip()
          print(f'current_v:{v}')
          if len(v) >= 20: sys.exit(1)
          "

      # 2. docker-compose.yml をその場で作成（確実にdbとinvidiousを定義！）
      - name: Create Docker Compose File
        run: |
          cat <<EOF > docker-compose.yml
          services:
            db:
              image: docker.io/library/postgres:14-alpine
              environment:
                - POSTGRES_DB=invidious
                - POSTGRES_USER=kemal
                - POSTGRES_PASSWORD=kemal
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U kemal -d invidious"]
                interval: 5s
                timeout: 5s
                retries: 5
            invidious:
              image: quay.io/invidious/invidious:latest
              ports:
                - "3000:3000"
              environment:
                - INVIDIOUS_DATABASE_URL=postgres://kemal:kemal@db:5432/invidious
              depends_on:
                db:
                  condition: service_healthy
          EOF

      # 3. 起動！
      - name: Deploy Invidious Stack
        run: |
          docker compose up -d
          echo "Waiting for Invidious to stabilize..."
          sleep 60 # DBが立ち上がってからInvidiousが準備完了するまで少し長めに待つぞ

      # 4. URL奪取 & DL (Python)
      - name: Python Mission Control
        run: |
          python -c "
          import requests, uuid, os, subprocess, time

          with open('video.txt', 'r') as f:
              video_id = f.read().strip()
          print(f'target_id:{video_id}')

          task_id = str(uuid.uuid4())
          print(f'task_id:{task_id}')
          os.makedirs(task_id, exist_ok=True)

          # ローカルのAPIを叩く
          api_endpoint = f'http://localhost:3000/api/v1/videos/{video_id}'
          
          try:
              # local=trueでプロキシ経由のURLをリクエスト
              response = requests.get(api_endpoint, params={'local': 'true'})
              print(f'api_status:{response.status_code}')
              data = response.json()
              
              # 動画ストリームの取得
              video_data = data['formatStreams'][0]
              proxy_relative_url = video_data['url']
              proxy_full_url = f'http://localhost:3000{proxy_relative_url}'
              print(f'proxy_url_ready:{proxy_full_url[:60]}...')

              # curlでDL（html以外はcurlの掟！）
              print('Starting download...')
              subprocess.run(['curl', '-L', proxy_full_url, '-o', f'{task_id}/video.mp4'], check=True)
              print(f'file_saved: {task_id}/video.mp4')

              # video.txt 更新
              with open('video.txt', 'w') as f:
                  f.write(task_id)

          except Exception as e:
              print(f'error_occured:{e}')
              # 失敗した時のためにログを残す
              with open(f'{task_id}/error.log', 'w') as f:
                  f.write(str(e))
          "

      # 5. コミット & プッシュ
      - name: Deliver Spoils
        if: always() # エラーが起きてもログを回収するために常に実行
        run: |
          git config --global user.name 'Gemini-Bot'
          git config --global user.email 'bot@gemini.team'
          git add .
          git commit -m \"Mission Progress: Recovery attempted [skip ci]\" || echo "No changes to commit"
          git push
