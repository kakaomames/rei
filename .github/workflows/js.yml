name: Remote WSS Server Start
on:
  workflow_dispatch:

jobs:
  start-server:
    runs-on: ubuntu-latest
    steps:
      - name: Force Start and Run Server
        env:
          CS_NAME: "super-duper-capybara-q79696754xqq3rrr"
          GH_TOKEN: ${{ secrets.MY_MASTER_TOKEN }}
        run: |
          echo "Target Base: $CS_NAME"
          
          # 1. サーバー設置と起動
          # nodeを起動したあと、sleep 5 で少し待たせるのがコツだ！
          echo "基地にサーバーを設置して起動します..."
          gh codespace ssh -c "$CS_NAME" -- "npm install ws && cat <<EOF > server.js
          const WebSocket = require('ws');
          const wss = new WebSocket.Server({ port: 8080 });
          wss.on('connection', (ws, req) => {
            ws.on('message', (msg) => { if (req.url === '/text') ws.send(msg.toString()); });
          });
          console.log('Server is ready on 8080');
          EOF
          (node server.js > server.log 2>&1 &) && sleep 5"
          
          # 2. ポートの強制公開
          # まずは visibility を変える前に「ポートが存在する」と認識させる
          echo "ポート8080を公開設定に変更中..."
          # もし404が出るなら、一度 ssh 経由で中のポートを叩いて刺激を与える
          gh codespace ssh -c "$CS_NAME" -- "curl -I http://localhost:8080 || true"
          
          # ここで本番の公開設定！
          gh codespace ports visibility 8080:public -c "$CS_NAME"
          
          echo "✅ 【完全勝利】 サーバーは公開されました！"
          echo "Safariから繋ぐURL: wss://super-duper-capybara-q79696754xqq3rrr-8080.app.github.dev/text"
