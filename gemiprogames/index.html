<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Gemini programming隊 - 探検本部ポータル">
    <meta name="author" content="カカオマメ">
    <meta property="og:image" content="https://kakaomames.github.io/rei/logo.png">
    <title>WE Portal: Gemini programming隊</title>
    <style>
        :root { --main-color: #00ff00; --accent-color: #ff00ff; }
        body { 
            background-color: #050505; color: var(--main-color); 
            font-family: 'Courier New', Courier, monospace; margin: 0; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh;
        }
        .logo { width: 80px; height: 80px; margin: 20px; filter: drop-shadow(0 0 5px var(--main-color)); }
        .container { 
            border: 1px solid var(--main-color); padding: 20px; background: rgba(0, 20, 0, 0.9);
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.2); text-align: center; max-width: 600px; width: 90%;
        }
        .mission-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .mission-card { 
            border: 1px dashed var(--main-color); padding: 15px; text-align: left;
            transition: 0.3s; cursor: pointer; position: relative;
        }
        .mission-card:hover { background: rgba(0, 255, 0, 0.1); transform: translateY(-5px); }
        .mission-card.m2 { border-color: var(--accent-color); color: var(--accent-color); }
        .mission-card.m2:hover { background: rgba(255, 0, 255, 0.1); }
        
        h2 { font-size: 18px; margin-top: 0; border-bottom: 1px solid; }
        p { font-size: 12px; line-height: 1.4; height: 80px; }
        
        .btn {
            display: inline-block; width: 100%; padding: 10px; margin-top: 10px;
            background: var(--main-color); color: #000; font-weight: bold; border: none; cursor: pointer;
        }
        .m2 .btn { background: var(--accent-color); }
        .btn:hover { opacity: 0.8; }
        
        footer { margin-top: 20px; font-size: 10px; opacity: 0.5; }
    </style>
</head>
<body>

    <img src="https://kakaomames.github.io/rei/logo.png" alt="logo" class="logo">

    <div class="container">
        <h1>Gemini programming隊 本部</h1>
        <p style="height: auto; text-align: center;">カカオマメ隊員、ミッションを選択してください。</p>
        
        <div class="mission-grid">
            <div class="mission-card m1" id="m1Card">
                <h2>MISSION 01: ESCAPE</h2>
                <p>
                    【回避訓練】<br>
                    上下移動のブーストを駆使して、迫りくる障害物を回避せよ。<br>
                    壁や敵に接触すると即ミッション失敗となる。
                </p>
                <button class="btn" onclick="go('./1.html')">GO (1.html)</button>
            </div>

            <div class="mission-card m2" id="m2Card">
                <h2>MISSION 02: STRIKE</h2>
                <p>
                    【迎撃訓練】<br>
                    画面下から光弾を発射し、落下してくるターゲットを撃破せよ。<br>
                    防衛ライン（画面最下部）を守り抜け。
                </p>
                <button class="btn" onclick="go('./2.html')">GO (2.html)</button>
            </div>
        </div>
    </div>

    <footer>Logged in as: Gemini programming隊員 / System: Web Edition v1.2</footer>

<script>
function missionLog(type, message) {
    console.log(`[${new Date().toISOString()}] [${type}] ${message}`);
}

function go(target) {
    missionLog("ACTION", `${target} へ遷移開始。`);
    // 隊員指定の遷移プロトコル
    window.location.href = target;
}

missionLog("SYSTEM", "ポータル画面：全ミッション説明をロード完了。");
</script>
</body>
</html>
