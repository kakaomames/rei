<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Gemini programming隊 - 探検本部ポータル">
    <meta name="keywords" content="Minecraft, WE, Game, JavaScript, Programming, カカオマメ">
    <meta name="author" content="カカオマメ">
    <meta property="og:title" content="Gemini programming隊 本部">
    <meta property="og:description" content="最短・高品質ゲームプロジェクト。出撃準備完了。">
    <meta property="og:image" content="https://kakaomames.github.io/rei/logo.png">
    <meta property="og:type" content="website">
    <meta name="theme-color" content="#00ff00">
    <title>Gemini programming隊 - Portal</title>
    <style>
        body { 
            background-color: #050505; 
            color: #00ff00; 
            font-family: 'Courier New', Courier, monospace; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh;
        }
        .logo { width: 100px; height: 100px; margin-bottom: 20px; filter: drop-shadow(0 0 5px #00ff00); }
        .container { 
            border: 1px solid #00ff00; 
            padding: 40px; 
            background: rgba(0, 20, 0, 0.8);
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.3);
            text-align: center;
            max-width: 450px;
            border-radius: 5px;
        }
        h1 { font-size: 22px; letter-spacing: 2px; margin-bottom: 20px; }
        .info-box { 
            text-align: left; 
            font-size: 13px; 
            background: rgba(0,0,0,0.5); 
            padding: 15px; 
            border-left: 3px solid #00ff00;
            margin-bottom: 25px;
        }
        .btn {
            background: #00ff00;
            color: #000;
            padding: 12px 30px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
            text-transform: uppercase;
            transition: all 0.2s;
        }
        .btn:hover { 
            background: #fff; 
            box-shadow: 0 0 20px #fff;
            transform: scale(1.05);
        }
        footer { margin-top: 20px; font-size: 10px; opacity: 0.6; }
    </style>
</head>
<body>

    <img src="https://kakaomames.github.io/rei/logo.png" alt="logo" class="logo">

    <div class="container">
        <h1>GEOMETRIC ESCAPE</h1>
        
        <div class="info-box">
            <strong>【操作マニュアル】</strong><br>
            ・CLICK/TAP : 上昇（BOOST）<br>
            ・[P] KEY    : 一時停止/再開<br>
            ・[ESC] KEY  : 本部へ帰還<br><br>
            <strong>【ミッション】</strong><br>
            赤いブロックを回避し、最高スコアを記録せよ！
        </div>

        <button class="btn" id="launchBtn">Mission Start 🚀</button>
    </div>

    <footer>Logged in as: Gemini programming隊員</footer>

<script>
function missionLog(type, message) {
    console.log(`[${new Date().toISOString()}] [${type}] ${message}`);
}

// ボタンクリックで 1.html へ遷移
document.getElementById('launchBtn').addEventListener('click', function() {
    missionLog("ACTION", "1.html へ出撃します！");
    window.location.href = './1.html'; 
});

missionLog("SYSTEM", "本部ポータル、オンライン。");
</script>
</body>
</html>
