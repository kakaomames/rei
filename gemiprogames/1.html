<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Gemini Programming隊による一時停止機能付きゲーム">
    <meta name="author" content="カカオマメ">
    <meta property="og:image" content="https://kakaomames.github.io/rei/logo.png">
    <title>WE: Geometric Escape - Pause Mod</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', Courier, monospace; }
        canvas { display: block; }
        #ui { position: absolute; top: 20px; left: 20px; color: #0f0; font-size: 20px; pointer-events: none; }
        #msg, #pauseMsg { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            color: #fff; font-size: 40px; text-align: center; display: none; 
            background: rgba(0,0,0,0.6); padding: 20px; border-radius: 10px;
        }
        #pauseBtn {
            position: absolute; top: 20px; right: 20px;
            padding: 10px 20px; background: #333; color: #fff; border: 2px solid #0f0;
            cursor: pointer; font-size: 16px;
        }
    </style>
</head>
<body>

    <div id="ui">SCORE: <span id="score">0</span></div>
    <button id="pauseBtn">PAUSE (P)</button>
    
    <div id="msg">GAME OVER<br><span style="font-size: 20px;">Click to Restart</span></div>
    <div id="pauseMsg">PAUSED<br><span style="font-size: 20px;">Press 'P' or Click to Resume</span></div>

    <canvas id="gameCanvas"></canvas>

<script>
function missionLog(type, message) {
    console.log(`[${new Date().toISOString()}] [${type}] ${message}`);
}

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const msgEl = document.getElementById('msg');
const pauseMsgEl = document.getElementById('pauseMsg');
const pauseBtn = document.getElementById('pauseBtn');

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let score = 0;
let gameActive = true;
let isPaused = false; // 一時停止フラグ
let particles = [];
const obstacles = [];
const obstacleSpeed = 5;

const player = {
    x: 100,
    y: canvas.height / 2,
    size: 20,
    color: '#00ccff',
    dy: 0,
    jumpForce: -8,
    gravity: 0.4
};

function togglePause() {
    if (!gameActive) return;
    
    isPaused = !isPaused;
    pauseMsgEl.style.display = isPaused ? 'block' : 'none';
    missionLog("STATE_CHANGE", isPaused ? "一時停止" : "再開");
}

function update() {
    if (!gameActive || isPaused) return; // 停止中は計算しない

    player.dy += player.gravity;
    player.y += player.dy;

    if (player.y + player.size > canvas.height || player.y < 0) gameOver();

    if (Math.random() < 0.02) {
        const size = Math.random() * 50 + 20;
        obstacles.push({ x: canvas.width, y: Math.random() * (canvas.height - size), w: size, h: size, color: '#ff0055' });
    }

    for (let i = obstacles.length - 1; i >= 0; i--) {
        const o = obstacles[i];
        o.x -= obstacleSpeed + (score / 100);

        if (player.x < o.x + o.w && player.x + player.size > o.x &&
            player.y < o.y + o.h && player.y + player.size > o.y) gameOver();

        if (o.x + o.w < 0) {
            obstacles.splice(i, 1);
            score += 10;
            scoreEl.innerText = score;
        }
    }

    particles.forEach((p, i) => {
        p.x += p.vx; p.y += p.vy; p.life -= 0.02;
        if (p.life <= 0) particles.splice(i, 1);
    });
}

function draw() {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    particles.forEach(p => {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, 4, 4);
    });
    ctx.globalAlpha = 1.0;

    ctx.fillStyle = player.color;
    ctx.shadowBlur = 15;
    ctx.shadowColor = player.color;
    ctx.fillRect(player.x, player.y, player.size, player.size);
    ctx.shadowBlur = 0;

    obstacles.forEach(o => {
        ctx.fillStyle = o.color;
        ctx.fillRect(o.x, o.y, o.w, o.h);
    });
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

function gameOver() {
    if (!gameActive) return;
    gameActive = false;
    msgEl.style.display = 'block';
    missionLog("ACTION", "ミッション失敗...");
}

function resetGame() {
    score = 0;
    scoreEl.innerText = score;
    player.y = canvas.height / 2;
    player.dy = 0;
    obstacles.length = 0;
    gameActive = true;
    isPaused = false;
    msgEl.style.display = 'none';
    pauseMsgEl.style.display = 'none';
    missionLog("ACTION", "リスタート！");
}

// 入力制御
window.addEventListener('keydown', (e) => {
    if (e.key.toLowerCase() === 'p') {
        togglePause();
    }
});

pauseBtn.addEventListener('click', (e) => {
    e.stopPropagation(); // キャンバスのクリックイベントを防ぐ
    togglePause();
});

canvas.addEventListener('mousedown', () => {
    if (!gameActive) {
        resetGame();
    } else if (isPaused) {
        togglePause();
    } else {
        player.dy = player.jumpForce;
    }
});

loop();
missionLog("SYSTEM", "ポーズ機能搭載エンジン、起動！");
</script>
</body>
</html>
