<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>メニュー</title>
    <style>
        body {
            background-color: #f0f0f0;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .menu-header {
            width: 100%;
            background-color: #555;
            color: white;
            padding: 15px 0;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            position: relative;
        }
        .back-button {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
        }
        .menu-content {
            padding: 20px;
            width: 100%;
            box-sizing: border-box;
            overflow-y: auto;
            flex-grow: 1;
        }
        #menu-options button {
            display: block;
            width: 80%;
            max-width: 300px;
            margin: 15px auto;
            padding: 15px;
            font-size: 18px;
            background-color: #fff;
            color: #333;
            border: 1px solid #ccc;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        #menu-options button:hover {
            background-color: #e0e0e0;
        }
        .sub-menu-content {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        .view-hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="menu-header">
        <button class="back-button" onclick="window.parent.navigate('/');">←</button>
        <h2>メインメニュー</h2>
    </div>

    <div class="menu-content" id="sub-menu-container">
        
        <div id="menu-options">
            <button onclick="window.parent.navigate('/menu/pokemon');">
                ポケモン
            </button>
            <button onclick="window.parent.navigate('/menu/inventory');">
                どうぐ
            </button>
            <button onclick="alert('設定機能は未実装です');">
                設定
            </button>
        </div>

        <div class="sub-menu-content view-hidden" data-path="/menu/pokemon">
            <button onclick="window.parent.navigate('/menu');">← メニューに戻る</button>
            <div id="pokemon-list-content" style="margin-top: 20px;">
                </div>
        </div>

        <div class="sub-menu-content view-hidden" data-path="/menu/inventory">
            <button onclick="window.parent.navigate('/menu');">← メニューに戻る</button>
            <div id="inventory-content" style="margin-top: 20px;">
                </div>
        </div>
        
    </div>
</body>
</html>
