<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ポケモンGO風 Webアプリ</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin=""/>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* 全体のスクロールを禁止 */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #333;
        }
        .view {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none; /* 初期状態では全て非表示 */
            z-index: 100;
        }
        .view-active {
            display: block; /* アクティブなビューのみ表示 */
            z-index: 200;
        }

        /* マップビュー */
        #map {
            width: 100%;
            height: 100%;
            z-index: 10;
        }
        
        /* UIオーバーレイ */
        #ui-overlay {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 100px;
            display: none; /* app.jsで制御 */
            z-index: 300;
            pointer-events: none; /* デフォルトでクリックを透過 */
        }
        
        /* メニューボタン */
        #menu-button {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 0;
            border: none;
            background: none;
            cursor: pointer;
            pointer-events: auto; /* ボタンのみクリック可能 */
            z-index: 310;
        }
        #menu-button img {
            width: 60px;
            height: 60px;
            transition: transform 0.1s;
        }
        #menu-button img:active {
            transform: scale(0.95);
        }

        /* 捕獲アニメーション用のスタイル */
        @keyframes shake {
            0%, 100% { transform: translate(0, 0) rotate(0); }
            10%, 30%, 50%, 70%, 90% { transform: translate(-5px, 0) rotate(-5deg); }
            20%, 40%, 60%, 80% { transform: translate(5px, 0) rotate(5deg); }
        }
        .shake-animation {
            animation: shake 0.5s ease-in-out 6; /* 6回揺れる */
        }

    </style>
</head>
<body>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20n6c6PBB0nQ5BN+MfeMcf-zJtISBncxbS2MjY+t7pM="
            crossorigin=""></script>

    <div id="map" class="view view-active"></div>

    <div id="capture-ui" class="view">
        <iframe src="capture.html" frameborder="0" style="width: 100%; height: 100%; border: none;"></iframe>
    </div>

    <div id="main-menu" class="view">
        <iframe src="menu.html" frameborder="0" style="width: 100%; height: 100%; border: none;"></iframe>
    </div>

    <div id="ui-overlay">
        <button onclick="window.navigate('/menu');" id="menu-button">
            <img src="../assets/item/1.png" alt="メニュー" title="バッグとポケモン">
        </button>
    </div>

    <script src="app.js"></script>
</body>
</html>
