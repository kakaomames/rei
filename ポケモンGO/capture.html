<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>捕獲</title>
    <style>
        body {
            background: linear-gradient(to bottom, #7fc1ff, #3d88d8); /* 捕獲画面の背景 */
            text-align: center;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .capture-container {
            width: 90%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        #ball-selection {
            display: flex;
            justify-content: space-around;
            width: 100%;
            margin-top: 20px;
        }
        .ball-button {
            background: none;
            border: none;
            cursor: pointer;
            padding: 10px;
            transition: transform 0.1s;
        }
        .ball-button img {
            width: 70px;
            height: 70px;
        }
        .ball-button:active {
            transform: scale(0.9);
        }
        .back-to-menu-button {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="capture-container">
        <div id="capture-target-info">
            <h2>ポケモン出現中...</h2>
        </div>

        <div id="ball-selection">
            <button class="ball-button" onclick="window.parent.attemptCapture('POKEBALL');">
                <img src="../assets/item/1.png" alt="モンスターボール">
                <p>モンスターボール</p>
            </button>
            
            <button class="ball-button" onclick="window.parent.attemptCapture('SUPERBALL');">
                <img src="../assets/item/1001.png" alt="スーパーボール">
                <p>スーパーボール</p>
            </button>
        </div>
        
    </div>

    <button class="back-to-menu-button" onclick="window.parent.navigate('/');">
        逃げる/マップに戻る
    </button>
</body>
</html>
